<style>
/* Layout: una tarjeta centrada a la vez (home, tabla, ejercicio, fin de bloque, resultados), con barra de progreso arriba. */
:root{
  --bg:#FAF8FF; --card:#FFFFFF; --ink:#392D4F; --muted:#665A7C; --line:#E4DAF4;
  --lav:#B8A1E3; --purple:#8B6FC0; --btn:#6F52A8; --btn-ink:#FFFFFF; --end:#6F52A8;
  --pink:#E7B8D8; --cream:#FFF1C9; --soft:#F2ECFB; --on:#DCCFF4;
  --ok:#216B4A; --ok-bg:#E1F3E9; --bad:#A92B49; --bad-bg:#FCE6EB; --rev:#7A5600; --rev-bg:#FFF1C9;
  --focus:#6F52A8;
  --f-head:"Poppins",system-ui,sans-serif; --f-body:"Lato",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1626; --card:#2A2236; --ink:#F2EDFA; --muted:#B9AECD; --line:#41355A;
    --lav:#7C63B3; --purple:#B8A1E3; --btn:#B8A1E3; --btn-ink:#1C1626; --end:#CDBBF2;
    --pink:#7A4A6C; --cream:#40361A; --soft:#352B47; --on:#4B3A70;
    --ok:#86D9AC; --ok-bg:#1F3A2E; --bad:#FFA3B9; --bad-bg:#4A2031; --rev:#F6D679; --rev-bg:#40361A;
    --focus:#CDBBF2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1626; --card:#2A2236; --ink:#F2EDFA; --muted:#B9AECD; --line:#41355A;
  --lav:#7C63B3; --purple:#B8A1E3; --btn:#B8A1E3; --btn-ink:#1C1626; --end:#CDBBF2;
  --pink:#7A4A6C; --cream:#40361A; --soft:#352B47; --on:#4B3A70;
  --ok:#86D9AC; --ok-bg:#1F3A2E; --bad:#FFA3B9; --bad-bg:#4A2031; --rev:#F6D679; --rev-bg:#40361A;
  --focus:#CDBBF2; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.55;
  padding-block:18px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand{font:600 .8rem var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.progress{margin-bottom:18px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--purple);border-radius:99px;transition:width .3s}
.plabel{font-size:.82rem;color:var(--muted);margin-top:6px;min-height:1.3em}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4.5vw,32px)}
.kicker{font:600 .72rem var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--end);margin-bottom:8px}
.card h1{font-size:clamp(1.8rem,6vw,2.5rem)}
.card h2{font-size:clamp(1.3rem,4.4vw,1.7rem);margin-bottom:10px}
.es{font-weight:700}
.en{font-size:.92rem;color:var(--muted);margin-top:2px}
.lead{margin:12px 0 4px;max-width:60ch}
.note{margin-top:12px;padding:10px 14px;background:var(--rev-bg);color:var(--rev);border-radius:12px;font-size:.93rem}
.note .en{color:inherit;opacity:.85;display:block}
.ref{margin-top:14px}
.btn{font:600 .82rem var(--f-head);letter-spacing:.07em;text-transform:uppercase;border-radius:99px;padding:11px 22px;min-height:44px;cursor:pointer;border:2px solid var(--btn);background:transparent;color:var(--btn)}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn.small{min-height:36px;padding:6px 16px;font-size:.74rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.en-btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:24px}
.nav .grp-r{display:flex;flex-wrap:wrap;gap:10px}
/* tablas */
.tbl-wrap{overflow-x:auto;margin-top:16px;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:.98rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
tr:last-child>*{border-bottom:0}
thead th{background:var(--soft);font:600 .85rem var(--f-head)}
tbody th{font-weight:700;white-space:nowrap}
tbody th small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
td b{color:var(--end)}
caption{caption-side:top;text-align:left;font:600 .9rem var(--f-head);padding:10px 12px;background:var(--card)}
.agenda{min-width:420px}
.agenda td,.agenda thead th:not(:first-child){text-align:center}
.agenda td.on{background:var(--on);font-weight:700}
.tips{margin:16px 0 0;padding-left:1.1rem;display:grid;gap:6px}
.tips li::marker{color:var(--purple)}
.blocks{margin:18px 0 6px;padding-left:1.3rem;display:grid;gap:4px}
.blocks li::marker{font-weight:700;color:var(--end)}
.blocks span{color:var(--muted);font-size:.88rem}
/* ejercicios */
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font:inherit;font-size:.92rem;padding:5px 14px;border-radius:99px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--purple)}
.chip.tool{background:transparent;color:var(--muted)}
.items{margin-top:12px}
.grp{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--end);margin:18px 0 2px}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.q{font-size:1.04rem;line-height:2.35}
.blank{font:inherit;color:var(--ink);background:var(--soft);border:0;border-bottom:2px solid var(--lav);border-radius:8px 8px 0 0;padding:2px 8px;min-height:36px;text-align:center;max-width:100%;margin:0 2px}
.item.wide .blank{display:block;width:100%;text-align:left;margin:4px 0 0}
.item.wide .q{line-height:1.7}
s.bad{display:block;text-decoration:none;color:var(--muted)}
s.bad::before{content:"✗ ";color:var(--bad);font-weight:700}
.blank.ok,.slot.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.blank.bad,.slot.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.blank.rev,.slot.rev{border-color:var(--rev);background:var(--rev-bg);color:var(--rev)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px}
.en-btn{font:700 .68rem var(--f-head);letter-spacing:.08em;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:2px 9px;margin-left:6px;cursor:pointer;vertical-align:middle}
.en-btn[aria-expanded="true"]{background:var(--soft);color:var(--ink)}
.tr{font-size:.92rem;color:var(--muted);line-height:1.4;margin-top:-4px}
.slot{display:inline-block;min-width:7ch;text-align:center;padding:0 10px;border-bottom:2px solid var(--lav);background:var(--soft);border-radius:8px 8px 0 0;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.opt{font:inherit;padding:8px 18px;border-radius:99px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:40px}
.opt[aria-pressed="true"]{border-color:var(--purple);background:var(--soft);font-weight:700}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.rev{border-color:var(--rev);background:var(--rev-bg)}
select{font:inherit;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-height:42px;max-width:100%;margin-top:4px}
select.ok{border-color:var(--ok);background:var(--ok-bg)}
select.bad{border-color:var(--bad);background:var(--bad-bg)}
select.rev{border-color:var(--rev);background:var(--rev-bg)}
.ta{display:block;width:100%;font:inherit;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;resize:vertical}
.model{margin-top:10px;padding:12px 14px;background:var(--ok-bg);color:var(--ok);border-radius:12px}
.model .lbl{font:600 .72rem var(--f-head);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.model p+p{margin-top:2px}
.check{margin-top:16px;padding:12px 14px;background:var(--soft);border-radius:12px}
.check legend{font:600 .85rem var(--f-head);padding:0 6px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:4px 0;cursor:pointer}
.check input{margin-top:5px;accent-color:var(--btn);width:18px;height:18px;flex:none}
.fb{margin-top:16px;border-radius:12px;padding:0}
.fb:empty{display:none}
.fb.good{padding:12px 14px;background:var(--ok-bg);color:var(--ok)}
.fb.retry{padding:12px 14px;background:var(--rev-bg);color:var(--rev)}
.fb.reveal{padding:12px 14px;background:var(--soft)}
.fb .en{color:inherit;opacity:.85}
.fb .hint{margin-top:6px;font-size:.93rem}
.say{display:flex;border-bottom:0;padding:6px 0}
.say.b{justify-content:flex-end}
.bub{max-width:min(92%,34rem);padding:8px 16px;border-radius:20px;background:var(--soft);border:1px solid var(--line)}
.say.a .bub{border-bottom-left-radius:6px}
.say.b .bub{border-bottom-right-radius:6px;background:var(--on)}
.say .q{line-height:2.3}
.bub .blank{background:var(--card)}
.mark{display:none}
/* resultados */
.res{display:grid;gap:14px;margin:18px 0 4px}
.res-row{display:grid;gap:4px}
.res-row .lab{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.res-row .lab span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:400}
.res-bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.res-bar i{display:block;height:100%;background:var(--purple);border-radius:99px}
.score{font:700 clamp(2rem,8vw,3rem) var(--f-head);color:var(--end);font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media (max-width:480px){.nav .grp-r{width:100%}.nav .grp-r .btn{flex:1}}
</style>

(function(){
const $=(s,r)=>(r||document).querySelector(s);
function h(tag,attrs){
  const e=document.createElement(tag);

    if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);

const strip=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
const norm=s=>s.toLowerCase().replace(/[¿?¡!.,;:"“”«»]/g,"").replace(/\s+/g," ").trim();
function matchAny(v,alts){
  const n=norm(v); if(!n)return{ok:false};

  for(const a of alts){if(strip(n)===strip(norm(a)))return{ok:true,accent:a};}

const stage=$("#stage"),bar=$("#barFill"),plabel=$("#plabel"),progress=$("#progress");
let steps=[],pos=0,mode="main",finished=false,started=false;
const stats={},built={};

function enToggle(it,qEl,row){

  const tr=h("div",{class:"tr",hidden:true},it.en);
  const b=h("button",{type:"button",class:"en-btn","aria-expanded":"false","aria-label":"Mostrar traducción al inglés"},"EN");
  b.addEventListener("click",()=>{tr.hidden=!tr.hidden;b.setAttribute("aria-expanded",String(!tr.hidden));});

}

function buildExercise(ex){

  const objs=[];

  function mkFill(it,i){

    return{row,locked:false,hint:it.hint,

  }
  function mkChoice(it,i){

    const q=h("div",{class:"q"});
    const slot=h("span",{class:"slot"},"______");

function mainSteps(){
  const s=[];
  BLOCKS.forEach(b=>{EX.filter(e=>e.b===b.n).forEach(e=>s.push({k:"ex",id:e.id}));s.push({k:"blockend",b:b.n});});
  s.push({k:"results"});return s;
}
function buildAll(){EX.forEach(e=>{built[e.id]=buildExercise(e);});}

function scrollTop(){try{window.scrollTo(0,0);}catch(e){}stage.focus({preventScroll:true});}
function setProgress(){
  progress.hidden=false;
  const pct=steps.length>1?Math.round(pos/(steps.length-1)*100):0;
  bar.style.width=pct+"%";
  $(".bar").setAttribute("aria-valuenow",String(pct));
  const exSteps=steps.filter(s=>s.k==="ex");const s=steps[pos];
  if(s.k==="ex"){const n=steps.slice(0,pos+1).filter(x=>x.k==="ex").length;plabel.textContent="Ejercicio "+n+" de "+exSteps.length;}
  else if(s.k==="results")plabel.textContent="Resultados";
  else plabel.textContent="Fin del bloque";
}
function go(d){
  if(d<0&&pos===0){showHome();return;}
  pos=Math.max(0,Math.min(steps.length-1,pos+d));
  if(d<0)while(pos>0&&steps[pos].k==="blockend")pos--;
  render();
}
function render(){
  started=true;
  const s=steps[pos];stage.replaceChildren();setProgress();
  if(s.k==="ex")stage.append(built[s.id]);
  else if(s.k==="blockend")renderBlockEnd(s.b);
  else renderResults();
  scrollTop();
}

function showHome(){
  progress.hidden=true;stage.replaceChildren();
  const label=finished?"Empezar de nuevo":(started&&pos>0?"Seguir donde quedé":"Empezar");
  const total=EX.length;
  const ol=h("ol",{class:"blocks"});
  BLOCKS.forEach(b=>{const n=EX.filter(e=>e.b===b.n).length;ol.append(h("li",{},b.name+" ",h("span",{},"· "+n+(n===1?" ejercicio":" ejercicios"))));});
  const btn=h("button",{type:"button",class:"btn primary",id:"btnStart"},label);
  btn.addEventListener("click",()=>{
    if(finished){resetAll();return;}
    if(!steps.length){steps=mainSteps();pos=0;}
    render();
  });
  stage.append(h("section",{class:"card"},
    h("p",{class:"kicker"},"Nivel A1 · Presente de indicativo"),
    h("h1",{},"Mis hábitos cotidianos"),
    h("p",{class:"lead es"},"Conjuga verbos regulares y cuenta cómo es tu día: tu trabajo, tu comida y tu tiempo libre."),
    h("p",{class:"en"},"Conjugate regular verbs and talk about your day: your work, your meals and your free time."),
    ol,
    h("p",{class:"en"},total+" ejercicios · Escribe, completa y responde."),
    h("div",{class:"btns"},btn)));
  scrollTop();
}
function resetAll(){
  Object.keys(stats).forEach(k=>delete stats[k]);
  buildAll();steps=mainSteps();pos=0;mode="main";finished=false;render();
}

function blockScore(n){
  const b=BLOCKS[n-1];const exs=EX.filter(e=>e.b===n);
  if(b.open){const d=exs.filter(e=>stats[e.id]).length;return{done:d,total:exs.length,open:true};}
  let first=0,total=0;exs.forEach(e=>{total+=e.items.length;if(stats[e.id])first+=stats[e.id].first;});
  return{first,total};
}
function renderBlockEnd(n){
  const b=BLOCKS[n-1];const sc=blockScore(n);
  const prev=h("button",{type:"button",class:"btn ghost"},"Anterior");
  const next=h("button",{type:"button",class:"btn primary"},"Siguiente");
  prev.addEventListener("click",()=>go(-1));next.addEventListener("click",()=>go(1));
  stage.append(h("section",{class:"card"},
    h("p",{class:"kicker"},"Bloque "+n+" completo"),
    h("h2",{},b.name),
    h("p",{class:"score"},sc.open?(sc.done+" / "+sc.total):(sc.first+" / "+sc.total)),
    h("p",{class:"es"},sc.open?"¡Escribiste tus propios textos!":"respuestas correctas a la primera"),
    h("p",{class:"en"},sc.open?"You wrote your own texts!":"answers correct on the first try"),
    h("div",{class:"nav"},prev,h("div",{class:"grp-r"},next))));
  confetti();
}
function renderResults(){
  finished=true;
  let first=0,total=0;
  const res=h("div",{class:"res"});
  BLOCKS.forEach(b=>{
    const sc=blockScore(b.n);let pct,txt;
    if(sc.open){pct=sc.total?sc.done/sc.total*100:0;txt=sc.done+" de "+sc.total+" completados";}
    else{first+=sc.first;total+=sc.total;pct=sc.total?sc.first/sc.total*100:0;txt=sc.first+" / "+sc.total;}
    res.append(h("div",{class:"res-row"},h("div",{class:"lab"},h("span",{},b.name),h("span",{},txt)),h("div",{class:"res-bar"},h("i",{style:"width:"+Math.round(pct)+"%"}))));
  });
  const msg=h("p",{class:"hint",role:"status","aria-live":"polite"});
  const bErr=h("button",{type:"button",class:"btn primary"},"Repetir errores");
  const bHome=h("button",{type:"button",class:"btn ghost"},"Volver al inicio");
  bErr.addEventListener("click",()=>{
    const missed=EX.filter(e=>e.type!=="open"&&(!stats[e.id]||stats[e.id].first<stats[e.id].total));
    if(!missed.length){msg.textContent="No tienes errores que repetir. ¡Prueba el reto final! (No mistakes to repeat. Try the final challenge!)";return;}
    missed.forEach(e=>{built[e.id]=buildExercise(e);});
    steps=missed.map(e=>({k:"ex",id:e.id})).concat([{k:"results"}]);pos=0;mode="repeat";finished=false;render();
  });

  stage.append(h("section",{class:"card"},
    h("p",{class:"kicker"},"Resultados"),
    h("h2",{},"¡Terminaste!"),
    h("p",{class:"score"},first+" / "+total),
    h("p",{class:"es"},"respuestas correctas a la primera"),
    h("p",{class:"en"},"answers correct on the first try"),
    res,msg,
    h("div",{class:"btns"},bErr,bHome)));
  confetti();
}

function confetti(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#confetti"),ctx=c.getContext("2d");
  c.width=window.innerWidth;c.height=window.innerHeight;
  const cols=["#B8A1E3","#8B6FC0","#E7B8D8","#FFD97A","#7BC8A4"];
  const ps=[];
  for(let i=0;i<110;i++)ps.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*0.3,vx:(Math.random()-0.5)*3,vy:2+Math.random()*3.5,r:4+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-0.5)*0.3,col:cols[Math.floor(Math.random()*cols.length)]});
  const t0=performance.now();
  (function f(t){
    ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.03;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);ctx.restore();});
    if(t-t0<2600)requestAnimationFrame(f);else ctx.clearRect(0,0,c.width,c.height);
  })(t0);
}

$("#btnHome").addEventListener("click",showHome);
buildAll();showHome();
})();
</script>
