<style>
:root{--navy:#252443;--purple:#7653cb;--purple2:#a891e8;--teal:#148f8b;--cream:#fffdf8;--ink:#26243b;--muted:#706d80;--line:#e8e4f0;--ok:#14785c;--bad:#a34b62;--bg:#f8f6fc;--shadow:0 13px 40px #3b2c7114}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:'Segoe UI',Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}button,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.52}a{color:var(--purple)}
header{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(4%,calc((100vw - 1290px)/2));gap:12px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.5px}.brand-bloom{font-size:26px;background:#efeaff;border-radius:16px;padding:6px 10px}.brand small{display:block;font-weight:500;letter-spacing:.7px;color:#77738c;font-size:10px}.top-right{font-size:12px;font-weight:700;color:#6b6386;background:#f2edf9;padding:9px 12px;border-radius:100px}
.container{max-width:1280px;margin:0 auto;padding:27px 20px 48px}.hero{position:relative;background:linear-gradient(128deg,#f0eafe 2%,#e9f8f6 64%,#fcf3e9);border:1px solid #e5ddf9;border-radius:28px;box-shadow:var(--shadow);padding:34px;overflow:hidden}.hero:after{content:'✦';position:absolute;color:#baade1;right:9%;top:30px;font-size:93px;opacity:.18}.hero h1{font-size:clamp(29px,4.5vw,55px);line-height:1.1;max-width:830px;letter-spacing:-2.2px;margin:12px 0}.hero p{max-width:720px;color:#514c66;font-size:17px;margin:0 0 16px}.eyebrow{text-transform:uppercase;font-weight:900;letter-spacing:2.5px;color:var(--purple);font-size:11px}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#ffffffa6;border:1px solid #ffffffbb;padding:6px 11px;border-radius:100px;font-size:12px;font-weight:700;color:#544c6d}.intro-grid{display:grid;grid-template-columns:1.4fr .9fr;gap:21px;margin-top:21px}.panel{background:#fff;border:1px solid #eae5f0;border-radius:24px;padding:24px;box-shadow:0 5px 18px #44406c08}.panel h2{margin:0 0 12px;font-size:21px;letter-spacing:-.6px}.panel p{color:var(--muted)}.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.step{border:1px solid #eee8f5;border-radius:14px;padding:14px;background:#fbfaff}.step span{display:block;font-size:22px}.step strong{display:block;font-size:13px;margin:4px 0}.step small{font-size:12px;color:var(--muted)}.topic-preview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.topic-mini{background:#f8f6fd;border-radius:14px;padding:9px 11px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:9px}.topic-mini span{font-size:17px}.btn{border:0;border-radius:14px;padding:12px 19px;font-weight:800;font-size:14px;transition:transform .18s,box-shadow .18s}.btn:hover:not(:disabled){transform:translateY(-1px)}.primary{background:linear-gradient(110deg,#7650ca,#5b43a3);color:white;box-shadow:0 7px 16px #6f52b344}.secondary{background:#f1eef9;color:#5f4aa0}.ghost{background:transparent;border:1px solid #e6dfef;color:#5d5870}.action-row{display:flex;flex-wrap:wrap;gap:11px;align-items:center;margin-top:23px}.fine{color:#777487;font-size:12px}
.test-layout{display:grid;grid-template-columns:275px minmax(0,1fr);gap:23px;align-items:start}.rail{position:sticky;top:14px;background:white;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);max-height:calc(100vh - 32px);overflow-y:auto}.rail-title{font-weight:900;font-size:14px;margin:0 0 9px}.rail-sub{font-size:12px;color:var(--muted);margin-bottom:15px}.rail-item{width:100%;border:0;background:transparent;padding:10px 9px;border-radius:12px;display:flex;align-items:center;gap:9px;text-align:left;color:#55526c;font-size:12px;font-weight:700}.rail-item:hover,.rail-item.active{background:#eee9f8;color:#554193}.rail-item.done{color:#14785c}.rail-item .n{font-size:19px}.rail-item .count{margin-left:auto;white-space:nowrap;font-size:11px;color:#8b86a0}.rail-item:disabled{cursor:default;opacity:.7}.test-main{min-width:0}.progress-top{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:0 0 8px}.progress-top strong{font-size:14px}.progress-top small{color:var(--muted);font-size:12px}.progress-line{height:9px;border-radius:100px;background:#e9e4f2;overflow:hidden;margin-bottom:22px}.progress-line>div{height:100%;background:linear-gradient(90deg,#6b52bd,#13a2a4);border-radius:100px;transition:width .3s}.question-card{background:white;border-radius:27px;border:1px solid #e9e4f2;box-shadow:var(--shadow);overflow:hidden}.question-hero{background:linear-gradient(125deg,#f5efff,#f0fbfa);padding:27px 31px 23px}.q-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:12px;color:#7156b3;font-weight:800}.tag{background:#fff;border:1px solid #e8dff4;border-radius:20px;padding:5px 10px;font-size:11px;white-space:nowrap}.q-title{font-size:clamp(21px,3vw,31px);line-height:1.33;letter-spacing:-.6px;margin:14px 0 0;max-width:740px}.question-body{padding:29px 31px}.context{display:inline-flex;font-size:12px;color:#0a7e7d;letter-spacing:.2px;font-weight:800;background:#e7f6f4;border-radius:20px;padding:5px 10px}.q-task{font-size:14px;font-weight:800;margin:15px 0 9px}.sentence{font-size:clamp(18px,2.4vw,25px);font-weight:750;line-height:1.6;color:#353052;letter-spacing:-.25px;margin:7px 0 14px}.sentence .blank{border-bottom:3px solid #8862cf;background:#f0eafe;padding:0 6px;min-width:53px;display:inline-block;text-align:center;color:#6b4cb5}.translate{border:0;background:transparent;color:#7761ad;font-weight:700;padding:5px 0;font-size:12px;text-decoration:underline;text-underline-offset:4px}.translation{background:#f6f1fc;border-left:3px solid #b395e3;border-radius:0 10px 10px 0;padding:10px 13px;font-size:14px;color:#595071;margin:7px 0 15px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:20px}.opt{min-height:65px;border-radius:15px;background:#fbfafd;border:2px solid #ece7f3;padding:13px 15px;text-align:left;font-size:16px;color:#413a58;font-weight:750}.opt:hover:not(:disabled){border-color:#b5a1dc;background:#f8f2fe}.opt.selected{border-color:#7755bd;background:#eee7fb;box-shadow:inset 0 0 0 1px #7755bd}.opt .key{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:9px;background:white;margin-right:10px;font-size:12px;color:#8169b7}.opt.correct{border-color:#65ba9d;background:#e8f7ef}.opt.incorrect{border-color:#e4a0af;background:#fff0f2}.choice-label{font-size:12px;color:var(--muted);margin:10px 0 5px}.select-line{margin:20px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.cloze-sentence{font-size:23px;line-height:2;font-weight:700;color:#443958}.answer-select{border:2px solid #9778d7;background:#f5effe;min-width:160px;padding:11px;border-radius:12px;color:#51387a;font-weight:800;max-width:100%}.bank,.slots{display:flex;flex-wrap:wrap;gap:9px;min-height:59px;padding:12px;background:#f9f7fb;border:1px dashed #c7b9dc;border-radius:15px}.slots{background:#f4fbf9;border-color:#a0cdc7;margin:11px 0 17px}.tile{border:1px solid #ded2f2;background:white;padding:10px 14px;border-radius:11px;font-weight:800;color:#534177}.tile:not(:disabled):hover{background:#f0e9fa}.tile.placed{background:#e5f4f0;border-color:#a6d6ca;color:#256f65}.empty-slot{color:#858097;font-size:13px;align-self:center}.hint-row{font-size:12px;color:#797284;margin:0 0 9px}.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0}.match-col{display:flex;flex-direction:column;gap:10px}.match-head{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#877b9f;font-weight:900}.match-btn{background:#fbfaff;border:2px solid #e9e2f1;text-align:left;border-radius:13px;padding:12px;font-weight:700;min-height:62px;color:#44405b;position:relative;display:flex;justify-content:space-between;align-items:center;gap:5px;font-size:14px}.match-btn.active{border-color:#8561c7;background:#eee8fb}.match-btn.paired{border-color:#9ccdc9;background:#effaf7}.match-btn .paired-num{background:#d5eee8;color:#16736b;font-size:11px;border-radius:50%;display:inline-grid;place-items:center;width:22px;height:22px;flex-shrink:0}.match-btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.btn:focus-visible{outline:3px solid #ffa848;outline-offset:2px}.q-bottom{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid #eee9f4;margin-top:24px;padding-top:19px}.q-bottom .spacer{flex:1}.feedback{padding:16px 18px;border-radius:16px;margin-top:22px}.feedback.ok{background:#eaf8f0;border:1px solid #b8dfc8;color:#24664c}.feedback.no{background:#fff0f2;border:1px solid #ebbac3;color:#823e55}.feedback strong{font-size:16px}.feedback p{color:inherit;margin:6px 0 0;font-size:14px}.feedback .solution{margin-top:9px;font-size:14px;font-weight:800;line-height:1.6}.tip{background:#fff8e9;padding:11px;border-radius:12px;border:1px solid #f4e6bc;font-size:12px;color:#846e43;margin-top:14px}.badge-level{font-size:10px;letter-spacing:.5px;color:#59457e;background:#e7ddf7;border-radius:20px;padding:3px 7px}.note-divider{border:0;border-top:1px solid #ede9f2;margin:17px 0}.results-title{font-size:clamp(28px,4vw,46px);margin:0 0 9px;letter-spacing:-1px}.score-grid{display:grid;grid-template-columns:230px 1fr;align-items:center;gap:25px;margin:18px 0}.score-circle{height:195px;width:195px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#7653cb var(--score),#ece7f5 0);padding:12px;margin:auto}.score-circle>div{width:100%;height:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:white}.score-circle strong{font-size:45px;color:#403269;line-height:1}.score-circle small{color:#736b82}.result-table{width:100%;border-collapse:collapse;margin-top:16px}.result-table th{text-align:left;background:#f1edfa;padding:11px;font-size:12px;color:#5a4a84}.result-table td{padding:12px 10px;border-bottom:1px solid #ede8f1;font-size:13px}.barmini{height:7px;width:95px;border-radius:20px;background:#e9e3f2;display:inline-block;overflow:hidden;vertical-align:middle;margin-left:8px}.barmini b{display:block;height:100%;background:#28a493}.review-card{border:1px solid #eee2ec;border-radius:16px;padding:16px;margin-bottom:11px;background:#fff}.review-card strong{font-size:14px}.review-card p{margin:6px 0;color:#6e6780;font-size:13px}.correct-answer{font-weight:800;color:#1c775a!important}.footer-note{text-align:center;padding:22px;color:#948fa0;font-size:11px}.hidden{display:none!important}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2d2545;color:white;border-radius:15px;padding:12px 19px;box-shadow:var(--shadow);font-size:13px;z-index:30}.confetti-piece{position:fixed;top:-20px;width:9px;height:15px;pointer-events:none;z-index:99;animation:fall 1.8s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}@media(max-width:880px){.test-layout{grid-template-columns:1fr}.rail{position:relative;top:0;max-height:none;display:block}.rail-list{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.rail-item{font-size:11px}.rail-item .count{display:none}.intro-grid{grid-template-columns:1fr}}@media(max-width:630px){header{height:70px;padding:0 15px}.brand{font-size:13px}.top-right{font-size:10px}.container{padding:14px 10px 30px}.hero{padding:23px}.hero h1{letter-spacing:-1px}.intro-grid{gap:12px}.panel{padding:18px}.steps,.topic-preview{grid-template-columns:1fr 1fr}.test-layout{gap:13px}.question-hero{padding:21px}.question-body{padding:20px}.opts{grid-template-columns:1fr}.match-grid{gap:7px}.match-btn{padding:8px;min-height:69px;font-size:12px}.rail{padding:10px}.rail-title,.rail-sub{display:none}.rail-list{grid-template-columns:repeat(4,1fr)}.rail-item{display:block;text-align:center;padding:7px 3px;font-size:9px}.rail-item .n{display:block}.score-grid{grid-template-columns:1fr}.score-circle{height:170px;width:170px}.result-table td,.result-table th{font-size:11px;padding:9px 5px}.barmini{display:none}}
</style>

<body>
<header><div class="brand"><span class="brand-bloom">✿</span><span>Spanish with Jackie<small>LEARN • PRACTICE • SPEAK</small></span></div><div class="top-right">DIAGNÓSTICO A2–B2 · ESPAÑOL LATINO</div></header>
<div id="app" class="container"></div>
<script>
const SECTIONS = [
{ id:'presente',title:'Presente y rutinas',level:'A2',emoji:'☀️',desc:'Ser, estar, gustar y verbos reflexivos.' },
{ id:'indefinido',title:'Pretérito indefinido',level:'A2',emoji:'🗓️',desc:'Acciones terminadas y formas irregulares.' },
{ id:'imperfecto',title:'Pretérito imperfecto',level:'A2–B1',emoji:'🎵',desc:'Hábitos, descripciones y acciones en desarrollo.' },
{ id:'perfectos',title:'Perfecto y pluscuamperfecto',level:'B1',emoji:'⏳',desc:'Experiencias, hechos recientes y anterioridad.' },
{ id:'condicional',title:'Futuro y condicional',level:'B1',emoji:'🧳',desc:'Planes, hipótesis y consecuencias.' },
{ id:'subjpres',title:'Presente de subjuntivo',level:'B1',emoji:'💭',desc:'Recomendaciones, deseos, dudas y reacciones.' },
{ id:'subjperf',title:'Perfecto de subjuntivo',level:'B2',emoji:'🔎',desc:'Reacciones y dudas sobre hechos completados.' },
{ id:'subjimp',title:'Imperfecto de subjuntivo',level:'B1–B2',emoji:'💬',desc:'Hipótesis, consejos y estilo indirecto.' },
{ id:'usose',title:'Los usos de «se»',level:'B1–B2',emoji:'🔁',desc:'Pasiva refleja, impersonal e involuntario.' },
{ id:'cambios',title:'Verbos de cambio',level:'B1–B2',emoji:'🌱',desc:'Ponerse, volverse, quedarse, hacerse, convertirse.' },
{ id:'pronombres',title:'Pronombres OD/OI',level:'B1',emoji:'📩',desc:'Lo, la, le, les y combinaciones con «se».' }
];
const QUESTIONS = [
{id:'p2',section:'presente',type:'cloze',context:'La familia',prompt:'Actualmente, a mi hijo no le ___ levantarse temprano los domingos.',en:'My son does not like getting up early on Sundays.',options:['gustan','gusta','guste','gustaba'],answer:1,explain:'With the infinitive «levantarse», «gustar» is singular: «le gusta levantarse».'},
{id:'i1',section:'indefinido',type:'choice',context:'Ayer',prompt:'Ayer, por primera vez, ___ a un paciente que había llegado de viaje.',en:'Yesterday, for the first time, I saw a patient who had arrived from a trip.',options:['atendía','atiendo','atendí','atendería'],answer:2,explain:'A single completed event yesterday takes the pretérito indefinido: «atendí».'},
{id:'i4',section:'indefinido',type:'match',context:'Irregulares',prompt:'Relaciona el verbo con su forma en pretérito.',pairs:[['hacer (ellos)','hicieron'],['tener (yo)','tuve'],['decir (ella)','dijo']],explain:'These irregular preterite roots matter later for the imperfect subjunctive: hicieron → hiciera, tuvieron → tuviera, dijeron → dijera.'},
{id:'im1',section:'imperfecto',type:'choice',context:'Recuerdos',prompt:'Cuando estudiaba en la universidad, ___ en un coro todos los fines de semana.',en:'When I was at university, I used to sing in a choir every weekend.',options:['canté','he cantado','cantaba','cantaría'],answer:2,explain:'Repeated activities in the past take the imperfect: «cantaba» = used to sing.'},
{id:'im2',section:'imperfecto',type:'cloze',context:'En la cocina',prompt:'Yo ___ (preparar) la cena cuando sonó el teléfono.',en:'I was preparing dinner when the phone rang.',options:['preparé','preparaba','he preparado','prepararía'],answer:1,explain:'The imperfect describes the action in progress; the preterite «sonó» interrupts it.'},
{id:'pf1',section:'perfectos',type:'choice',context:'Una reserva',prompt:'Cuando llegamos al hotel, ya ___ reservado la habitación.',en:'When we arrived at the hotel, we had already booked the room.',options:['hemos','habíamos','hayamos','estábamos'],answer:1,explain:'«Habíamos reservado» expresses an action completed before another past moment.'},
{id:'pf4',section:'perfectos',type:'match',context:'Línea de tiempo',prompt:'Relaciona cada frase con el sentido temporal.',pairs:[['Ayer reservé la mesa.','Hecho terminado en un día pasado'],['Este mes he reservado dos viajes.','Experiencia en un período aún abierto'],['Cuando me llamaron, ya había reservado.','Hecho anterior a otro hecho pasado']],explain:'These forms organize the timeline. In Latin America the simple past can also occur in some current-period contexts; notice the specific intended emphasis.'},
{id:'f1',section:'condicional',type:'choice',context:'Planes reales',prompt:'Si mañana llueve, ___ en casa con los niños.',en:'If it rains tomorrow, we will stay home with the children.',options:['nos quedáramos','nos quedábamos','nos quedaremos','nos quedemos'],answer:2,explain:'For a real future possibility, use «si + present indicative» and a future consequence.'},
{id:'f2',section:'condicional',type:'cloze',context:'Un viaje hipotético',prompt:'Si me ofrecieran vacaciones pagadas, ___ (aprovechar) para viajar.',en:'If I were offered paid vacation, I would take the opportunity to travel.',options:['aproveché','aprovecho','aprovecharía','aprovechara'],answer:2,explain:'An imagined consequence uses the simple conditional: «aprovecharía».'},
{id:'s1',section:'subjpres',type:'choice',context:'Una opinión',prompt:'No creo que la aplicación ___ suficiente para hacer un diagnóstico.',en:'I do not think the app is sufficient to make a diagnosis.',options:['es','sea','era','sería'],answer:1,explain:'«No creo que» expresses doubt or negated belief and normally triggers the present subjunctive: «sea».'},
{id:'s2',section:'subjpres',type:'cloze',context:'La familia',prompt:'Es importante que los niños ___ (tener) tiempo para descansar.',en:'It is important that children have time to rest.',options:['tienen','tendrán','tengan','tenían'],answer:2,explain:'A present evaluation, «es importante que», takes present subjunctive: «tengan».'},
{id:'sp1',section:'subjperf',type:'choice',context:'Una buena noticia',prompt:'El paciente ya terminó el tratamiento. Me alegra que lo ___.',en:'The patient has finished treatment. I am glad that he has completed it.',options:['termina','haya terminado','terminara','terminará'],answer:1,explain:'Reacting now to a completed action: «me alegra que + haya terminado».'},
{id:'si1',section:'subjimp',type:'choice',context:'Hipótesis',prompt:'Si yo ___ más tiempo, estudiaría español todas las tardes.',en:'If I had more time, I would study Spanish every afternoon.',options:['tendría','tuve','tuviera','tengo'],answer:2,explain:'After hypothetical «si», use the imperfect subjunctive: «tuviera», not the conditional «tendría».'},
{id:'si2',section:'subjimp',type:'cloze',context:'Un consejo pasado',prompt:'Ayer le pedí a mi paciente que ___ (venir) a consulta.',en:'Yesterday I asked my patient to come in for an appointment.',options:['venga','vino','vendría','viniera'],answer:3,explain:'A past request followed by «que» uses imperfect subjunctive: «le pedí que viniera».'},
{id:'si4',section:'subjimp',type:'match',context:'De orden a reporte',prompt:'Relaciona cada instrucción directa con cómo se cuenta después.',pairs:[['«Trae los documentos».','Me pidió que trajera los documentos.'],['«No conduzcas de noche».','Me recomendó que no condujera de noche.'],['«Ven temprano».','Me dijo que viniera temprano.']],explain:'To report a past instruction, use a past reporting verb + imperfect subjunctive (trajera, condujera, viniera).'},
{id:'se1',section:'usose',type:'choice',context:'En la clínica',prompt:'En esta clínica se ___ los resultados con cuidado.',en:'In this clinic, results are analysed carefully.',options:['analiza','analizan','analizó','analizar'],answer:1,explain:'In passive «se», the verb agrees with the plural subject «los resultados»: «se analizan».'},
{id:'se4',section:'usose',type:'match',context:'¿Qué significa «se»?',prompt:'Relaciona la oración con el uso de «se».',pairs:[['Se atiende a los pacientes.','Se impersonal'],['Se realizan biopsias.','Pasiva refleja'],['Se me rompió el reloj.','Se involuntario']],explain:'Impersonal «se» has a singular verb; passive «se» agrees with its patient subject; accidental «se» reports an unintended event.'},
{id:'c4',section:'cambios',type:'match',context:'Cambios diferentes',prompt:'Relaciona cada frase con el tipo de cambio.',pairs:[['Me quedé sin batería.','Pérdida o resultado'],['Se hizo médico.','Profesión adquirida'],['Se volvió desconfiado.','Cambio de actitud']],explain:'«Quedarse» often shows a resulting state, «hacerse» an acquired profession, «volverse» a change of character.'},
{id:'o1',section:'pronombres',type:'choice',context:'Información del paciente',prompt:'Le expliqué el tratamiento al paciente. Después ___ envié por correo.',en:'I explained the treatment to the patient. Afterwards I sent it to him by email.',options:['le lo','se la','se lo','lo le'],answer:2,explain:'«El tratamiento» is masculine singular («lo»). Before «lo», indirect «le» becomes «se»: «se lo envié».'},
{id:'o3',section:'pronombres',type:'order',context:'Documentos',prompt:'Ordena la frase con dos pronombres.',en:'I already sent it to him by email.',tokens:['Ya','se','lo','envié','por','correo.'],explain:'With two pronouns before a conjugated verb, use indirect «se» + direct «lo».'},

];

const KEY='jackie_assessment_jacob_v2_20q';
const $=id=>document.getElementById(id);
let state={phase:'intro',index:0,answers:{},selection:null,order:[],matches:{},activeLeft:null,translation:false,sound:true,review:false};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.answers){state={...state,...saved,selection:null,order:[],matches:{},activeLeft:null,translation:false,review:false};}}catch(e){}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify({phase:state.phase,index:state.index,answers:state.answers,sound:state.sound}));}catch(e){}}
function sectionFor(q){return SECTIONS.find(s=>s.id===q.section)}
function getCount(s){return QUESTIONS.filter(q=>q.section===s.id).length}
function getDone(s){return QUESTIONS.filter(q=>q.section===s.id&&state.answers[q.id]).length}
function getCorrect(s){return QUESTIONS.filter(q=>q.section===s.id&&state.answers[q.id]?.correct).length}
function answerText(q){if(q.type==='choice'||q.type==='cloze')return q.options[q.answer];if(q.type==='order')return q.tokens.join(' ');return q.pairs.map(p=>p[0]+' → '+p[1]).join(' / ')}
function totalDone(){return Object.keys(state.answers).length}
function current(){return QUESTIONS[state.index]}
function shuffleIndices(n,qid){let a=Array.from({length:n},(_,i)=>i);let seed=0;for(let c of qid)seed+=c.charCodeAt(0);for(let i=n-1;i>0;i--){seed=(seed*1664525+1013904223)>>>0;const j=seed%(i+1);[a[i],a[j]]=[a[j],a[i]];}if(a.every((v,i)=>v===i)&&n>1)[a[0],a[1]]=[a[1],a[0]];return a}
function resetWorking(){state.selection=null;state.order=[];state.matches={};state.activeLeft=null;state.translation=false}
function go(index){state.index=index;state.phase='test';resetWorking();save();render();window.scrollTo(0,0)}
function intro(){return `<section class="hero"><div class="eyebrow">TU ESPAÑOL EN LA VIDA REAL</div><h1>¿Qué tiempo verbal necesitas?</h1><p>Un diagnóstico interactivo para repasar lo que has aprendido y descubrir qué necesitas practicar más. No es un examen oficial: es una preparación para tu próxima conversación en español.</p><div class="pills"><span class="pill">🧩 ${QUESTIONS.length} actividades</span><span class="pill">🕒 15–20 minutos aprox.</span><span class="pill">🎯 A2 → B2</span><span class="pill">✓ Autocorrección</span></div></section><div class="intro-grid"><section class="panel"><h2>¿Cómo funciona?</h2><div class="steps"><div class="step"><span>👀</span><strong>1. Observa</strong><small>Lee situaciones cortas de viajes, familia y vida cotidiana.</small></div><div class="step"><span>🧠</span><strong>2. Responde</strong><small>Elige, ordena o relaciona. No tienes que escribir textos.</small></div><div class="step"><span>💡</span><strong>3. Comprueba</strong><small>Recibe explicaciones en inglés al terminar cada pregunta.</small></div><div class="step"><span>📊</span><strong>4. Analiza</strong><small>Revisa resultados por tema y compártelos con tu profesora.</small></div></div><div class="action-row"><button class="btn primary" data-action="start">${totalDone()?'Continuar mi evaluación →':'Comenzar evaluación →'}</button>${totalDone()?'<button class="btn ghost" data-action="reset">Empezar desde cero</button>':''}</div><p class="fine">💾 Tu avance se guarda en este navegador. Se evalúa la primera respuesta a cada ejercicio.</p></section><section class="panel"><h2>Los temas del diagnóstico</h2><div class="topic-preview">${SECTIONS.map(s=>`<div class="topic-mini"><span>${s.emoji}</span><span>${escapeHTML(s.title)} <small style="color:#887f9e;display:block">${s.level}</small></span></div>`).join('')}</div></section></div>`}
function sidebar(){const active=current();return `<aside class="rail"><div class="rail-title">Ruta de repaso</div><div class="rail-sub">${totalDone()}/${QUESTIONS.length} completadas</div><div class="rail-list">${SECTIONS.map(s=>`<button class="rail-item ${s.id===active.section?'active':''} ${getDone(s)===getCount(s)?'done':''}" data-action="topic" data-id="${s.id}" title="Ir a ${escapeHTML(s.title)}"><span class="n">${s.emoji}</span><span>${escapeHTML(s.title)}</span><span class="count">${getDone(s)}/${getCount(s)}</span></button>`).join('')}</div><hr class="note-divider"><button class="btn ghost" style="width:100%;font-size:12px" data-action="toggle-sound">${state.sound?'🔊 Desactivar sonido':'🔇 Activar sonido'}</button><button class="btn ghost" style="width:100%;font-size:12px;margin-top:7px" data-action="intro">← Volver al inicio</button></aside>`}
function qForm(q){const answer=state.answers[q.id];const selected=answer?answer.response:state.selection; const locked=!!answer;
if(q.type==='choice')return `<div class="opts">${q.options.map((option,i)=>`<button class="opt ${selected===i?'selected':''} ${locked&&q.answer===i?'correct':''} ${locked&&selected===i&&q.answer!==i?'incorrect':''}" data-action="choose" data-index="${i}" ${locked?'disabled':''}><span class="key">${'ABCD'[i]}</span>${escapeHTML(option)}</button>`).join('')}</div>`;
if(q.type==='cloze')return `<div class="select-line"><span class="choice-label">Select the correct form / Elige la forma correcta:</span><select class="answer-select" data-action="select" ${locked?'disabled':''}><option value="">— Elige una opción —</option>${q.options.map((o,i)=>`<option value="${i}" ${selected===i?'selected':''}>${escapeHTML(o)}</option>`).join('')}</select></div>`;
if(q.type==='order'){const used=answer?answer.response:state.order;const display=shuffleIndices(q.tokens.length,q.id);return `<div class="q-task">Tu oración / Your sentence:</div><div class="slots">${used.length?used.map((idx,pos)=>`<button class="tile placed" data-action="remove-tile" data-index="${pos}" ${locked?'disabled':''}>${escapeHTML(q.tokens[idx])} ${!locked?'×':''}</button>`).join(''):'<span class="empty-slot">Selecciona las palabras en el orden correcto…</span>'}</div><div class="q-task">Banco de palabras / Word bank:</div><div class="bank">${display.filter(idx=>!used.includes(idx)).map(idx=>`<button class="tile" data-action="add-tile" data-index="${idx}" ${locked?'disabled':''}>${escapeHTML(q.tokens[idx])}</button>`).join('')}</div><p class="hint-row">Haz clic en las palabras para ordenarlas. Puedes quitar una palabra para corregir.</p>`}
if(q.type==='match'){const assigned=answer?answer.response:state.matches;const rightOrder=shuffleIndices(q.pairs.length,q.id);return `<div class="match-grid"><div class="match-col"><div class="match-head">Expresión</div>${q.pairs.map((p,i)=>`<button class="match-btn ${state.activeLeft===i&&!locked?'active':''} ${assigned[i]!==undefined?'paired':''}" data-action="match-left" data-index="${i}" ${locked?'disabled':''}><span>${escapeHTML(p[0])}</span>${assigned[i]!==undefined?'<span class="paired-num">'+(rightOrder.indexOf(assigned[i])+1)+'</span>':''}</button>`).join('')}</div><div class="match-col"><div class="match-head">Uso o significado</div>${rightOrder.map((idx,i)=>`<button class="match-btn ${Object.values(assigned).includes(idx)?'paired':''}" data-action="match-right" data-index="${idx}" ${locked?'disabled':''}><span class="paired-num">${i+1}</span><span>${escapeHTML(q.pairs[idx][1])}</span></button>`).join('')}</div></div><p class="hint-row">Selecciona una tarjeta izquierda y luego su pareja de la derecha. Puedes cambiar tus parejas.</p>`}
}
function question(){const q=current(),s=sectionFor(q),ans=state.answers[q.id],n=state.index+1,progress=(totalDone()/QUESTIONS.length)*100;
return `<div class="test-layout">${sidebar()}<main class="test-main"><div class="progress-top"><strong>Progreso general</strong><small>${totalDone()} de ${QUESTIONS.length} · Pregunta ${n}</small></div><div class="progress-line"><div style="width:${progress}%"></div></div><section class="question-card"><div class="question-hero"><div class="q-meta"><span>${s.emoji} ${escapeHTML(s.title)}</span><span class="tag">${s.level} · ${n} / ${QUESTIONS.length}</span></div><h2 class="q-title">${q.type==='match'?'Conecta las ideas':q.type==='order'?'Construye la oración':q.type==='cloze'?'Completa la oración':'Elige la mejor opción'}</h2></div><div class="question-body"><span class="context">${escapeHTML(q.context)}</span><p class="q-task">${escapeHTML(q.prompt)}</p>${q.type!=='match'?`<button class="translate" data-action="translation">${state.translation?'▾ Hide translation':'▸ Tap to see English translation'}</button>${state.translation?`<div class="translation">${escapeHTML(q.en)}</div>`:''}`:''}${qForm(q)}${ans?`<div class="feedback ${ans.correct?'ok':'no'}" role="status"><strong>${ans.correct?'✓ ¡Muy bien!':'↗ Vamos a revisar'}</strong><p>${escapeHTML(q.explain)}</p>${!ans.correct?`<div class="solution">Respuesta: ${escapeHTML(answerText(q))}</div>`:''}</div>`:''}<div class="q-bottom"><button class="btn ghost" data-action="previous" ${state.index===0?'disabled':''}>← Anterior</button><div class="spacer"></div>${!ans?`<button class="btn primary" data-action="check">Comprobar respuesta ✓</button>`:`<button class="btn primary" data-action="next">${state.index===QUESTIONS.length-1?'Ver mis resultados 📊':'Siguiente →'}</button>`}</div>${n===1?'<div class="tip">💡 Elige lo que dirías naturalmente. Después de comprobar, verás una explicación breve en inglés.</div>':''}</div></section><div class="footer-note">Spanish with Jackie · Diagnóstico de práctica, no certificación oficial de nivel</div></main></div>`}
function score(){return QUESTIONS.filter(q=>state.answers[q.id]?.correct).length}
function summaryText(){let p=Math.round(100*score()/QUESTIONS.length);return ['SPANISH WITH JACKIE — DIAGNÓSTICO DE ESPAÑOL',`Resultado: ${score()}/${QUESTIONS.length} (${p}%)`,'Resultados por tema:',...SECTIONS.map(s=>`${s.title}: ${getCorrect(s)}/${getCount(s)}`),'Áreas por revisar:',...SECTIONS.filter(s=>getCorrect(s)<getCount(s)).map(s=>`- ${s.title} (${getCorrect(s)}/${getCount(s)})`),'Nota: práctica gramatical, no determina por sí sola el nivel CEFR.'].join('\n')}
function tierTotals(){const tiers={A2:{c:0,t:0},B1:{c:0,t:0},B2:{c:0,t:0}};SECTIONS.forEach(s=>{const tier=['presente','indefinido','imperfecto'].includes(s.id)?'A2':['perfectos','condicional','subjpres','pronombres'].includes(s.id)?'B1':'B2';tiers[tier].c+=getCorrect(s);tiers[tier].t+=getCount(s)});return tiers}
function levelSignal(){const t=tierTotals();const scoreTier=k=>t[k].c/t[k].t;return scoreTier('A2')<.75?'Bases A2 por reforzar':scoreTier('B1')<.70?'Bases A2 sólidas · B1 en desarrollo':scoreTier('B2')<.70?'Contenidos B1 bien reconocidos · B2 en desarrollo':'Estructuras de gramática B2 bien reconocidas'}
function results(){const correct=score(),pct=Math.round(correct*100/QUESTIONS.length),misses=QUESTIONS.filter(q=>!state.answers[q.id]?.correct),weak=SECTIONS.filter(s=>getCorrect(s)/getCount(s)<.75).sort((a,b)=>getCorrect(a)/getCount(a)-getCorrect(b)/getCount(b));return `<section class="hero"><div class="eyebrow">TU INFORME DE APRENDIZAJE</div><h1>¡Terminaste el diagnóstico!</h1><p>Tu resultado muestra qué estructuras puedes reconocer y cuáles conviene seguir practicando. La evaluación oral complementará este diagnóstico.</p></section><section class="panel" style="margin-top:18px"><div class="score-grid"><div class="score-circle" style="--score:${pct}%"><div><strong>${pct}%</strong><small>${correct} / ${QUESTIONS.length} correctas</small></div></div><div><h2>Tu mapa de progreso</h2><p style="font-weight:850;color:#6750a3">Orientación por áreas: ${levelSignal()}</p><p>${pct>=85?'Has reconocido muchas de las estructuras con seguridad. El siguiente paso será utilizarlas espontáneamente al hablar.':pct>=65?'Tienes una base útil, pero algunos contrastes necesitan más práctica para que las respuestas salgan con naturalidad.':'Este resultado es un punto de partida. Revisa los patrones más difíciles y repite los ejercicios con calma.'}</p><div class="pills"><span class="pill">🧠 ${QUESTIONS.length} ejercicios</span><span class="pill">📚 11 temas</span><span class="pill">💬 Preparación para evaluación oral</span></div></div></div><h2>Resultados por grupos de contenido</h2><div class="pills">${Object.entries(tierTotals()).map(([label,v])=>`<span class="pill">${label}: ${v.c}/${v.t} · ${Math.round(100*v.c/v.t)}%</span>`).join('')}</div><p class="fine">Estos resultados muestran una primera orientación: cada tema contiene solo una a tres preguntas y no permite determinar tu nivel CEFR por sí solo. La evaluación oral permitirá confirmar su uso espontáneo.</p><h2>Resultados por tema</h2><table class="result-table"><thead><tr><th>Tema</th><th>Resultado</th><th>Progreso</th></tr></thead><tbody>${SECTIONS.map(s=>{const c=getCorrect(s),t=getCount(s),v=100*c/t;return `<tr><td>${s.emoji} ${escapeHTML(s.title)} <span class="badge-level">${s.level}</span></td><td><b>${c} / ${t}</b></td><td>${Math.round(v)}% <span class="barmini"><b style="width:${v}%"></b></span></td></tr>`}).join('')}</tbody></table>${weak.length?`<div class="tip"><strong>🎯 Prioridades para practicar:</strong> ${weak.slice(0,4).map(x=>escapeHTML(x.title)).join(' · ')}. Estas sugerencias reflejan esta prueba escrita; la conversación ayudará a comprobar tu nivel de fluidez.</div>`:''}<div class="action-row"><button class="btn primary" data-action="copy">Copiar mis resultados para Jackie</button><button class="btn secondary" data-action="download">Descargar informe .txt</button><button class="btn ghost" data-action="show-review">${state.review?'Ocultar errores':'Revisar respuestas'}</button><button class="btn ghost" data-action="reset">Reiniciar evaluación</button></div></section>${state.review?`<section class="panel" style="margin-top:16px"><h2>Repaso de respuestas ${misses.length?'incorrectas':'— ¡sin errores!'}</h2><p>Use the feedback to review the grammar pattern. / Revisa el patrón gramatical.</p>${misses.map(q=>`<div class="review-card"><div class="eyebrow">${escapeHTML(sectionFor(q).title)}</div><strong>${escapeHTML(q.prompt)}</strong><p class="correct-answer">✓ ${escapeHTML(answerText(q))}</p><p>${escapeHTML(q.explain)}</p></div>`).join('')||'<p>¡Muy bien! Todas las respuestas fueron correctas.</p>'}</section>`:''}<div class="footer-note">Una prueba escrita no sustituye una evaluación de producción y comprensión oral.</div>`}
function toast(msg){let e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.append(e);setTimeout(()=>e.remove(),2400)}
function confetti(){let colors=['#7b56d5','#35b4a1','#f3bf56','#ed839d','#a4b5ee'];for(let i=0;i<32;i++){let el=document.createElement('div');el.className='confetti-piece';el.style.left=(20+Math.random()*60)+'vw';el.style.background=colors[i%colors.length];el.style.transform=`translateY(-40px) rotate(${Math.random()*180}deg)`;el.style.animationDelay=(Math.random()*.25)+'s';document.body.append(el);setTimeout(()=>el.remove(),2200)}}
function chime(){if(!state.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const a=new C(),t=a.currentTime;[659.25,830.61,987.77].forEach((hz,i)=>{let osc=a.createOscillator(),gain=a.createGain();osc.type='sine';osc.frequency.value=hz;gain.gain.setValueAtTime(.0001,t+i*.11);gain.gain.exponentialRampToValueAtTime(.07,t+i*.11+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+i*.11+.19);osc.connect(gain).connect(a.destination);osc.start(t+i*.11);osc.stop(t+i*.11+.2)});setTimeout(()=>a.close(),1000)}catch(e){}}
function isComplete(q){if(q.type==='choice'||q.type==='cloze')return Number.isInteger(state.selection);if(q.type==='order')return state.order.length===q.tokens.length;return Object.keys(state.matches).length===q.pairs.length}
function check(){const q=current();if(state.answers[q.id])return;if(!isComplete(q)){toast('Completa la actividad antes de comprobar.');return}let response,correct;if(q.type==='choice'||q.type==='cloze'){response=state.selection;correct=response===q.answer}else if(q.type==='order'){response=[...state.order];correct=response.every((t,i)=>t===i)}else{response={...state.matches};correct=q.pairs.every((p,i)=>response[i]===i)}state.answers[q.id]={response,correct};save();render();if(correct){confetti();chime()}}
function next(){let candidate=state.index+1;while(candidate<QUESTIONS.length&&state.answers[QUESTIONS[candidate].id])candidate++;if(candidate>=QUESTIONS.length){const pending=QUESTIONS.findIndex(q=>!state.answers[q.id]);if(pending>=0){toast('Faltan algunas respuestas. Vamos a completarlas.');go(pending)}else{state.phase='results';save();render();window.scrollTo(0,0)}}else go(candidate)}
function render(){const el=$('app');if(state.phase==='intro')el.innerHTML=intro();else if(state.phase==='results')el.innerHTML=results();else el.innerHTML=question()}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='toggle-sound'){state.sound=!state.sound;save();render()}else if(a==='start'){if(totalDone()===QUESTIONS.length){state.phase='results';save();render()}else{const i=state.answers[current().id]?QUESTIONS.findIndex(q=>!state.answers[q.id]):state.index;go(i>=0?i:0)}}else if(a==='intro'){state.phase='intro';save();render();window.scrollTo(0,0)}else if(a==='translation'){state.translation=!state.translation;render()}else if(a==='choose'){state.selection=Number(b.dataset.index);render()}else if(a==='add-tile'){const i=Number(b.dataset.index);if(!state.order.includes(i))state.order.push(i);render()}else if(a==='remove-tile'){state.order.splice(Number(b.dataset.index),1);render()}else if(a==='match-left'){state.activeLeft=Number(b.dataset.index);render()}else if(a==='match-right'){if(state.activeLeft===null){toast('Primero selecciona una tarjeta de la izquierda.');return}let idx=Number(b.dataset.index);for(let k in state.matches)if(state.matches[k]===idx)delete state.matches[k];state.matches[state.activeLeft]=idx;state.activeLeft=null;render()}else if(a==='check'){check()}else if(a==='next'){next()}else if(a==='previous'){if(state.index>0)go(state.index-1)}else if(a==='topic'){const idx=QUESTIONS.findIndex(q=>q.section===b.dataset.id);if(idx>=0)go(idx)}else if(a==='reset'){if(window.confirm('¿Reiniciar y borrar todas las respuestas guardadas en este navegador?')){state={phase:'intro',index:0,answers:{},selection:null,order:[],matches:{},activeLeft:null,translation:false,sound:true,review:false};save();render()}}else if(a==='show-review'){state.review=!state.review;render()}else if(a==='copy'){const s=summaryText();try{await navigator.clipboard.writeText(s);toast('Informe copiado. Puedes enviárselo a Jackie.')}catch(e){const t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();document.execCommand('copy');t.remove();toast('Informe copiado.')}}else if(a==='download'){const blob=new Blob([summaryText()],{type:'text/plain;charset=utf-8'});const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='Diagnostico_Espanol_Jacob_Resultados.txt';l.click();setTimeout(()=>URL.revokeObjectURL(l.href),1500)}});
document.addEventListener('change',e=>{if(e.target.matches('[data-action="select"]')){state.selection=e.target.value===''?null:Number(e.target.value);render()}});
render();
</script>
</body></html>
