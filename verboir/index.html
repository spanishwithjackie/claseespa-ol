    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function speakSpanish(text, evt) {
            if (evt) evt.stopPropagation();
            playSound('click');
            if (!('speechSynthesis' in window)) return;
            
            window.speechSynthesis.cancel();
            
            const cleanText = text.replace(/<[^>]*>/g, '').trim();
            if (!cleanText) return;

            const utterance = new SpeechSynthesisUtterance(cleanText);
            const voices = window.speechSynthesis.getVoices();
            
            const latamLocales = ['es-MX', 'es-US', 'es-419', 'es-PE', 'es-CO', 'es-AR', 'es-CL', 'es-VE'];
            let selectedVoice = null;

            for (const loc of latamLocales) {
                selectedVoice = voices.find(v => v.lang === loc || v.lang.replace('_', '-') === loc);
                if (selectedVoice) break;
            }

            if (!selectedVoice) {
                selectedVoice = voices.find(v => v.lang.startsWith('es') && 
                    (v.name.includes('Paulina') || v.name.includes('Lupe') || v.name.includes('Miguel') || 
                     v.name.includes('Diego') || v.name.includes('Monica') || v.name.includes('Jorge') ||
                     v.name.includes('Latin') || v.name.includes('Mexico') || v.name.includes('Spanish')));
            }

            if (!selectedVoice) {
                selectedVoice = voices.find(v => v.lang.startsWith('es'));
            }

            if (selectedVoice) {
                utterance.voice = selectedVoice;
                utterance.lang = selectedVoice.lang;
            } else {
                utterance.lang = 'es-MX';
            }

            utterance.rate = 0.88;
            utterance.pitch = 1.0;

            window.speechSynthesis.speak(utterance);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'incorrect') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(174.61, now + 0.2);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        const state = {
            currentScreen: 1,
            totalScreens: 13,
            screenAttempts: { 2: {}, 6: {}, 8: {}, 9: {} },
            screen2Answers: { 1: '', 3: '', 5: '', 7: '', 9: '' },
            screen3Matched: {},
            screen4Prefs: { transportLike: '', transportDislike: '', inCityHas: '', inCityNoHas: '' },
            screen6Answers: {},
            screen7Selected: { transport: null, adj1: null, adj2: null },
            screen7TypedAnswers: { taxi: '', bus: '', bici: '', apie: '', avion: '' },
            screen8Formed: {},
            screen9Answers: {},
            screen10Answers: {},
            screen11Turn: 0,
            screen12ModelVisible: false
        };

        function renderTranslatableText(esText, enText, extraClass = '') {
            const uid = 'tr_' + Math.random().toString(36).substring(2, 9);
            const escapedEsText = esText.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            return `
                <span class="inline-block group ${extraClass}">
                    <span class="cursor-pointer hover:text-brand-purple transition-colors font-medium" onclick="toggleTranslation('${uid}')">${esText}</span>
                    <button type="button" onclick="speakSpanish('${escapedEsText}', event)" class="inline-flex items-center ml-1 px-1.5 py-0.5 rounded text-[10px] bg-amber-100 text-amber-900 font-bold border border-amber-300 hover:bg-amber-200 transition-all shadow-xs" title="Escuchar pronunciación (Español Latino)">
                        🔊
                    </button>
                    <button type="button" onclick="toggleTranslation('${uid}')" class="inline-flex items-center ml-1 px-1.5 py-0.5 rounded text-[10px] bg-brand-lightLavender text-brand-purple font-bold border border-brand-lavender/50 hover:bg-brand-purple hover:text-white transition-all shadow-xs" title="Translate / Traducir">
                        🌐 EN
                    </button>
                    <span id="${uid}" class="hidden block translation-text mt-0.5 text-brand-purple/90 font-sans font-normal">
                        ${enText}
                    </span>
                </span>
            `;
        }

        function toggleTranslation(id) {
            playSound('click');
            const el = document.getElementById(id);
            if (el) el.classList.toggle('hidden');
        }

        function fireConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#8B6FC0', '#B8A1E3', '#E7B8D8', '#FFF1C9']
                });
            }
        }

        function showFeedbackModal(title, body, type = 'info') {
            const modal = document.getElementById('feedback-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');
            const modalIcon = document.getElementById('modal-icon');

            modalTitle.innerText = title;
            modalBody.innerText = body;

            if (type === 'success') {
                playSound('correct');
                modalIcon.className = "w-12 h-12 rounded-full mx-auto flex items-center justify-center mb-3 bg-emerald-100 text-emerald-600 font-bold text-2xl";
                modalIcon.innerHTML = "✓";
            } else if (type === 'error') {
                playSound('incorrect');
                modalIcon.className = "w-12 h-12 rounded-full mx-auto flex items-center justify-center mb-3 bg-pink-100 text-pink-600 font-bold text-2xl";
                modalIcon.innerHTML = "✕";
            } else {
                playSound('click');
                modalIcon.className = "w-12 h-12 rounded-full mx-auto flex items-center justify-center mb-3 bg-brand-lightLavender text-brand-purple font-bold text-2xl";
                modalIcon.innerHTML = "ℹ";
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            playSound('click');
            document.getElementById('feedback-modal').classList.add('hidden');
        }

        function goToScreen(screenNum) {
            playSound('click');
            state.currentScreen = screenNum;
            renderCurrentScreen();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function nextScreen() {
            if (state.currentScreen < state.totalScreens) {
                goToScreen(state.currentScreen + 1);
            }
        }

        function prevScreen() {
            if (state.currentScreen > 1) {
                goToScreen(state.currentScreen - 1);
            }
        }

        function updateNavigationUI() {
            const stepLabel = document.getElementById('screen-step-label');
            const percentLabel = document.getElementById('progress-percent');
            const progressBar = document.getElementById('progress-bar');
            
            const pct = Math.round((state.currentScreen / state.totalScreens) * 100);
            stepLabel.innerText = `Pantalla ${state.currentScreen} de ${state.totalScreens}`;
            percentLabel.innerText = `${pct}%`;
            progressBar.style.width = `${pct}%`;

            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');

            btnPrev.disabled = (state.currentScreen === 1);
            
            if (state.currentScreen === state.totalScreens) {
                btnNext.style.display = 'none';
            } else {
                btnNext.style.display = 'flex';
            }
        }

        function renderCurrentScreen() {
            updateNavigationUI();
            const container = document.getElementById('app-container');
            container.style.opacity = 0;

            setTimeout(() => {
                switch(state.currentScreen) {
                    case 1: container.innerHTML = getScreen1HTML(); break;
                    case 2: container.innerHTML = getScreen2HTML(); initScreen2Logic(); break;
                    case 3: container.innerHTML = getScreen3HTML(); initScreen3Logic(); break;
                    case 4: container.innerHTML = getScreen4HTML(); initScreen4Logic(); break;
                    case 5: container.innerHTML = getScreen5HTML(); break;
                    case 6: container.innerHTML = getScreen6HTML(); initScreen6Logic(); break;
                    case 7: container.innerHTML = getScreen7HTML(); initScreen7Logic(); break;
                    case 8: container.innerHTML = getScreen8HTML(); initScreen8Logic(); break;
                    case 9: container.innerHTML = getScreen9HTML(); initScreen9Logic(); break;
                    case 10: container.innerHTML = getScreen10HTML(); initScreen10Logic(); break;
                    case 11: container.innerHTML = getScreen11HTML(); initScreen11Logic(); break;
                    case 12: container.innerHTML = getScreen12HTML(); initScreen12Logic(); break;
                    case 13: container.innerHTML = getScreen13HTML(); fireConfetti(); break;
                }
                container.style.opacity = 1;
            }, 150);
        }

        function getScreen1HTML() {

                            </div>
                            <div class="bg-white p-3 rounded-2xl border border-brand-lavender/40 shadow-xs flex flex-col items-center hover:scale-105 transition-transform cursor-pointer" onclick="speakSpanish('la moto')">
                                <span class="text-3xl mb-1">🛵</span>

                        <div class="bg-white rounded-2xl p-5 border border-brand-lavender/40 text-left">
                            <h3 class="text-sm font-bold text-brand-purple uppercase tracking-wider mb-3 flex items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                Objetivos de la lección / Learning Objectives
                            </h3>
                            <ul class="space-y-2 text-sm sm:text-base text-brand-plum">
                                <li class="flex items-start gap-2">
                                    <span class="text-brand-purple font-bold">1.</span>

        }

        function getScreen2HTML() {
            return `
                <div class="space-y-6">
                    <div class="bg-white rounded-2xl p-5 border border-brand-lavender/50 card-shadow">
                        <h2 class="text-2xl font-bold font-heading text-brand-plum mb-1">
                            Repaso: ¿Dónde están los lugares?
                        </h2>
                        <p class="text-sm font-semibold text-brand-purple">

                        </p>

                        <!-- Cleaned Lima Map without preposition hints -->

                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs font-bold">

        function normalizeStr(str) {
            return (str || '').toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function checkScreen2() {
            const correctAnswers = {
                1: ['al lado del', 'al lado'],
                3: ['delante del', 'delante'],
                5: ['lejos del', 'lejos'],
                7: ['entre'],
                9: ['cerca de', 'al lado de']
            };

            let allCorrect = true;

            [1, 3, 5, 7, 9].forEach(id => {
                const inp = document.getElementById(`s2-ans-${id}`);
                const val = inp.value;
                state.screen2Answers[id] = val;
                const box = document.getElementById(`s2-q${Math.ceil(id/2)}-box`);
                const fb = document.getElementById(`s2-feedback-${id}`);

                const attempts = (state.screenAttempts[2][id] || 0) + 1;
                state.screenAttempts[2][id] = attempts;

                const isRight = correctAnswers[id].includes(normalizeStr(val));

                if (isRight) {
                    box.className = "p-3 rounded-xl border-2 border-emerald-400 bg-emerald-50/50 flex flex-col sm:flex-row sm:items-center justify-between gap-2";
                    fb.className = "text-xs font-bold px-2 py-1 rounded bg-emerald-200 text-emerald-800";
                    fb.innerText = "¡Correcto!";
                    fb.classList.remove('hidden');
                } else {
                    allCorrect = false;
                    box.className = "p-3 rounded-xl border-2 border-brand-pink bg-brand-lightPink flex flex-col sm:flex-row sm:items-center justify-between gap-2";
                    fb.className = "text-xs font-bold px-2 py-1 rounded bg-pink-200 text-pink-800";
                    if (attempts >= 2) {
                        fb.innerText = `Respuesta: ${correctAnswers[id][0]}`;
                        fb.classList.remove('hidden');
                    } else {
                        fb.innerText = "Revisa la preposición";
                        fb.classList.remove('hidden');
                    }
                }
            });

            if (allCorrect) {
                playSound('correct');
                fireConfetti();
                document.getElementById('s2-transition-msg').classList.remove('hidden');
            } else {
                playSound('incorrect');
                showFeedbackModal("Revisa algunas respuestas", "Asegúrate de colocar la preposición correcta según el mapa.\nCheck your prepositions based on the map.", "error");
            }
        }

        function selectScreen6Answer(qId, optIdx) {
            playSound('click');
            state.screen6Answers[qId] = optIdx;
            evaluateScreen6Question(qId, optIdx);
        }

        function evaluateScreen6Question(qId, optIdx) {
            const q = screen6Questions.find(item => item.id === qId);
            const expDiv = document.getElementById(`s6-exp-${qId}`);
            const attempts = (state.screenAttempts[6][qId] || 0) + 1;
            state.screenAttempts[6][qId] = attempts;

            if (optIdx === q.correct) {
                expDiv.className = "p-2.5 rounded-xl text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-300 block";
                expDiv.innerText = "¡Correcto! " + q.explain;
            } else {
                expDiv.className = "p-2.5 rounded-xl text-xs font-semibold bg-pink-100 text-pink-800 border border-pink-300 block";
                if (attempts >= 2) {
                    expDiv.innerText = `Incorrecto. Respuesta correcta: "${q.options[q.correct]}". Explicación: ${q.explain}`;
                } else {
                    expDiv.innerText = "Respuesta incorrecta. Revisa la regla gramatical e inténtalo de nuevo.";
                }
            }
        }

                container.innerHTML = `<span class="text-xs text-brand-plum/40 italic">Haz clic en las palabras de abajo para formar la oración...</span>`;

            container.innerHTML = items.map((item, idx) => `

        }

        function removeWordS8(id, idx) {
            playSound('click');
            const removed = state.screen8Formed[id].splice(idx, 1)[0];
            if (removed && removed.el) removed.el.classList.remove('hidden');
            renderS8Selected(id);
        }

        function resetS8(id) {
            playSound('click');
            if (state.screen8Formed[id]) {

                state.screen8Formed[id] = [];
            }
            renderS8Selected(id);

            if (fb) fb.classList.add('hidden');

        function renderRoleplay() {
            const msgBox = document.getElementById('s11-messages');
            const ctrlBox = document.getElementById('s11-controls');
            if (!msgBox || !ctrlBox) return;

            msgBox.innerHTML = '';

            for (let i = 0; i <= state.screen11Turn && i < roleplayTurns.length; i++) {
                const turn = roleplayTurns[i];
                if (turn.text) {
                    const isUser = turn.speaker.includes('Turista');
                    const bubble = document.createElement('div');
                    bubble.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'}`;
                    bubble.innerHTML = `
                        <span class="text-[10px] font-bold text-brand-purple mb-0.5">${turn.speaker}</span>
                        <div class="p-3 rounded-2xl max-w-xs sm:max-w-md ${isUser ? 'bg-brand-purple text-white rounded-tr-none' : 'bg-white text-brand-plum border border-brand-lavender/60 rounded-tl-none'} shadow-xs text-xs sm:text-sm">
                            ${renderTranslatableText(turn.text, turn.en)}
                        </div>
                    `;
                    msgBox.appendChild(bubble);
                }
            }

            const current = roleplayTurns[state.screen11Turn];
            if (current && current.type === 'choice') {
                ctrlBox.innerHTML = `
                    <span class="text-xs font-bold text-brand-purple block mb-2">Elige tu respuesta:</span>
                    <div class="space-y-2">
                        ${current.options.map((opt, idx) => `
                            <button onclick="chooseRoleplayTurn('${opt.text.replace(/'/g, "\\'")}', '${opt.en.replace(/'/g, "\\'")}')" class="w-full text-left p-2.5 rounded-xl border-2 border-brand-purple bg-white hover:bg-brand-lightLavender text-xs font-bold text-brand-purple">
                                ${opt.text}
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (current && current.type === 'auto' && state.screen11Turn < roleplayTurns.length - 1) {
                setTimeout(() => {
                    state.screen11Turn++;
                    renderRoleplay();
                }, 800);
            } else if (state.screen11Turn >= roleplayTurns.length - 1) {
                ctrlBox.innerHTML = `<span class="text-xs font-bold text-emerald-700">✓ Diálogo completado. Lee la consigna oral final abajo.</span>`;
                document.getElementById('s11-final-oral').classList.remove('hidden');
            }
        }

        function chooseRoleplayTurn(text, en) {
            playSound('click');
            roleplayTurns[state.screen11Turn].text = text;
            roleplayTurns[state.screen11Turn].en = en;
            state.screen11Turn++;
            renderRoleplay();
        }
