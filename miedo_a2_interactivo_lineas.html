ortant}.wrong{border-color:#d96b7d!important;background:#fff0f2!important}.feedback{margin-top:20px;padding:16px;border-radius:13px;background:#f4f0fb;line-height:1.5}.feedback.good{background:#e9f9f1}.translation{margin-top:12px;padding:12px 14px;background:#fff;border-left:4px solid var(--purple);border-radius:9px;color:#30263e}.translation span{font-size:12px;font-weight:800;color:#7756ad;letter-spacing:.02em}.feedback.bad{background:#fff1f3}.chips{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.tile{font-size:16px;padding:10px 15px}.sentence{min-height:68px;border:2px dashed #d9cbea;border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.blank{display:inline-block;min-width:95px;border-bottom:3px solid var(--purple);color:var(--purple)}.input{width:100%;border:2px solid #ded2ed;border-radius:12px;padding:14px;font-size:19px}.input:focus{outline:2px solid var(--lav)}.muted{font-size:14px;color:var(--muted)}.result{text-align:center}.result .big{font-size:72px}.confetti{position:fixed;top:-15px;width:9px;height:14px;pointer-events:none;z-index:10;animation:fall 1.5s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(650deg);opacity:0}}.scene{background:var(--cream);border-radius:15px;padding:18px;margin:12px 0;font-size:18px}.counter{color:var(--muted);font-weight:700;font-size:13px}@media(max-width:540px){.app{margin:0;padding:10px}.panel{border-radius:18px}.nav button{padding:12px}}

const questions=[
{section:'1 · Expresiones con DAR',type:'choice',q:'Cuando estoy sola en casa y escucho ruidos, ______ miedo.',options:['me dan','me da','me doy'],answer:1,why:'«Miedo» es singular: me da miedo.'},
{section:'1 · Expresiones con DAR',type:'choice',q:'A Julia ______ nervios hablar delante de muchas personas.',options:['le dan','les da','se dan'],answer:0,why:'«Nervios» es plural y Julia corresponde a «le».'},
{section:'2 · Concordancia y pronombres',type:'choice',q:'¿Qué oración es correcta?',options:['Me dan miedo la oscuridad.','Me da miedo la oscuridad.','Me doy miedo la oscuridad.'],answer:1,why:'El sujeto «la oscuridad» es singular: da.'},
{section:'2 · Concordancia y pronombres',type:'match',q:'Relaciona la situación con la expresión correcta.',left:['A mí / las arañas','A ti / la altura','A ellos / los truenos'],right:['les dan miedo','me dan miedo','te da miedo'],pairs:[1,2,0],why:'El verbo concuerda con lo que provoca el miedo, no con la persona.'},
{section:'3 · ASUSTARSE',type:'choice',q:'Yo ______ cuando escucho un ruido extraño por la noche.',options:['me asusto','me asusta','se asusto'],answer:0,why:'Yo me asusto: pronombre reflexivo + verbo en primera persona.'},
{section:'3 · ASUSTARSE',type:'fill',q:'Completa: Mis hermanos ______ cuando ven películas de zombis.',answers:['se asustan'],hint:'Pronombre reflexivo y verbo para ellos.',why:'Ellos se asustan.'},
{section:'4 · PONERSE + adjetivo',type:'choice',q:'Antes de subir al avión, mi hermana ______ muy nerviosa.',options:['le pone','se pone','se ponen'],answer:1,why:'Mi hermana se pone nerviosa.'},
{section:'4 · PONERSE + adjetivo',type:'order',q:'Ordena la oración.',words:['Nos','ponemos','nerviosos','cuando','hay','turbulencias.'],why:'Nos ponemos nerviosos cuando hay turbulencias.'},
{section:'4 · PONERSE + adjetivo',type:'fill',q:'Completa: ¿Tú ______ nervioso antes de un examen?',answers:['te pones'],hint:'Forma de ponerse para tú.',why:'Tú te pones nervioso.'},
{section:'5 · ¿Cuál expresión corresponde?',type:'choice',q:'—¿Qué te pasa cuando ves una araña? —¡______ muchísimo!',options:['Me asusto','Me da asusto','Me pongo miedo'],answer:0,why:'«Me asusto» describe tu reacción. También puedes decir «me da miedo».'},
{section:'5 · ¿Cuál expresión corresponde?',type:'choice',q:'—¿Cómo te sientes antes de una entrevista? —______ nerviosa.',options:['Me da','Me pongo','Me asusta'],answer:1,why:'Ponerse + adjetivo: me pongo nerviosa.'},
{section:'5 · ¿Cuál expresión corresponde?',type:'match',q:'Relaciona cada reacción con su expresión.',left:['Una película de terror','Un ruido inesperado','Antes de una presentación'],right:['me asusto','me pongo nerviosa','me da miedo'],pairs:[2,0,1],why:'Dar miedo (causa), asustarse (reacción), ponerse nervioso (cambio de estado).'},
{section:'6 · Adjetivos de terror',type:'choice',q:'La película fue tan ______ que no pude dormir.',options:['aterradora','aterrada','aterrar'],answer:0,why:'«Aterradora» describe algo que provoca terror.'},
{section:'6 · Adjetivos de terror',type:'match',q:'Relaciona cada adjetivo con su significado.',left:['Aterrador','Inquietante','Espeluznante'],right:['Que produce intranquilidad','Que causa mucho terror','Que pone los pelos de punta'],pairs:[1,0,2],why:'Son adjetivos para describir experiencias, escenas y películas.'},
{section:'6 · Adjetivos de terror',type:'choice',q:'Una casa vacía con luces que se encienden solas es muy ______.',options:['misteriosa','divertida','tranquila'],answer:0,why:'«Misteriosa» describe algo difícil de explicar.'},
{section:'7 · Géneros y disfraces',type:'choice',q:'Una película sobre fantasmas y espíritus pertenece al terror ______.',options:['sobrenatural','romántico','histórico'],answer:0,why:'El terror sobrenatural incluye fenómenos inexplicables.'},
{section:'7 · Géneros y disfraces',type:'fill',q:'Completa: Para Halloween, Laura se ______ de bruja.',answers:['disfraza'],hint:'Verbo disfrazarse, tercera persona singular.',why:'Ella se disfraza de bruja.'},
{section:'7 · Géneros y disfraces',type:'match',q:'Relaciona el personaje con su descripción.',left:['Vampiro','Zombi','Fantasma'],right:['Espíritu de una persona muerta','Criatura que bebe sangre','Muerto viviente'],pairs:[1,2,0],why:'Tres disfraces clásicos de Halloween.'},
{section:'8 · Desafío final',type:'choice',q:'—¿Te gustan las montañas rusas? —No, ______ las alturas y siempre ______ nerviosa.',options:['me dan miedo / me pongo','me da miedo / me ponen','me asusto / me da'],answer:0,why:'«Las alturas» es plural y «me pongo nerviosa» indica un cambio de estado.'},
{section:'8 · Desafío final',type:'choice',q:'—¿Cómo reaccionan tus amigos cuando ven una escena aterradora? —______ y algunos gritan.',options:['Se asustan','Les asustan','Se asusta'],answer:0,why:'«Mis amigos» es plural: ellos se asustan.'}];

let idx=-1, responses={},muted=false;const el=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function sound(ok=true){if(muted)return;try{let ctx=new(window.AudioContext||window.webkitAudioContext)();[0,1,2].forEach((i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=(ok?520:230)+(ok?i*110:0);g.gain.value=.045;g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.16+i*.07);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+i*.075);o.stop(ctx.currentTime+.18+i*.075)});setTimeout(()=>ctx.close(),600)}catch(e){}}function confetti(){for(let i=0;i<35;i++){let n=document.createElement('div');n.className='confetti';n.style.left=Math.random()*100+'vw';n.style.background=['#8B6FC0','#E7B8D8','#ffce73','#77cdb0'][i%4];n.style.animationDelay=Math.random()*.3+'s';document.body.appendChild(n);setTimeout(()=>n.remove(),1900)}}let orderShuffle={};function start(){idx=0;responses={};orderShuffle={};render()}function home(){idx=-1;render()}function next(){if(idx<questions.length-1)idx++;else idx=questions.length;render()}function prev(){idx=Math.max(0,idx-1);render()}function score(){return questions.reduce((s,q,i)=>s+(responses[i]?.correct?1:0),0)}function render(){if(idx===-1){el.innerHTML=`<div class="brand">✦ SPANISH WITH JACKIE</div><div class="hero"><div class="emoji">👻🎃</div><h1>¡Qué miedo!</h1><p>Práctica interactiva · Español A2</p><p>20 retos · 8 bloques · diálogos, conjugaciones, ordenar, relacionar y más. Sin lecturas ni verdadero/falso.</p><button class="primary" onclick="start()">Comenzar aventura →</button></div>`;return}if(idx===questions.length){el.innerHTML=`<div class="brand">✦ SPANISH WITH JACKIE</div><div class="result"><div class="big">${score()>18?'🏆':'🎃'}</div><h1>¡Lo lograste!</h1><h2>${score()} / ${questions.length} respuestas correctas</h2><p>${score()>18?'¡Excelente dominio!':score()>12?'¡Vas muy bien! function save(value,correct,done=true){responses[idx]={...(responses[idx]||{}),value,correct,done};sound(correct);if(correct)confetti();render()}function submitChoice(i){if(responses[idx])return;save(i,i===questions[idx].answer)}function norm(s){return s.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!.,]/g,'').replace(/\s+/g,' ')}function submitFill(){if(responses[idx])return;let v=document.getElementById('fill').value;if(!v.trim())return;save(v,questions[idx].answers.some(a=>norm(a)===norm(v)))}function pickOrder(i){let r=responses[idx]||{picked:[]};if(r.done)return;r.picked.push(i);responses[idx]=r;render()}function undoOrder(j){let r=responses[idx];if(!r||r.done)return;r.picked.splice(j,1);render()}function submitOrder(){let q=questions[idx],r=responses[idx];if(!r||r.picked.length!==q.words.length)return;let correct=r.picked.every((v,i)=>v===i);save(r.picked,correct)}function leftMatch(i){let r=responses[idx]||{picked:[]};r.selected=i;responses[idx]=r;render()}function rightMatch(i){let q=questions[idx],r=responses[idx];if(!r||r.selected===undefined||r.selected<0||r.picked.some(p=>p[1]===i))return;r.picked.push([r.selected,i]);r.selected=-1;if(r.picked.length===q.left.length){r.correct=r.picked.every(([a,b])=>q.pairs[a]===b);r.done=true;sound(r.correct);if(r.correct)confetti()}render()}function resetMatch(){responses[idx]={picked:[],selected:-1};render()}render();
