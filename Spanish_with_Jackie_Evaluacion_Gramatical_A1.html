const STORAGE='swj_gramatica_a1_v1';
const TOPICS=["Ser y estar","Presente regular","Presente irregular","Tener, hay y ubicación","Artículos, género y número","Adjetivos y concordancia","Posesivos y demostrativos","Gustar y preferencias","Verbos reflexivos","Preguntas e interrogativos","Perífrasis verbales"];
const KINDS={choice:['✦','Elige la respuesta'],fill:['✎','Completa el espacio'],match:['⇄','Relaciona'],order:['▥','Ordena'],fix:['✎','Corrige el error'],image:['◈','Observa la imagen']};
const $=s=>document.querySelector(s);
const escapeHTML=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const fresh=()=>({version:1,phase:'welcome',name:'',index:0,answers:{},seconds:0,startedAt:null,finishedAt:null});
let state=fresh(),localWorks=true,filter='all',mobileOpen=false,selMatchLeft=null,reviewOpen=false,reviewOnlyErrors=true;
try{const saved=localStorage.getItem(STORAGE);if(saved){const data=JSON.parse(saved);if(data.version===1&&data.answers&&typeof data.answers==='object')state={...fresh(),...data};}}catch(e){localWorks=false;}
function save(){if(!localWorks)return;try{localStorage.setItem(STORAGE,JSON.stringify(state));const s=$('#saveStatus');if(s)s.textContent='✓ Guardado automáticamente';}catch(e){localWorks=false;const s=$('#saveStatus');if(s)s.textContent='Guarda tu informe antes de cerrar';}}
function answerOf(q){return state.answers[q.id]}
function answered(q){let a=answerOf(q);if(q.kind==='choice'||q.kind==='image')return Number.isInteger(a);if(q.kind==='fill')return typeof a==='string'&&a.trim().length>0;if(q.kind==='order')return Array.isArray(a)&&a.length===q.tokens.length;if(q.kind==='match')return a&&typeof a==='object'&&q.left.every((_,i)=>Number.isInteger(a[i]));if(q.kind==='fix')return a&&Number.isInteger(a.mark)&&Number.isInteger(a.replacement);return false}
function normalize(s){return String(s??'').trim().replace(/\s+/g,' ').toLocaleLowerCase('es')}
function correct(q){if(!answered(q))return false;let a=answerOf(q);if(q.kind==='choice'||q.kind==='image')return a===q.correct;if(q.kind==='fill')return [q.answer,...(q.accept||[])].some(x=>normalize(x)===normalize(a));if(q.kind==='order')return a.length===q.order.length&&a.every((v,i)=>v===q.order[i]);if(q.kind==='match')return q.mapping.every((v,i)=>a[i]===v);if(q.kind==='fix')return a.mark===q.wrong&&a.replacement===q.correct;return false}
function count(level){return QUESTIONS.filter(q=>q.level===level&&answered(q)).length}
function totalRight(level){return QUESTIONS.filter(q=>q.level===level&&correct(q)).length}
function formatTime(s){const m=Math.floor(s/60);return `${m} min ${String(s%60).padStart(2,'0')} s`}
function render(){const root=$('#root');if(state.phase==='welcome')root.innerHTML=welcomeHTML();else if(state.phase==='test')root.innerHTML=testHTML();else root.innerHTML=resultsHTML();updateHud();}
function updateHud(){const s=$('#saveStatus');if(s&&!localWorks)s.textContent='Guardado local no disponible';if(state.phase==='test'){const bar=$('#progressFill');if(bar)bar.style.width=(100*(count('A1')+count('A2'))/45)+'%';const answeredA1=$('#progressA1');if(answeredA1)answeredA1.textContent=`A1: ${count('A1')} / 40`;const answeredA2=$('#progressA2');if(answeredA2)answeredA2.textContent=`A2: ${count('A2')} / 5`;}}
function welcomeHTML(){return `<section class="hero"><div class="heroText"><span class="eyebrow">Tu diagnóstico de español</span><h1>¡Pon a prueba<br>tu <em>gramática!</em></h1><p>Una evaluación interactiva para descubrir lo que ya sabes y los temas que puedes seguir practicando.</p><div class="pills"><span>✓ 40 preguntas A1</span><span>✦ 5 preguntas A2 adicionales</span><span>⏱ Sin límite de tiempo</span></div><label class="fieldLabel" for="studentName">Tu nombre (opcional)</label><input class="nameInput" id="studentName" type="text" maxlength="90" placeholder="Escribe tu nombre" value="${escapeHTML(state.name)}" oninput="setName(this.value)"><div class="heroActions"><button class="primaryBtn" onclick="begin()">${state.startedAt?'Continuar evaluación':'Comenzar evaluación'} <span aria-hidden="true">→</span></button>${state.startedAt?'<button class="lightBtn" onclick="askReset()">Empezar de cero</button>':''}</div><p style="margin-top:21px;font-size:13px">Responde sin consultar apuntes ni traductores. Tus respuestas se guardan automáticamente en este navegador.</p></div><div class="heroArt" aria-hidden="true"><div class="sun"></div><span class="leaf l1">✳</span><div class="artCard"><div class="artBadge">MI GRAN RETO</div><div class="giant">A1<span style="font-size:40px;color:#ee977c">✦</span></div><div class="dots"><i></i><i></i><i></i></div></div><span class="leaf l2">✳</span><span class="star">★</span></div></section><section class="howItWorks"><div class="howCard"><div class="howIcon">✍️</div><div><strong>Ejercicios diferentes</strong><p>Elegir, completar, ordenar, relacionar, corregir y observar imágenes.</p></div></div><div class="howCard"><div class="howIcon">🌱</div><div><strong>Avanza a tu ritmo</strong><p>Puedes salir y continuar después desde este mismo navegador.</p></div></div><div class="howCard"><div class="howIcon">📊</div><div><strong>Descubre tu resultado</strong><p>Revisa tus errores y descarga un informe para enviar a tu profesora.</p></div></div></section>`}
function setName(v){state.name=v.slice(0,90);save()}
function begin(){const v=$('#studentName');if(v)state.name=v.value.slice(0,90);if(!state.startedAt)state.startedAt=new Date().toISOString();state.phase='test';save();render();scrollTop()}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}
function testHTML(){const q=QUESTIONS[state.index];let all=count('A1')+count('A2');return `<section class="topProgress"><div class="progressHead"><strong>Tu evaluación está en marcha ✨</strong><span>Pregunta ${q.id} de 45</span><button class="softBtn mobileNavToggle" onclick="toggleNav()">☷ Ver preguntas</button></div><div class="progressNumbers"><span id="progressA1">A1: ${count('A1')} / 40</span> · <span id="progressA2">A2: ${count('A2')} / 5</span></div><div class="track"><div class="trackFill" id="progressFill" style="width:${all/45*100}%"></div></div></section><div class="testLayout"><div><section class="questionCard"><div class="questionStripe"></div><div class="questionInner"><span class="taskLabel ${q.level==='A2'?'a2':''}">${KINDS[q.kind][0]} ${KINDS[q.kind][1]}</span><span class="topicName">${q.level==='A2'?'Bloque adicional A2':escapeHTML(q.topic)}</span><div class="questionNum">PREGUNTA ${String(q.id).padStart(2,'0')} / 45</div><div class="instruction">${escapeHTML(q.instruction)}</div><h1 class="questionPrompt">${escapeHTML(q.prompt)}</h1>${q.scene?`<figure class="qIllustration" role="img" aria-label="Ilustración de apoyo">${sceneSVG(q.scene)}</figure>`:''}<div class="answerArea">${answerUI(q)}</div>${q.level==='A2'?'<p class="helpText" style="margin-top:20px">Esta pregunta es adicional y no cambia tu calificación A1.</p>':''}</div><div class="qNav"><span class="warning">${answered(q)?'✓ Respuesta guardada':'◌ Todavía sin responder'}</span><div class="qNavButtons"><button class="lightBtn" onclick="goQuestion(${state.index-1})" ${state.index===0?'disabled':''}>← Anterior</button><button class="primaryBtn" onclick="${state.index===44?'askFinish()':`goQuestion(${state.index+1})`}">${state.index===44?'Ver resultados':'Siguiente →'}</button></div></div></section><div class="finishBar"><div><strong>¿Ya terminaste?</strong><p>Al finalizar verás tus soluciones y el diagnóstico de cada tema.</p></div><button class="softBtn" onclick="askFinish()">Finalizar evaluación</button></div></div><aside class="sidePanel ${mobileOpen?'mobileOpen':''}" id="sidePanel"><div class="sideTop"><h3>Tu recorrido</h3><span class="tinyText">${all}/45</span></div><div class="navFilters"><button class="${filter==='all'?'active':''}" onclick="setFilter('all')">Todas</button><button class="${filter==='A1'?'active':''}" onclick="setFilter('A1')">A1</button><button class="${filter==='A2'?'active':''}" onclick="setFilter('A2')">A2 extra</button></div><div class="numberGrid">${QUESTIONS.filter(x=>filter==='all'||x.level===filter).map(x=>`<button title="Pregunta ${x.id} · ${escapeHTML(x.topic)}" class="numberBtn ${answered(x)?'answered':''} ${x.id===q.id?'current':''} ${x.level==='A2'?'extra':''}" onclick="goQuestion(${x.id-1})">${x.id}</button>`).join('')}</div><div class="sideNote"><i class="keyDot"></i> Respondidas <i class="keyDot purple"></i> A2 adicional</div><div class="sideDivider"></div><div class="sideSmall">No te preocupes si no sabes una respuesta: puedes dejarla pendiente y volver después.<p><b>Tiempo empleado:</b> <span id="timeCounter">${formatTime(state.seconds)}</span></p></div></aside></div>`}
function answerUI(q){const a=answerOf(q);switch(q.kind){case 'choice':case 'image':return `<div class="options">${q.choices.map((label,i)=>`<button class="option ${a===i?'selected':''}" onclick="choose(${q.id},${i})" aria-pressed="${a===i}"><span class="optionLetter">${'ABC'[i]}</span><span>${escapeHTML(label)}</span></button>`).join('')}</div>`;
case 'fill':return `<div class="fillWrap"><label class="fillLabel" for="fillAnswer">Tu respuesta</label><input id="fillAnswer" class="answerInput" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" value="${escapeHTML(typeof a==='string'?a:'')}" placeholder="Escribe la palabra que falta…" oninput="writeAnswer(${q.id},this.value)"><p class="helpText">Escribe solo la palabra que falta, con su ortografía correcta.</p></div>`;
case 'order':{let selected=Array.isArray(a)?a:[];return `<div><div class="fillLabel">Tu oración (haz clic para quitar una palabra)</div><div class="tokenAnswer">${selected.length?selected.map((id,pos)=>`<button class="wordChip used" onclick="removeToken(${q.id},${pos})">${escapeHTML(q.tokens[id])} ×</button>`).join(''):'<span class="placeholder">Las palabras aparecerán aquí…</span>'}</div><div class="fillLabel">Toca las palabras en el orden correcto</div><div class="tokenPool">${q.tokens.map((token,i)=>selected.includes(i)?'':`<button class="wordChip" onclick="addToken(${q.id},${i})">${escapeHTML(token)}</button>`).join('')}</div><button class="lightBtn" onclick="clearAnswer(${q.id})">↺ Reiniciar orden</button></div>`}
case 'match':{const map=(a&&typeof a==='object'&&!Array.isArray(a))?a:{};const inverse=Object.entries(map).reduce((o,[left,right])=>(o[right]=left,o),{});return `<p class="helpText">Primero selecciona una palabra a la izquierda. Después toca su pareja a la derecha.</p><div class="pairLayout"><div><div class="pairTitle">Columna A</div>${q.left.map((v,i)=>`<button class="pairBtn ${selMatchLeft===i?'active':''} ${Number.isInteger(map[i])?'assigned':''}" onclick="pickLeft(${q.id},${i})"><span>${escapeHTML(v)}</span><span class="bubble">${Number.isInteger(map[i])?escapeHTML(q.right[map[i]]):'→'}</span></button>`).join('')}</div><div><div class="pairTitle">Columna B</div>${q.right.map((v,i)=>`<button class="pairBtn right ${inverse[i]!==undefined?'assigned':''}" onclick="pickRight(${q.id},${i})"><span>${escapeHTML(v)}</span><span class="bubble">${inverse[i]!==undefined?'✓':'+'}</span></button>`).join('')}</div></div><p class="helpText">${selMatchLeft===null?'Selecciona un elemento de la izquierda.':'Ahora elige su pareja a la derecha.'}</p><button class="lightBtn" onclick="clearAnswer(${q.id})">↺ Reiniciar parejas</button>`}
case 'fix':{const r=a&&typeof a==='object'?a:{};return `<div class="fillLabel">1. Toca la palabra o expresión incorrecta</div><div class="fixSentence">${q.pieces.map((v,i)=>`<button class="piece ${r.mark===i?'marked':''}" onclick="markWrong(${q.id},${i})">${escapeHTML(v)}</button>`).join('')}</div><div class="fixOptions"><label>2. Elige la corrección</label><div class="options">${q.replacements.map((v,i)=>`<button class="option ${r.replacement===i?'selected':''}" onclick="replaceWrong(${q.id},${i})"><span class="optionLetter">${'ABC'[i]}</span><span>${escapeHTML(v)}</span></button>`).join('')}</div></div><p class="helpText">Debes identificar el error y seleccionar la corrección.</p>`}
}}
function choose(id,i){state.answers[id]=i;save();render()}
function writeAnswer(id,v){state.answers[id]=v;save();updateHud();const status=$('.qNav .warning');if(status)status.textContent=v.trim()?'✓ Respuesta guardada':'◌ Todavía sin responder'}
function addToken(id,i){let arr=Array.isArray(state.answers[id])?state.answers[id]:[];if(!arr.includes(i))state.answers[id]=[...arr,i];save();render()}
function removeToken(id,pos){let arr=Array.isArray(state.answers[id])?state.answers[id]:[];state.answers[id]=arr.filter((_,i)=>i!==pos);save();render()}
function clearAnswer(id){delete state.answers[id];selMatchLeft=null;save();render()}
function pickLeft(id,i){selMatchLeft=i;render()}
function pickRight(id,i){if(selMatchLeft===null)return;let val=state.answers[id];val=(val&&typeof val==='object'&&!Array.isArray(val))?{...val}:{};for(const k of Object.keys(val)){if(val[k]===i)delete val[k]}val[selMatchLeft]=i;state.answers[id]=val;selMatchLeft=null;save();render()}
function markWrong(id,i){let a=state.answers[id];state.answers[id]={mark:i,replacement:a&&Number.isInteger(a.replacement)?a.replacement:null};save();render()}
function replaceWrong(id,i){let a=state.answers[id];state.answers[id]={mark:a&&Number.isInteger(a.mark)?a.mark:null,replacement:i};save();render()}
function goQuestion(i){if(i<0||i>=QUESTIONS.length)return;state.index=i;selMatchLeft=null;save();render();scrollTop()}
function setFilter(v){filter=v;render()}
function toggleNav(){mobileOpen=!mobileOpen;render()}
function askFinish(){const na=40-count('A1'),nb=5-count('A2');$('#modalRoot').innerHTML=`<div class="modalOverlay" onclick="if(event.target.classList.contains('modalOverlay'))closeModal()"><div class="modalCard" role="dialog" aria-modal="true" aria-label="Finalizar evaluación"><div style="font-size:42px">🎉</div><h2>¿Terminaste la evaluación?</h2><p>Has respondido <strong>${count('A1')} de 40</strong> preguntas A1 y <strong>${count('A2')} de 5</strong> adicionales A2.</p>${na?`<p style="color:#ad674d;font-weight:800">Tienes ${na} preguntas A1 sin responder. Se calificarán como incorrectas.</p>`:''}<p>Las preguntas A2 no afectan tu calificación A1. Después de finalizar podrás revisar las soluciones.</p><div class="modalActions"><button class="lightBtn" onclick="closeModal()">Seguir respondiendo</button><button class="primaryBtn" onclick="finish()">Finalizar y ver resultados →</button></div></div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function finish(){state.finishedAt=new Date().toISOString();state.phase='results';closeModal();save();render();scrollTop()}
function percent(n,d){return Math.round(100*n/d)}
function topicsReport(){return TOPICS.map(topic=>{const qs=QUESTIONS.filter(q=>q.topic===topic),hit=qs.filter(correct).length;return {topic,hit,total:qs.length,pct:percent(hit,qs.length)}})}
function resultsHTML(){const a1=totalRight('A1'),a2=totalRight('A2'),name=state.name.trim()?escapeHTML(state.name.trim()):'Estudiante';const topics=topicsReport();const weakest=topics.filter(t=>t.pct<80).sort((a,b)=>a.pct-b.pct);const priorities=weakest.length?weakest.slice(0,3):[];return `<section id="printReport"><div class="resultHero"><div class="eyebrow">¡Evaluación terminada!</div><h1>${name}, este es tu resultado ✨</h1><p>Revisa tus puntos fuertes y descubre qué temas necesitas practicar.</p><div style="margin-top:15px;color:#dcf6f2;font-size:13px">Tiempo empleado: ${formatTime(state.seconds)} · ${new Intl.DateTimeFormat('es-PE',{dateStyle:'long'}).format(new Date(state.finishedAt||Date.now()))}</div></div><section class="resultGrid"><div class="scoreCard"><div class="topline"><h2>Resultado A1</h2><span class="taskLabel">40 preguntas</span></div><div class="scoreNum">${percent(a1,40)}%</div><p><strong style="color:#2c6972">${a1} respuestas correctas de 40</strong></p><div class="scoreLine"><div style="width:${percent(a1,40)}%"></div></div><p>Esta es tu puntuación principal.</p></div><div class="scoreCard extra"><div class="topline"><h2>Bloque adicional A2</h2><span class="taskLabel a2">No afecta A1</span></div><div class="scoreNum">${count('A2')===0?'—':percent(a2,5)+'%'}</div><p><strong style="color:#725e9e">${a2} de 5 correctas · ${count('A2')} respondidas</strong></p><div class="scoreLine"><div style="width:${percent(a2,5)}%"></div></div><p>Para explorar lo que ya sabes del siguiente nivel.</p></div></section><section class="reportSection"><h2>Resultados por tema gramatical</h2><p class="mutedInfo" style="margin-top:-6px">Cada barra muestra tu porcentaje de respuestas correctas en ese tema.</p>${topics.map(t=>`<div class="topicItem"><div><div class="topicLabel"><span>${escapeHTML(t.topic)}</span><span class="topicStatus">${t.pct>=80?'¡Muy bien!':t.pct>=60?'En proceso':'Para practicar'}</span></div><div class="miniBar"><span class="${t.pct<60?'low':t.pct<80?'med':''}" style="width:${t.pct}%"></span></div></div><div class="topicScore">${t.hit} / ${t.total} · ${t.pct}%</div></div>`).join('')}</section><section class="reportSection"><h2>Tu siguiente paso 🌱</h2>${priorities.length?`<p class="mutedInfo">Estos son los tres temas que conviene reforzar primero:</p>${priorities.map((t,i)=>`<div class="priority">${i+1}. ${escapeHTML(t.topic)} · ${t.hit}/${t.total} correctas</div>`).join('')}`:'<div class="priority ok">¡Muy bien! Tu resultado A1 es sólido en todos los temas evaluados.</div>'}<p class="tinyText" style="margin-top:12px">Esta evaluación ofrece un diagnóstico orientativo de gramática; no determina por sí sola tu nivel general de español.</p></section><section class="reportSection" id="reviewSection"><div class="reviewTop"><div><h2 style="margin-bottom:5px">Revisión de respuestas</h2><p class="mutedInfo" style="margin-top:0">Las soluciones se muestran solo después de finalizar.</p></div><button class="softBtn" onclick="toggleReview()">${reviewOpen?'Ocultar revisión':'Ver mis respuestas'}</button></div>${reviewOpen?reviewHTML():''}</section></section><div class="actionRow"><button class="primaryBtn" onclick="downloadReport()">↓ Descargar informe</button><button class="softBtn" onclick="window.print()">▤ Imprimir / Guardar en PDF</button><button class="lightBtn" onclick="askReset()">↻ Nueva evaluación</button></div><p class="tinyText">Guarda el informe y envíaselo a tu profesora. Las respuestas no se envían automáticamente por internet.</p>`}
function toggleReview(){reviewOpen=!reviewOpen;render();const el=$('#reviewSection');if(el)el.scrollIntoView({block:'start',behavior:'instant'})}
function toggleErrorOnly(){reviewOnlyErrors=!reviewOnlyErrors;render();const el=$('#reviewSection');if(el)el.scrollIntoView({block:'start',behavior:'instant'})}
function reviewHTML(){let qs=reviewOnlyErrors?QUESTIONS.filter(q=>!correct(q)):QUESTIONS;return `<div style="margin:14px 0 10px"><button class="lightBtn" onclick="toggleErrorOnly()">${reviewOnlyErrors?'Mostrar también las correctas':'Mostrar solo errores'}</button></div>${qs.length?qs.map(q=>reviewItemHTML(q)).join(''):'<p>¡No hay errores que revisar! 🎉</p>'}`}
function displayAnswer(q,a,solution=false){if(!solution&&!answered(q))return 'Sin respuesta';if(q.kind==='choice'||q.kind==='image'){const v=solution?q.correct:a;return q.choices[v]??'Sin respuesta'}if(q.kind==='fill')return solution?q.answer:(a||'Sin respuesta');if(q.kind==='order')return (solution?q.order:a).map(i=>q.tokens[i]).join(' ');if(q.kind==='match')return q.left.map((left,i)=>left+' → '+(solution?q.right[q.mapping[i]]:(Number.isInteger(a[i])?q.right[a[i]]:'—'))).join('; ');if(q.kind==='fix')return solution?q.correction:`Marcaste «${q.pieces[a.mark]||'—'}» y elegiste «${q.replacements[a.replacement]||'—'}»`;return ''}
function reviewItemHTML(q){const ok=correct(q),has=answered(q),a=answerOf(q);return `<div class="reviewItem"><div class="reviewTop"><strong>${q.id}. ${escapeHTML(q.prompt)} <span style="color:#819596;font-weight:600;font-size:12px">(${escapeHTML(q.topic)})</span></strong><span class="statusBadge ${ok?'good':has?'bad':'blank'}">${ok?'✓ Correcta':has?'✕ Por revisar':'— Sin respuesta'}</span></div><div class="reviewBody"><div><b>Tu respuesta:</b> ${escapeHTML(displayAnswer(q,a))}</div><div><b>Respuesta correcta:</b> ${escapeHTML(displayAnswer(q,a,true))}</div><div class="why">${escapeHTML(q.explanation)}</div></div></div>`}
function downloadReport(){const name=state.name.trim()||'Estudiante',date=new Date(state.finishedAt||Date.now()).toLocaleDateString('es-PE');const rows=topicsReport();const all=QUESTIONS.map(q=>({q,ok:correct(q),a:answerOf(q)}));const clean=escapeHTML;const documentHTML=`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Informe A1 — ${clean(name)}</title><style>body{font:15px/1.55 Arial,sans-serif;color:#23424b;max-width:880px;margin:34px auto;padding:0 25px}h1{color:#0b777d}h2{color:#168b86;border-bottom:2px solid #d6ebe5;padding-bottom:8px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #e0e9e7;text-align:left;padding:8px 10px}th{background:#eef7f4}article{padding:12px 0;border-bottom:1px solid #eee}small{color:#748a8e}.score{background:#e5f7ed;border-radius:15px;padding:14px 20px;margin:12px 0}.wrong{background:#fff8ef}.status{font-weight:bold}.muted{color:#667a7e}@media print{body{margin:0;max-width:none}article{break-inside:avoid}}</style></head><body><h1>Spanish with Jackie</h1><h2>Informe de evaluación gramatical A1</h2><p><b>Estudiante:</b> ${clean(name)}<br><b>Fecha:</b> ${clean(date)}<br><b>Tiempo empleado:</b> ${formatTime(state.seconds)}</p><div class="score"><b>A1: ${totalRight('A1')}/40 (${percent(totalRight('A1'),40)}%)</b><br>A2 adicional: ${totalRight('A2')}/5 (${count('A2')} respondidas). A2 no afecta la nota A1.</div><h2>Resultados por tema</h2><table><tr><th>Tema</th><th>Correctas</th><th>Porcentaje</th></tr>${rows.map(r=>`<tr><td>${clean(r.topic)}</td><td>${r.hit}/${r.total}</td><td>${r.pct}%</td></tr>`).join('')}</table><h2>Revisión de las 45 preguntas</h2>${all.map(({q,ok,a})=>`<article class="${ok?'':'wrong'}"><div class="status">${q.id}. ${clean(q.prompt)} — ${ok?'Correcta':'Incorrecta o sin respuesta'}</div><small>${clean(q.level)} · ${clean(q.topic)}</small><div>Respuesta: ${clean(displayAnswer(q,a))}</div><div>Solución: ${clean(displayAnswer(q,a,true))}</div><div class="muted">${clean(q.explanation)}</div></article>`).join('')}<p><small>Diagnóstico orientativo, no certificado oficial. Todo el procesamiento ocurre en tu navegador.</small></p></body></html>`;const blob=new Blob([documentHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Informe_Evaluacion_A1_'+name.replace(/[^\p{L}\p{N}_-]+/gu,'_').slice(0,40)+'.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function askReset(){$('#modalRoot').innerHTML=`<div class="modalOverlay" onclick="if(event.target.classList.contains('modalOverlay'))closeModal()"><div class="modalCard" role="dialog" aria-modal="true"><h2>¿Iniciar una nueva evaluación?</h2><p>Se borrarán las respuestas y el resultado guardados en este navegador. Descarga el informe antes de continuar.</p><div class="modalActions"><button class="lightBtn" onclick="closeModal()">Cancelar</button><button class="coralBtn" onclick="resetAssessment()">Sí, empezar de nuevo</button></div></div></div>`}
function resetAssessment(){state=fresh();selMatchLeft=null;reviewOpen=false;reviewOnlyErrors=true;mobileOpen=false;closeModal();save();render();scrollTop()}

if(type==='cat')return header+`<rect y="241" width="650" height="59" fill="#f7dec6"/><rect x="101" y="92" width="458" height="31" rx="13" fill="#ab8056"/><rect x="126" y="122" width="25" height="138" fill="#98724d"/><rect x="507" y="122" width="25" height="138" fill="#98724d"/><ellipse cx="334" cy="220" rx="70" ry="42" fill="#f2ae70"/><path d="M293 197 L296 169 L315 185 L335 176 L356 184 L378 169 L382 200" fill="#f2ae70"/><circle cx="322" cy="208" r="4" fill="#303d47"/><circle cx="354" cy="208" r="4" fill="#303d47"/><path d="M337 218 L343 221 L337 225" fill="#b56853"/><path d="M380 223 Q449 220 425 163" stroke="#f2ae70" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M268 220 H303 M362 220 H390" stroke="#b56853" stroke-width="2"/><path d="M315 246 L311 257 M351 246 L355 257" stroke="#de975e" stroke-width="8"/></svg>`;
if(type==='ana')return header+`<ellipse cx="326" cy="294" rx="192" ry="28" fill="#cfe7df"/><path d="M273 94 Q275 28 334 28 Q389 29 389 106 L381 143 L268 140Z" fill="#3e4a5d"/><ellipse cx="329" cy="104" rx="57" ry="65" fill="#f6c7ab"/><path d="M273 85 Q290 39 327 48 Q357 48 386 85 Q358 66 331 65 Q307 65 273 85" fill="#3e4a5d"/><circle cx="308" cy="106" r="5" fill="#293f48"/><circle cx="348" cy="106" r="5" fill="#293f48"/><path d="M311 137 Q327 150 343 137" fill="none" stroke="#b46e68" stroke-width="4" stroke-linecap="round"/><path d="M284 167 L242 186 L211 300 L447 300 L410 186 L373 167 L345 191 L309 191Z" fill="#e66a5e"/><path d="M281 171 L300 188 L329 224 L359 187 L379 170" fill="none" stroke="#c5524a" stroke-width="8"/><path d="M220 280 L193 300 M430 280 L462 300" stroke="#f1a58d" stroke-width="25" stroke-linecap="round"/><text x="466" y="88" font-size="24" class="sceneText">Ana</text></svg>`;
return header+'</svg>'}
// El tiempo cuenta solo mientras la actividad está abierta y visible. No hay límite ni cuenta regresiva.
setInterval(()=>{if(state.phase==='test'&&!document.hidden){state.seconds+=1;const el=$('#timeCounter');if(el)el.textContent=formatTime(state.seconds);if(state.seconds%5===0)save()}},1000);
window.addEventListener('beforeunload',()=>{if(state.phase==='test')save()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').innerHTML)closeModal();});
render();
</script>
