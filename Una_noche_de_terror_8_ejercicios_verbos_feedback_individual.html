const EXERCISES=[{"id":"per1","module":"PERÍFRASIS","title":"¿Murió, volvió o sigue?","subtitle":"Elige la expresión que mejor describe el hábito.","type":"choice","icon":"🪦","items":[{"q":"Gonzalo antes tomaba café de noche, pero ahora solo toma té.","options":["Dejó de tomar café de noche.","Volvió a tomar café de noche.","Sigue tomando café de noche."],"answer":"Dejó de tomar café de noche.","why":"El hábito terminó: dejar de + infinitivo."},{"q":"Carmen no iba al gimnasio desde 2021. Ayer se inscribió otra vez.","options":["Sigue yendo al gimnasio.","Volvió a ir al gimnasio.","Dejó de ir al gimnasio."],"answer":"Volvió a ir al gimnasio.","why":"El hábito regresó: volver a + infinitivo."},{"q":"Pablo comenzó a leer antes de dormir hace cinco años y todavía lo hace.","options":["Dejó de leer antes de dormir.","Volvió a leer antes de dormir.","Sigue leyendo antes de dormir."],"answer":"Sigue leyendo antes de dormir.","why":"El hábito continúa: seguir + gerundio."},{"q":"Elena no compraba dulces desde la escuela. Esta semana compró una bolsa.","options":["Volvió a comprar dulces.","Sigue comprando dulces.","Dejó de comprar dulces."],"answer":"Volvió a comprar dulces.","why":"Se retoma un hábito abandonado."},{"q":"Martina comía carne todos los días. Desde enero es vegetariana.","options":["Volvió a comer carne.","Dejó de comer carne.","Sigue comiendo carne."],"answer":"Dejó de comer carne.","why":"La acción ya no se realiza."}]},{"id":"per2","module":"PERÍFRASIS","title":"La palabra desaparecida","subtitle":"Completa cada oración con la forma correcta.","type":"cloze","icon":"🕯️","items":[{"before":"Antes miraba películas de terror todos los viernes, pero el mes pasado ","after":" de verlas.","options":["dejé","volví","seguí"],"answer":"dejé","why":"Dejé de verlas: el hábito terminó en el pasado."},{"before":"Después de varios años, el sábado pasado ","after":" a bailar salsa.","options":["dejé","volví","seguí"],"answer":"volví","why":"Volví a bailar: una actividad se retomó."},{"before":"Aunque tengo mucho trabajo, todavía ","after":" estudiando español.","options":["dejo","vuelvo","sigo"],"answer":"sigo","why":"Sigo + gerundio: una actividad que continúa."},{"before":"Cuando era niño, ","after":" jugar afuera hasta la noche.","options":["solía","he solido","volví"],"answer":"solía","why":"Solía + infinitivo expresa costumbre en el pasado."},{"before":"Esta semana ","after":" a preparar mi desayuno en casa.","options":["he vuelto","volvía","había vuelto"],"answer":"he vuelto","why":"Esta semana puede presentarse como periodo aún conectado al presente."},{"before":"Desde hace seis meses, mi hermano ","after":" corriendo por las mañanas.","options":["sigue","deja","volvió"],"answer":"sigue","why":"Sigue corriendo: la costumbre se mantiene."}]},{"id":"pas2","module":"LOS TRES PASADOS","title":"¿Qué tiempo encaja?","subtitle":"Escoge la forma verbal adecuada según la situación.","type":"choice","icon":"⌛","items":[{"q":"Cuando Gonzalo era niño, ___ películas de terror todos los sábados.","options":["vio","veía","ha visto"],"answer":"veía","why":"Era una costumbre repetida en el pasado: imperfecto."},{"q":"Ayer por la noche, Gonzalo ___ de usar el celular antes de dormir.","options":["dejó","dejaba","ha dejado"],"answer":"dejó","why":"Ayer sitúa un cambio puntual y terminado: indefinido."},{"q":"Esta semana, Elena ___ a preparar mate en casa.","options":["volvía","volvió","ha vuelto"],"answer":"ha vuelto","why":"En este contexto, esta semana se presenta como un periodo abierto."},{"q":"Antes de mudarse a Lima, Andrés ___ a su abuela cada domingo.","options":["visitaba","visitó","ha visitado"],"answer":"visitaba","why":"Una costumbre habitual en una etapa pasada: imperfecto."},{"q":"El mes pasado, Carmen ___ el hábito de leer antes de dormir.","options":["recuperaba","recuperó","ha recuperado"],"answer":"recuperó","why":"El mes pasado es un periodo terminado: indefinido."}]},{"id":"pas4","module":"LOS TRES PASADOS","title":"El detective de los errores","subtitle":"Cada oración tiene un error. Selecciona la corrección más natural.","type":"fix","icon":"🔎","items":[{"wrong":"Ayer he dejado de fumar.","choices":["Ayer dejé de fumar.","Ayer dejaba de fumar.","Ayer he dejando de fumar."],"answer":"Ayer dejé de fumar.","why":"En este contexto, ayer es un tiempo cerrado; se usa indefinido."},{"wrong":"Cuando era niña, he jugado en el parque todas las tardes.","choices":["Cuando era niña, jugué en el parque todas las tardes.","Cuando era niña, jugaba en el parque todas las tardes.","Cuando era niña, he jugaba en el parque todas las tardes."],"answer":"Cuando era niña, jugaba en el parque todas las tardes.","why":"Todas las tardes describe una costumbre: imperfecto."},{"wrong":"Hace dos semanas volví de hacer ejercicio.","choices":["Hace dos semanas volví haciendo ejercicio.","Hace dos semanas volví a hacer ejercicio.","Hace dos semanas volví hacer ejercicio."],"answer":"Hace dos semanas volví a hacer ejercicio.","why":"Volver a + infinitivo: no se sustituye la preposición a por de."},{"wrong":"Sigo a estudiando por las noches.","choices":["Sigo estudiar por las noches.","Sigo de estudiar por las noches.","Sigo estudiando por las noches."],"answer":"Sigo estudiando por las noches.","why":"Seguir + gerundio, sin preposición."},{"wrong":"He dejado a tomar café esta semana.","choices":["He dejado de tomar café esta semana.","He dejado tomando café esta semana.","He dejado para tomar café esta semana."],"answer":"He dejado de tomar café esta semana.","why":"Dejar de + infinitivo."}]},{"id":"con2","module":"CONECTORES","title":"Une las dos mitades","subtitle":"Relaciona las frases para formar ideas coherentes.","type":"match","icon":"🔗","pairs":[{"left":"Dejé de tomar café de noche…","right":"porque me costaba dormir."},{"left":"Antes solía salir a correr…","right":"cuando vivía cerca del parque."},{"left":"Volví a leer novelas…","right":"después de terminar mis exámenes."},{"left":"Me sentía cansada; sin embargo,…","right":"seguía trabajando hasta tarde."},{"left":"He cambiado de rutina; por eso,…","right":"ahora me levanto más temprano."}],"rightOrder":[3,2,4,0,1]},{"id":"mix1","module":"RETO FINAL","title":"Diálogos en la cripta","subtitle":"Completa cada intervención con la opción que mejor encaja.","type":"dialogue","icon":"💬","items":[{"a":"—¿Sigues viendo películas de terror todas las noches?","b":"—No, el mes pasado ___ porque tenía pesadillas.","options":["dejé de verlas","volví a verlas","seguía viéndolas"],"answer":"dejé de verlas","why":"Un hábito terminó en un periodo cerrado."},{"a":"—¿Y qué pasó con tus clases de baile?","b":"—Las abandoné en 2023, pero esta semana ___ .","options":["solía bailar","he vuelto a bailar","dejé de bailar"],"answer":"he vuelto a bailar","why":"Volver a + infinitivo, con perfecto para una semana aún abierta."},{"a":"—¿Tu abuelo todavía lee el periódico?","b":"—Sí, ___ cada mañana desde hace treinta años.","options":["sigue leyéndolo","dejó de leerlo","volvió a leerlo ayer"],"answer":"sigue leyéndolo","why":"Seguir + gerundio indica continuidad hasta el presente."},{"a":"—¿Cómo era tu rutina cuando vivías en el campo?","b":"—Antes ___ a las cinco de la mañana.","options":["me he levantado","me levantaba","me levanté ayer"],"answer":"me levantaba","why":"El imperfecto presenta una costumbre habitual."},{"a":"—¿Por qué cambiaste tus horarios?","b":"—Dormía poco; ___, decidí acostarme antes.","options":["aunque","por eso","mientras"],"answer":"por eso","why":"Por eso explica una consecuencia."}]},{"id":"mix3","module":"RETO FINAL","title":"Elige el hábito preciso","subtitle":"Distingue entre abandonar, retomar, mantener y acostumbrarse.","type":"choice","icon":"🧠","items":[{"q":"Hace tres años no leo novelas. Si hoy empiezo otra vez, ___ el hábito.","options":["retomo","abandono","mantengo"],"answer":"retomo","why":"Retomar = volver a hacer algo que se había interrumpido."},{"q":"Desde que nació mi hija, ya no salgo de noche: ___ esa costumbre.","options":["he mantenido","he abandonado","me he acostumbrado a"],"answer":"he abandonado","why":"Abandonar una costumbre ≈ dejar de hacerla."},{"q":"Aunque trabaja mucho, nunca falta a sus clases: ___ su rutina.","options":["mantiene","abandona","recupera por primera vez"],"answer":"mantiene","why":"Mantener = continuar con un hábito."},{"q":"Al principio me costaba levantarme temprano, pero ahora ya ___ hacerlo.","options":["he dejado de","me he acostumbrado a","he abandonado"],"answer":"me he acostumbrado a","why":"Acostumbrarse a + infinitivo indica adaptación."},{"q":"Cuando era pequeño, mi papá ___ contarme historias antes de dormir.","options":["tenía la costumbre de","ha vuelto de","seguía a"],"answer":"tenía la costumbre de","why":"Tener la costumbre de + infinitivo describe hábitos."},{"q":"En 2024 decidí ___ de fumar; desde entonces no he fumado.","options":["volver","dejar","seguir"],"answer":"dejar","why":"Dejar de + infinitivo."}]},{"id":"write1","module":"RETO FINAL","type":"write","icon":"✍️","title":"Escribe el conjuro","subtitle":"Conjuga el verbo indicado en cada oración. Comprueba cada respuesta para ver el feedback y la traducción al inglés.","items":[{"before":"Antes veía películas de terror cada noche, pero ayer","after":"verlas.","answer":"dejé de","why":"Se usa «dejé de + infinitivo» para hablar de un hábito que terminó. «Ayer» indica cuándo ocurrió el cambio.","spanish":"Antes veía películas de terror cada noche, pero ayer dejé de verlas.","translation":"I used to watch horror movies every night, but yesterday I stopped watching them.","verb":"dejar"},{"before":"Cuando era niña,","after":"leer cuentos de fantasmas antes de dormir.","answer":"solía","why":"«Solía + infinitivo» presenta un hábito repetido durante la infancia.","spanish":"Cuando era niña, solía leer cuentos de fantasmas antes de dormir.","translation":"When I was a little girl, I used to read ghost stories before going to sleep.","verb":"soler"},{"before":"Este mes,","after":"a hacer ejercicio después de varios años.","answer":"he vuelto","why":"«He vuelto a + infinitivo» indica que se ha retomado una actividad. La referencia «este mes» conecta el cambio con el presente.","spanish":"Este mes, he vuelto a hacer ejercicio después de varios años.","translation":"This month, I've started exercising again after several years.","verb":"volver"},{"before":"Aunque tenía miedo, Gonzalo","after":"viendo la película hasta el final.","answer":"siguió","why":"«Siguió + gerundio» indica que la acción continuó a pesar del miedo.","spanish":"Aunque tenía miedo, Gonzalo siguió viendo la película hasta el final.","translation":"Although he was scared, Gonzalo kept watching the movie until the end.","verb":"seguir"},{"before":"Marina dejó de comer carne porque el año pasado","after":"cambiar sus hábitos.","answer":"decidió","why":"¡Bien! «El año pasado» presenta una decisión puntual y terminada: decidió. La palabra «porque» explica la causa.","spanish":"Marina dejó de comer carne porque el año pasado decidió cambiar sus hábitos.","translation":"Marina stopped eating meat because last year she decided to change her habits.","verb":"decidir"},{"before":"Antes me asustaban los zombis; sin embargo, este mes","after":"a ver películas de terror.","answer":"he vuelto","why":"¡Bien! «He vuelto a + infinitivo» presenta una actividad retomada. «Sin embargo» contrapone el miedo de antes con el cambio de ahora.","spanish":"Antes me asustaban los zombis; sin embargo, este mes he vuelto a ver películas de terror.","translation":"Zombies used to scare me; however, this month I have started watching horror movies again.","verb":"volver"}]}];
const MODULES=[{name:'PERÍFRASIS',short:'🪄 Perífrasis'},{name:'LOS TRES PASADOS',short:'⏳ Los pasados'},{name:'CONECTORES',short:'🔗 Conectores'},{name:'RETO FINAL',short:'🌙 Reto final'}];
const app=document.getElementById('app');
const state={page:-1,answers:{},checked:{},selectedCard:null,selectedMatch:null,muted:true,writeChecked:{}};
const totalItems=EXERCISES.reduce((s,e)=>s+(e.items?e.items.length:e.cards?e.cards.length:e.pairs?e.pairs.length:e.steps?e.steps.length:0),0);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const attr=esc;
function answered(i){if(!state.answers[i]) state.answers[i]={};return state.answers[i]}
function done(i){return !!state.checked[i]}
function totalFor(e){return (e.items||e.cards||e.pairs||e.steps).length}
function moduleIndices(name){return EXERCISES.map((e,i)=>e.module===name?i:-1).filter(i=>i>=0)}
function normalizeWritten(s){return String(s??'').trim().toLocaleLowerCase('es').replace(/\s+/g,' ').replace(/[.!?¡¿]+$/g,'').trim()}
function writtenCorrect(item,value){return [item.answer,...(item.alternatives||[])].some(ans=>normalizeWritten(value)===normalizeWritten(ans))}
function writeIsChecked(i,k){return done(i)||!!(state.writeChecked[i]&&state.writeChecked[i][k])}
function writeCheckedCount(i){return EXERCISES[i].items.filter((_,k)=>writeIsChecked(i,k)).length}
function scoreEx(i){const e=EXERCISES[i],a=answered(i);if(!state.checked[i])return 0;
 if(e.type==='write')return e.items.filter((x,k)=>writtenCorrect(x,a[k])).length;
 if(e.type==='sort')return e.cards.filter(x=>a[x.id]===x.bin).length;
 if(e.type==='match')return e.pairs.filter((x,k)=>a[k]===k).length;
 if(e.type==='order')return e.items.filter((x,k)=>JSON.stringify(a[k]||[])===JSON.stringify(x.tokens.map((_,j)=>j))).length;
 if(e.type==='sequence')return e.steps.filter((x,j)=>(a.seq||[])[j]===x.id).length;
 return e.items.filter((x,k)=>a[k]===x.answer).length;
}
function checkedCount(){return EXERCISES.filter((_,i)=>done(i)).length}
function totalScore(){return EXERCISES.reduce((sum,e,i)=>sum+scoreEx(i),0)}
function play(kind='click'){if(state.muted)return;try{const context=new (window.AudioContext||window.webkitAudioContext)(),osc=context.createOscillator(),gain=context.createGain();osc.type=kind==='ok'?'sine':'triangle';osc.frequency.setValueAtTime(kind==='ok'?530:kind==='bad'?220:370,context.currentTime);if(kind==='ok')osc.frequency.exponentialRampToValueAtTime(850,context.currentTime+.16);gain.gain.setValueAtTime(.04,context.currentTime);gain.gain.exponentialRampToValueAtTime(.001,context.currentTime+.23);osc.connect(gain);gain.connect(context.destination);osc.start();osc.stop(context.currentTime+.24);osc.onended=()=>context.close()}catch(e){}}
let toastTimer;
function toast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2300)}
function confetti(){const canvas=document.getElementById('confetti'),ctx=canvas.getContext('2d');if(!ctx)return;const w=canvas.width=window.innerWidth,h=canvas.height=window.innerHeight,colors=['#ffba78','#a8e9c4','#b8b5fc','#f4ddd2'];let bits=Array.from({length:110},(_,i)=>({x:Math.random()*w,y:-40-Math.random()*h*.4,dx:(Math.random()-.5)*4,dy:2+Math.random()*3,rot:Math.random()*5,color:colors[i%colors.length],size:5+Math.random()*6}));let frames=0;function draw(){ctx.clearRect(0,0,w,h);for(let b of bits){b.x+=b.dx;b.y+=b.dy;b.rot+=.06;ctx.fillStyle=b.color;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);ctx.fillRect(0,0,b.size,b.size*.6);ctx.restore()}if(++frames<180)requestAnimationFrame(draw);else ctx.clearRect(0,0,w,h)}draw()}
function go(p){state.page=Math.max(-1,Math.min(p,EXERCISES.length));state.selectedCard=null;state.selectedMatch=null;render();window.scrollTo({top:0,behavior:'smooth'});play()}
function headerHero(){return `<section class="hero"><div class="eyebrow">Práctica interactiva · B1–B2</div><h1>Una noche de <em>terror</em></h1><p class="lead">¡Los hábitos del pasado han despertado! Completa 8 desafíos con corrección automática: perífrasis, pasados, conectores y una actividad para escribir sin alternativas.</p><div class="pillrow"><span class="pill">🧟 dejar de · volver a · seguir</span><span class="pill">⏳ imperfecto · indefinido · perfecto</span><span class="pill">🔗 conectores</span><span class="pill">🎮 6 tipos de ejercicios</span></div><button class="btn primary" data-action="go" data-page="0">Entrar al laboratorio <span>→</span></button><div class="features"><span>✓ 8 actividades</span><span>✓ ${totalItems} respuestas autocorregibles</span><span>✓ Unir, elegir, completar y escribir</span><span>✓ Avanzar y retroceder libremente</span></div></section>`}
function progressHeader(i){const ex=EXERCISES[i];return `<div class="workspace-header"><div class="workspace-crumb"><span class="crumb">✦ ${esc(ex.module)}</span><span class="counter">Actividad ${i+1} de ${EXERCISES.length} · ${checkedCount()} comprobadas</span></div><div class="bar" aria-label="Progreso"><span style="width:${Math.round(checkedCount()/EXERCISES.length*100)}%"></span></div></div><div class="module-nav">${MODULES.map(m=>`<button class="module-tab ${m.name===ex.module?'active':''}" data-action="go" data-page="${moduleIndices(m.name)[0]}">${m.short} <span class="s">${moduleIndices(m.name).filter(done).length}/5</span></button>`).join('')}</div>`}
function itemResult(i,k,ok,answer,why){if(!done(i))return '';return `<div class="result ${ok?'':'bad'}">${ok?'✓ ¡Correcto!':`✗ Respuesta correcta: <strong>${esc(answer)}</strong>`}${why?`<small>${esc(why)}</small>`:''}</div>`}
function renderChoice(ex,i,mode='choice'){const a=answered(i),check=done(i);return `<div class="items">${ex.items.map((it,k)=>{const opts=it.options||it.choices;const chosen=a[k],label=mode==='fix'?it.wrong:mode==='dialogue'?it.b:it.q;return `<div class="item"><div class="qhead"><span class="qnum">${k+1}</span><div class="question">${mode==='fix'?'Corrige la frase:':mode==='dialogue'?'Elige la respuesta:':''} ${mode==='choice'?esc(label):''}</div></div>${mode==='fix'?`<div class="wrong">✘ ${esc(it.wrong)}</div>`:''}${mode==='dialogue'?`<div class="dialog-a">${esc(it.a)}</div><div class="dialog-b">${esc(it.b)}</div>`:''}<div class="choices">${opts.map((opt,j)=>`<button type="button" class="option ${chosen===opt?'selected':''} ${check&&opt===chosen?(chosen===it.answer?'good':'bad'):''} ${check&&opt===it.answer?'good':''}" data-action="answer" data-item="${k}" data-choice="${j}" ${check?'disabled':''}>${esc(opt)}</button>`).join('')}</div>${itemResult(i,k,chosen===it.answer,it.answer,it.why)}</div>`}).join('')}</div>`}
function renderCloze(ex,i){const a=answered(i),check=done(i);return `<div class="items">${ex.items.map((it,k)=>`<div class="item"><div class="qhead"><span class="qnum">${k+1}</span><div class="question"><div class="fill"><span>${esc(it.before)}</span><select aria-label="Completa la oración ${k+1}" data-action="select" data-item="${k}" ${check?'disabled':''}><option value="">Elegir…</option>${it.options.map(opt=>`<option value="${attr(opt)}" ${a[k]===opt?'selected':''}>${esc(opt)}</option>`).join('')}</select><span>${esc(it.after)}</span></div></div></div>${itemResult(i,k,a[k]===it.answer,it.answer,it.why)}</div>`).join('')}</div>`}
function sortCard(ex,i,c){const a=answered(i),good=done(i)&&a[c.id]===c.bin,bad=done(i)&&a[c.id]!==c.bin;return `<button type="button" draggable="${!done(i)}" data-card="${attr(c.id)}" data-action="pick-card" class="sortcard ${state.selectedCard===c.id?'picked':''} ${good?'good':''} ${bad?'bad':''}"><span>${esc(c.text)}</span><span aria-hidden="true">⠿</span></button>`}
function renderWrite(ex,i){
 const a=answered(i);
 return `<div class="write-progress" aria-live="polite">🕯️ Oraciones comprobadas: <strong>${writeCheckedCount(i)} de ${ex.items.length}</strong></div><div class="items">${ex.items.map((it,k)=>{
  const checked=writeIsChecked(i,k),ok=writtenCorrect(it,a[k]);
  return `<div class="item"><div class="qhead"><span class="qnum">${k+1}</span><div class="question"><div class="fill"><span>${esc(it.before)}</span><input class="typed" data-action="type" data-item="${k}" type="text" aria-label="Respuesta ${k+1}; verbo ${esc(it.verb)}" placeholder="Escribe la forma verbal…" spellcheck="false" autocomplete="off" value="${attr(a[k]??'')}" ${checked?'disabled':''}/><span>${esc(it.after)}</span></div></div></div><div class="write-controls"><span class="verb-hint">Verbo: <strong>${esc(it.verb)}</strong></span>${!checked?`<button class="item-check" type="button" data-action="check-write" data-item="${k}">✓ Comprobar respuesta</button>`:`<button class="item-edit" type="button" data-action="edit-write" data-item="${k}">↻ Volver a intentar</button>`}</div>${checked?`<div class="result ${ok?'':'bad'}" role="status" aria-live="polite">${ok?'<strong>✓ ¡Respuesta correcta!</strong>':`<strong>✗ Esta respuesta necesita un cambio.</strong> La forma correcta es <strong>${esc(it.answer)}</strong>.`}<small><strong>Feedback:</strong> ${esc(it.why)}</small><div class="correct-sentence"><strong>Oración completa:</strong> ${esc(it.spanish)}</div><div class="english-translation"><span aria-hidden="true">🇬🇧</span> <strong>Traducción al inglés:</strong> ${esc(it.translation)}</div></div>`:''}</div>`;
 }).join('')}</div>`;
}
function renderSort(ex,i){const a=answered(i);return `<div class="sortlayout"><div class="bank" data-drop="bank"><strong>📚 Tarjetas sin colocar · selecciona o arrastra</strong>${ex.cards.filter(c=>!a[c.id]).map(c=>sortCard(ex,i,c)).join('')||'<span style="color:#89caaa;font-size:13px">¡Todas las tarjetas están colocadas!</span>'}</div><div class="bins">${ex.bins.map(b=>`<div class="bin" data-bin="${b.id}" tabindex="0" role="button" aria-label="Colocar tarjeta en ${esc(b.label)}"><div class="bin-title">${esc(b.label)}</div><div class="bin-sub">${esc(b.sub)}</div><div class="placed">${ex.cards.filter(c=>a[c.id]===b.id).map(c=>sortCard(ex,i,c)).join('')}</div></div>`).join('')}</div>${done(i)?`<div class="notification">${scoreEx(i)===totalFor(ex)?'✓ ¡Todas las tarjetas están en la lápida correcta!':`Resultado: ${scoreEx(i)} de ${totalFor(ex)} correctas. `} ${scoreEx(i)!==totalFor(ex)?'Revisa las soluciones indicadas aquí abajo:':''}</div>${scoreEx(i)!==totalFor(ex)?`<div class="result bad">${ex.cards.filter(c=>a[c.id]!==c.bin).map(c=>`${esc(c.text)} → ${esc(ex.bins.find(b=>b.id===c.bin).label)}`).join('<hr style="border:0;border-top:1px solid #916c7d">')}</div>`:''}`:''}</div>`}
function renderMatch(ex,i){const a=answered(i),check=done(i);return `<div class="matchwrap" id="matchwrap"><svg class="matchsvg" id="matchsvg" aria-hidden="true"></svg><div class="matchcol">${ex.pairs.map((p,k)=>`<button type="button" data-action="match-left" data-left="${k}" data-node="l${k}" class="matchbutton ${state.selectedMatch===k?'picked':''} ${a[k]!=null?'matched':''}" ${check?'disabled':''}><span class="n">${k+1}</span>${esc(p.left)}</button>`).join('')}</div><div class="matchcol">${ex.rightOrder.map((idx,pos)=>{const assigned=Object.keys(a).some(k=>a[k]===idx);return `<button type="button" data-action="match-right" data-right="${idx}" data-node="r${idx}" class="matchbutton ${assigned?'matched':''}" ${check?'disabled':''}><span class="n">${String.fromCharCode(65+pos)}</span>${esc(ex.pairs[idx].right)}</button>`}).join('')}</div></div><p class="matchhint">Primero elige una tarjeta de la izquierda y luego su pareja a la derecha. Vuelve a elegir para cambiarla.</p>${check?`<div class="result ${scoreEx(i)===totalFor(ex)?'':'bad'}">${scoreEx(i)} de ${totalFor(ex)} parejas correctas.${scoreEx(i)!==totalFor(ex)?`<small>${ex.pairs.map(p=>`${esc(p.left)} → ${esc(p.right)}`).join(' · ')}</small>`:''}</div>`:''}`}
function drawLines(){const ex=EXERCISES[state.page];if(!ex||ex.type!=='match')return;const wrapper=document.getElementById('matchwrap'),svg=document.getElementById('matchsvg');if(!wrapper||!svg)return;const rect=wrapper.getBoundingClientRect();if(!rect.width||!rect.height)return;svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);svg.innerHTML='';const a=answered(state.page);Object.entries(a).forEach(([left,right])=>{const l=wrapper.querySelector(`[data-node="l${left}"]`),r=wrapper.querySelector(`[data-node="r${right}"]`);if(!l||!r)return;const lr=l.getBoundingClientRect(),rr=r.getBoundingClientRect(),x1=lr.right-rect.left,y1=lr.top+lr.height/2-rect.top,x2=rr.left-rect.left,y2=rr.top+rr.height/2-rect.top;const wrong=done(state.page)&&Number(left)!==Number(right);svg.insertAdjacentHTML('beforeend',`<path d="M ${x1} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}" fill="none" stroke="${wrong?'#f59b9a':'#96d4b9'}" stroke-width="3.2" stroke-linecap="round" opacity=".9"/>`)});}
function shuffledOrder(n){return Array.from({length:n},(_,i)=>i).sort((a,b)=>((a*17+7)%n)-((b*17+7)%n)).reverse()}
function renderOrder(ex,i){const a=answered(i);return `<div class="items">${ex.items.map((it,k)=>{const used=a[k]||[],pool=shuffledOrder(it.tokens.length);return `<div class="item"><div class="qhead"><span class="qnum">${k+1}</span><div class="question">Reconstruye la oración ${k+1}</div></div><div class="orderblock"><div class="built">${used.map((tokenIndex,j)=>`<button class="chip inbuilt" data-action="remove-token" data-item="${k}" data-position="${j}" type="button" ${done(i)?'disabled':''}>${esc(it.tokens[tokenIndex])}</button>`).join('')}</div><div class="pool">${pool.filter(j=>!used.includes(j)).map(j=>`<button class="chip" data-action="add-token" data-item="${k}" data-token="${j}" type="button" ${done(i)?'disabled':''}>${esc(it.tokens[j])}</button>`).join('')}</div></div>${itemResult(i,k,JSON.stringify(used)===JSON.stringify(it.tokens.map((_,j)=>j)),it.tokens.join(' '),it.why)}</div>`}).join('')}</div>`}
function renderSequence(ex,i){const a=answered(i);if(!a.seq)a.seq=['c','a','e','b','d'];const seq=a.seq;return `<div class="sequence-list">${seq.map((id,k)=>{const step=ex.steps.find(x=>x.id===id);return `<div class="sequence-row" draggable="${!done(i)}" data-seq="${id}"><span class="sequence-number">${k+1}</span><span class="sequence-text">${esc(step.text)}</span><span class="seq-buttons"><button data-action="seq-up" data-pos="${k}" type="button" aria-label="Subir tarjeta" ${k===0||done(i)?'disabled':''}>↑</button><button data-action="seq-down" data-pos="${k}" type="button" aria-label="Bajar tarjeta" ${k===seq.length-1||done(i)?'disabled':''}>↓</button></span></div>`}).join('')}</div>${done(i)?`<div class="result ${scoreEx(i)===ex.steps.length?'':'bad'}">${scoreEx(i)===ex.steps.length?'✓ ¡Historia ordenada!':`Has colocado ${scoreEx(i)} de ${ex.steps.length} pasos en la posición correcta.`}${scoreEx(i)!==ex.steps.length?`<small>Orden correcto: ${ex.steps.map((s,j)=>`${j+1}. ${esc(s.text)}`).join(' → ')}</small>`:''}</div>`:''}`}
function bodyFor(ex,i){if(ex.type==='choice')return renderChoice(ex,i);if(ex.type==='fix')return renderChoice(ex,i,'fix');if(ex.type==='dialogue')return renderChoice(ex,i,'dialogue');if(ex.type==='cloze')return renderCloze(ex,i);if(ex.type==='write')return renderWrite(ex,i);if(ex.type==='sort')return renderSort(ex,i);if(ex.type==='match')return renderMatch(ex,i);if(ex.type==='order')return renderOrder(ex,i);if(ex.type==='sequence')return renderSequence(ex,i);return ''}
function renderExercise(i){const ex=EXERCISES[i],checked=done(i),correct=scoreEx(i),total=totalFor(ex);return `<section class="workspace">${progressHeader(i)}<div class="workspace-main"><div class="ex-title-row"><span class="ex-icon">${ex.icon}</span><div><div class="sectionlabel">${esc(ex.module)} · ${ex.type==='sort'?'Clasificar':ex.type==='match'?'Relacionar':ex.type==='order'?'Ordenar':ex.type==='sequence'?'Secuenciar':ex.type==='cloze'?'Completar':ex.type==='write'?'Escribir sin alternativas':ex.type==='dialogue'?'Diálogos':ex.type==='fix'?'Corrección':'Selección múltiple'}</div><h2 class="ex-title">${esc(ex.title)}</h2><p class="ex-subtitle">${esc(ex.subtitle)}</p></div></div>${bodyFor(ex,i)}<div class="notification ${checked?'':'hidden'}">${checked?`${correct===total?'🎉 ¡Perfecto!':'🕵️ Revisa tus respuestas.'} ${correct} de ${total} respuestas correctas.`:''}</div></div><div class="workspace-footer"><div class="footer-left"><button class="btn secondary" data-action="go" data-page="${i-1}" type="button">← Anterior</button><button class="btn ghostbtn" data-action="go" data-page="-1" type="button">⌂ Inicio</button></div><div class="footer-right">${!checked?`<button class="btn mintbtn" data-action="check" type="button">${ex.type==='write'?'✓ Comprobar todas':'✓ Comprobar'}</button>`:`<button class="btn secondary" data-action="retry" type="button">↻ Reintentar</button>`}<button class="btn primary" data-action="go" data-page="${i+1}" type="button">Siguiente →</button></div></div></section><div class="module-map" aria-label="Mapa de ejercicios">${MODULES.map(m=>`<div class="map-col"><span class="map-label">${esc(m.short)}</span>${moduleIndices(m.name).map(j=>`<button type="button" class="map-dot ${done(j)?'done':''} ${i===j?'active':''}" data-action="go" data-page="${j}" title="Ir a ${esc(EXERCISES[j].title)}">${done(j)?'✓ ':''}${j+1}</button>`).join('')}</div>`).join('')}</div>`}
function renderSummary(){const t=checkedCount(),s=totalScore(),pct=Math.round(s/totalItems*100);return `<section class="workspace"><div class="summary"><div style="font-size:67px">${t===EXERCISES.length&&pct>=85?'🏆':'🌙'}</div><div class="eyebrow">El amanecer del cementerio</div><h2>Tu informe final</h2><div class="summary-score">${s} / ${totalItems}</div><p>Has comprobado <strong>${t} de ${EXERCISES.length} actividades</strong>. ${t<EXERCISES.length?'Puedes volver a las actividades pendientes para terminar el recorrido.':pct>=85?'¡Gran dominio de las perífrasis, los conectores y los pasados!':'Revisa las respuestas y vuelve a intentarlo para mejorar.'}</p><div class="breakdown">${MODULES.map(m=>{const inds=moduleIndices(m.name),sc=inds.reduce((n,j)=>n+scoreEx(j),0),ttl=inds.reduce((n,j)=>n+totalFor(EXERCISES[j]),0);return `<div class="metric"><b>${sc}/${ttl}</b><span>${esc(m.short)}</span></div>`}).join('')}</div><div class="summary-actions"><button class="btn secondary" data-action="go" data-page="${EXERCISES.length-1}">← Volver al último reto</button><button class="btn primary" data-action="go" data-page="0">Repasar ejercicios →</button><button class="btn ghostbtn" data-action="reset">↻ Empezar de nuevo</button></div></div></section>`}
function render(){app.innerHTML=state.page===-1?headerHero():state.page===EXERCISES.length?renderSummary():renderExercise(state.page);if(state.page>=0&&state.page<EXERCISES.length&&EXERCISES[state.page].type==='match')requestAnimationFrame(drawLines);document.getElementById('sound').textContent=state.muted?'🔇 Sonido':'🔊 Sonido'}
function rerender(){const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'})}
function handleAction(btn){const action=btn.dataset.action,i=state.page,e=EXERCISES[i],a=i>=0&&i<EXERCISES.length?answered(i):null;if(action==='go'){go(Number(btn.dataset.page));return}
 if(action==='reset'){state.page=-1;state.answers={};state.checked={};state.writeChecked={};go(-1);toast('Progreso reiniciado');return}
 if(!e)return;
 if(action==='check-write'&&e.type==='write'){
  const k=Number(btn.dataset.item);
  if(writeIsChecked(i,k))return;
  if(!String(a[k]??'').trim()){toast('Escribe primero la forma verbal.');return}
  if(!state.writeChecked[i])state.writeChecked[i]={};
  state.writeChecked[i][k]=true;
  if(writeCheckedCount(i)===e.items.length){
    state.checked[i]=true;
    if(scoreEx(i)===e.items.length)confetti();
  }
  rerender();play(writtenCorrect(e.items[k],a[k])?'ok':'bad');
  return;
 }
 if(action==='edit-write'&&e.type==='write'){
  const k=Number(btn.dataset.item);
  if(state.writeChecked[i])delete state.writeChecked[i][k];
  delete state.checked[i];
  a[k]='';
  rerender();
  const input=app.querySelector(`[data-action="type"][data-item="${k}"]`);
  if(input)input.focus();
  return;
 }
 if(action==='answer'&&!done(i)){const item=Number(btn.dataset.item),choice=Number(btn.dataset.choice);a[item]=(e.items[item].options||e.items[item].choices)[choice];rerender();play();return}
 if(action==='pick-card'&&!done(i)){const cid=btn.dataset.card;if(state.selectedCard===cid){state.selectedCard=null}else{state.selectedCard=cid}rerender();play();return}
 if(action==='match-left'&&!done(i)){state.selectedMatch=Number(btn.dataset.left);rerender();play();return}
 if(action==='match-right'&&!done(i)){if(state.selectedMatch==null){toast('Elige primero una tarjeta de la izquierda.');return}const to=Number(btn.dataset.right);for(let key of Object.keys(a)){if(a[key]===to)delete a[key]}a[state.selectedMatch]=to;state.selectedMatch=null;rerender();play();return}
 if(action==='add-token'&&!done(i)){const item=Number(btn.dataset.item),tok=Number(btn.dataset.token);if(!a[item])a[item]=[];if(!a[item].includes(tok))a[item].push(tok);rerender();play();return}
 if(action==='remove-token'&&!done(i)){const item=Number(btn.dataset.item),pos=Number(btn.dataset.position);a[item].splice(pos,1);rerender();play();return}
 if((action==='seq-up'||action==='seq-down')&&!done(i)){if(!a.seq)a.seq=['c','a','e','b','d'];const k=Number(btn.dataset.pos),target=k+(action==='seq-up'?-1:1);[a.seq[k],a.seq[target]]=[a.seq[target],a.seq[k]];rerender();play();return}
 if(action==='check'){if(e.type==='write'){state.writeChecked[i]={};e.items.forEach((_,k)=>state.writeChecked[i][k]=true)}state.checked[i]=true;state.selectedCard=null;state.selectedMatch=null;const correct=scoreEx(i),total=totalFor(e);rerender();if(correct===total){play('ok');confetti();toast('¡Perfecto! Todas las respuestas correctas 🎉')}else{play('bad');toast(`${correct} de ${total} correctas. ¡Puedes reintentarlo!`)}return}
 if(action==='retry'){delete state.checked[i];delete state.writeChecked[i];state.answers[i]={};state.selectedCard=null;state.selectedMatch=null;rerender();toast('¡Inténtalo otra vez!');return}}
app.addEventListener('click',ev=>{const action=ev.target.closest('[data-action]');if(action){handleAction(action);return}const bin=ev.target.closest('[data-bin]');if(bin&&state.page>=0&&!done(state.page)&&state.selectedCard){answered(state.page)[state.selectedCard]=bin.dataset.bin;state.selectedCard=null;rerender();play();return}});
app.addEventListener('input',ev=>{const field=ev.target.closest('[data-action="type"]');if(field&&state.page>=0&&!done(state.page)){answered(state.page)[Number(field.dataset.item)]=field.value}});
app.addEventListener('change',ev=>{const sel=ev.target.closest('[data-action="select"]');if(sel){answered(state.page)[sel.dataset.item]=sel.value;play();}});
let dragged=null;
app.addEventListener('dragstart',ev=>{const card=ev.target.closest('[data-card]'),seq=ev.target.closest('[data-seq]');if(!card&&!seq||state.page<0||done(state.page))return;dragged=card?{type:'card',id:card.dataset.card}:{type:'seq',id:seq.dataset.seq};ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',dragged.id)});
app.addEventListener('dragover',ev=>{if(!dragged)return;const target=ev.target.closest('[data-bin],[data-drop],[data-seq]');if(!target)return;ev.preventDefault();ev.dataTransfer.dropEffect='move';if(target.hasAttribute('data-bin'))target.classList.add('dragover')});
app.addEventListener('dragleave',ev=>{const target=ev.target.closest('[data-bin]');if(target)target.classList.remove('dragover')});
app.addEventListener('drop',ev=>{if(!dragged)return;ev.preventDefault();if(dragged.type==='card'){const to=ev.target.closest('[data-bin],[data-drop]');if(to){if(to.dataset.bin)answered(state.page)[dragged.id]=to.dataset.bin;else delete answered(state.page)[dragged.id];dragged=null;rerender();play()}}else if(dragged.type==='seq'){const to=ev.target.closest('[data-seq]');if(to){const a=answered(state.page),from=a.seq.indexOf(dragged.id),target=a.seq.indexOf(to.dataset.seq);const item=a.seq.splice(from,1)[0];a.seq.splice(target,0,item);dragged=null;rerender();play()}}});
app.addEventListener('dragend',()=>{dragged=null;document.querySelectorAll('.dragover').forEach(n=>n.classList.remove('dragover'))});
app.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[data-bin]')){ev.preventDefault();if(state.selectedCard&&!done(state.page)){answered(state.page)[state.selectedCard]=ev.target.dataset.bin;state.selectedCard=null;rerender();play()}}});
document.getElementById('sound').addEventListener('click',()=>{state.muted=!state.muted;render();if(!state.muted)play('ok')});
document.getElementById('home').addEventListener('click',()=>go(-1));
window.addEventListener('resize',()=>{if(state.page>=0&&state.page<EXERCISES.length&&EXERCISES[state.page].type==='match')drawLines()});
document.addEventListener('keydown',ev=>{if(ev.target.matches('input,textarea,select,button,[role="button"]'))return;if(ev.key==='ArrowRight'){go(state.page+1)}else if(ev.key==='ArrowLeft'&&state.page>=0){go(state.page-1)}});
render();
</script></body></html>
