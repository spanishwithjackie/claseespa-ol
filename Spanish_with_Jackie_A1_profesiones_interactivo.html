/* Nacionalidades: infografía interactiva en el estilo de Spanish with Jackie */
.nation-headline{text-align:center;background:linear-gradient(110deg,#f3eafa,#faf5ff);border:1px solid #ead9f9;border-radius:20px;padding:19px 18px;margin-bottom:17px}
.nation-headline h3{font-family:'Outfit',system-ui,sans-serif;font-size:clamp(1.55rem,2.4vw,2.35rem);color:#40205f;margin:0 0 7px;line-height:1.18}
.nation-headline p{font-size:1rem;color:#655675;margin:0}
.nation-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}
.nation-panel{padding:14px 13px 15px;border-radius:21px;border:1px solid #e9def2;background:#fff;min-width:0}
.nation-panel.rose{background:#fff3fa;border-color:#f5d6e9;--n-strong:#af3f7d;--n-soft:#f5d3e6;--n-m:#3f87ce;--n-f:#d4438e}
.nation-panel.mint{background:#edfaf8;border-color:#c9ede8;--n-strong:#0c7777;--n-soft:#bfe8e2;--n-m:#3f87ce;--n-f:#d4438e}
.nation-panel.lilac{background:#f5f0ff;border-color:#e1d4fa;--n-strong:#704bb3;--n-soft:#e1d3fa;--n-m:#3f87ce;--n-f:#d4438e}
.nation-panel-title{border-radius:13px;color:#fff;background:var(--n-strong);font-family:'Outfit',system-ui,sans-serif;font-size:clamp(1.15rem,1.6vw,1.62rem);font-weight:800;line-height:1.12;padding:14px 10px;text-align:center}
.nation-rule-explain{min-height:56px;font-size:.88rem;color:#50475d;line-height:1.38;text-align:center;margin:10px 2px 13px}
.nation-rule-explain b{color:var(--n-strong)}
.nation-rows{display:flex;flex-direction:column;gap:8px}
.nation-row{background:#fff;border:1px solid #e9e3f2;border-radius:13px;padding:10px 10px 9px;min-width:0}
.nation-row-main{display:flex;align-items:center;gap:8px}
.nation-flag{font-size:1.35rem;line-height:1.2;flex:none}
.nation-name{font-weight:750;color:#312a42;min-width:0;word-break:break-word;font-size:clamp(.93rem,1.3vw,1.12rem);line-height:1.3}
.nation-ending-m{color:var(--n-m);background:#e1efff;border-radius:4px;padding:0 2px}
.nation-ending-f{color:var(--n-f);background:#ffe2f1;border-radius:4px;padding:0 2px}
.nation-show{display:block;width:100%;background:#faf8ff;border:1px solid #e2d8f3;color:var(--n-strong);font-size:.8rem;font-weight:750;border-radius:9px;margin-top:9px;padding:8px 6px;cursor:pointer;text-align:center}
.nation-show:hover,.nation-show:focus-visible{background:#eee7fd;outline-color:#9b71d7}
.nation-answer{display:none;border-top:1px solid #ece7f1;margin-top:9px;padding-top:9px;font-size:.9rem}
.nation-row.revealed .nation-answer{display:block}
.nation-arrow{color:#957ea5;padding:0 4px}
.nation-answer .translate-line{font-size:.77rem;margin-top:6px}
.nation-advice{margin-top:12px;font-size:.83rem;line-height:1.45;background:#fff9e9;border:1px solid #f4e6bf;border-radius:11px;padding:11px}
.nation-practice{margin-top:18px;background:#fcfaff;border:1px solid #e7ddf5;border-radius:18px;padding:19px}
.nation-practice h3{font-family:'Outfit',system-ui,sans-serif;font-size:1.35rem;margin:0 0 8px}
.nation-practice .choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.nation-practice .choice{min-width:0}
.nation-note{font-size:.83rem;color:#6b6178;margin-top:12px}
@media(max-width:950px){.nation-grid{grid-template-columns:1fr}.nation-rule-explain{min-height:0}.nation-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.nation-panel-title{font-size:1.5rem}}
@media(max-width:610px){.nation-rows{grid-template-columns:1fr}.nation-practice .choices{grid-template-columns:1fr}.nation-headline{padding:15px}.nation-row-main{gap:7px}}


/* Nacionalidades e idiomas: páginas 10–14 del material de referencia */
.lang-intro-note{background:#f8f2ff;border:1px solid #e7d8f6;border-radius:16px;padding:14px 16px;margin-bottom:16px;color:#5d4b6c}
.lang-greeting-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}
.lang-greeting{border:1px solid #e6d9f2;border-radius:16px;background:white;padding:13px 8px 12px;text-align:center;display:flex;flex-direction:column;gap:8px;justify-content:flex-start;min-width:0}
.lang-greeting .speech{min-height:62px;display:flex;align-items:center;justify-content:center;border-radius:13px;background:#f3eafa;color:#4e2b7d;font-family:'Outfit',system-ui,sans-serif;font-size:clamp(1.15rem,1.65vw,1.7rem);font-weight:800;word-break:break-word;padding:8px 5px}
.lang-greeting .lang-revealed{margin-top:4px;padding:9px 5px;background:#f2faf5;border-radius:12px;font-size:.9rem;color:#275f50;font-weight:700}
.lang-greeting .lang-revealed .en{font-size:.83rem;color:#516e66;font-weight:400}
.lang-rule-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.lang-rule-card{border:1px solid #e8d8f3;border-radius:20px;padding:17px;background:#fdf9ff;min-width:0}
.lang-rule-card:nth-child(2){background:#effbf9;border-color:#cae7e1}
.lang-rule-card:nth-child(3){background:#fff7f1;border-color:#f2dcc8}
.lang-rule-card .flag{font-size:2rem}.lang-rule-card h3{font-size:1.23rem;margin:8px 0 12px}
.lang-rule-sample{padding:11px 12px;border-radius:12px;background:white;border:1px solid #e9e3ef;margin-bottom:10px;font-size:1rem}
.lang-rule-sample b{color:#7649b1}
.lang-practice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.lang-person-card{min-width:0;border-radius:19px;border:1px solid #e4d8ef;background:#fff;padding:11px}
.lang-person-card .lang-person-photo{display:block;width:100%;height:185px;object-fit:cover;object-position:center;border-radius:14px;background:#eee4fc}
.lang-person-card .lang-person-head{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:12px 2px 10px}
.lang-person-head h3{font-size:1.25rem;margin:0}.lang-person-head .flag{font-size:1.4rem}
.lang-person-card .lang-question{font-size:.89rem;color:#5d5269;line-height:1.4;margin:0 0 12px}
.lang-person-card textarea{display:block;width:100%;resize:vertical;min-height:105px;padding:12px;border:2px solid #e2d3f6;border-radius:12px;font-family:'DM Sans',system-ui,sans-serif;font-size:1rem;color:#29213c;line-height:1.45;background:#fff}
.lang-person-card textarea:focus-visible{outline:3px solid #b996e6;outline-offset:1px}
.lang-person-card .lang-answer{margin-top:13px;border-radius:12px;background:#f3f9f5;border:1px solid #d4eade;padding:12px 11px}
.lang-person-card .lang-answer .es{font-weight:700;color:#285b45;line-height:1.55;font-size:.95rem}
.lang-person-card .lang-answer .en{margin-top:7px;line-height:1.45;color:#567a6a;font-size:.86rem;font-style:italic}
.lang-reveal-counter{font-size:.84rem;color:#685475;margin:12px 0 0;font-weight:700}
@media(max-width:980px){.lang-greeting-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.lang-rule-grid,.lang-practice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.lang-greeting-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lang-rule-grid,.lang-practice-grid{grid-template-columns:1fr}.lang-person-card .lang-person-photo{height:205px}.lang-greeting .speech{min-height:48px}}


/* Nacionalidad masculina = nombre del idioma: exploración interactiva */
.lang-intro-feature{padding:20px 22px}
.lang-highlight{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin:15px 0 11px;font-family:'Outfit',sans-serif;font-size:clamp(1.1rem,2.1vw,1.5rem);color:#382755}
.lang-highlight strong{background:#fff;border:1px solid #e5d7fa;padding:12px 15px;border-radius:14px;font-weight:700}
.lang-equals{font-size:1.6rem;color:#8b63cf}
.lang-pair-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.lang-pair-card{border:1px solid #e5d8f3;background:#fff;border-radius:20px;padding:17px;min-width:0;box-shadow:0 8px 24px rgba(97,61,136,.04)}
.lang-pair-flag{font-size:2.3rem;margin-bottom:8px}
.lang-pair-title{font-size:1.1rem;font-family:'Outfit',sans-serif;font-weight:700;min-height:55px}
.lang-pair-card label{display:block;font-size:.92rem;color:#5c4776;font-weight:700;margin:10px 0 7px}
.lang-pair-card input{width:100%;background:#fff;border:2px solid #e6d8f4;border-radius:12px;min-height:43px;padding:10px;font:inherit;color:#342544}
.lang-pair-card input:focus{outline:2px solid #ad8bdb;outline-offset:1px}
.lang-pair-answer{margin-top:12px;background:#f1f9f3;border:1px solid #cde7d3;padding:12px;border-radius:12px;line-height:1.5;font-size:.94rem}
.lang-pair-answer .en{color:#55715f;font-size:.86rem;margin-top:4px}
@media(max-width:1000px){.lang-pair-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.lang-pair-grid{grid-template-columns:1fr}.lang-pair-title{min-height:0}.lang-highlight{gap:7px}.lang-highlight strong{padding:9px}}

/* Género de profesiones: explicación en tres columnas, editable y accesible */
.job-gender-head{text-align:center;background:linear-gradient(110deg,#f7ecfc,#fff7fd);border:1px solid #e9d8f5;border-radius:20px;padding:19px 18px;margin-bottom:17px}
.job-gender-head h3{font-family:'Outfit',system-ui,sans-serif;color:#472164;font-size:clamp(1.5rem,2.5vw,2.15rem);line-height:1.2;margin:0 0 7px}
.job-gender-head p{font-size:1rem;margin:0;color:#685873}
.job-gender-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.job-gender-card{border-radius:20px;padding:14px;min-width:0;border:1px solid #eaddef}
.job-gender-card.rose{background:#fff0f8;border-color:#f2d1e5;--jg-main:#ba437f;--jg-soft:#fff7fc}
.job-gender-card.mint{background:#ecfaf8;border-color:#c5e9e7;--jg-main:#087b79;--jg-soft:#f6fdfb}
.job-gender-card.lilac{background:#f3efff;border-color:#ddcff6;--jg-main:#7751b6;--jg-soft:#fdfbff}
.job-gender-title{font-family:'Outfit',system-ui,sans-serif;border-radius:13px;background:var(--jg-main);color:#fff;padding:13px 8px;text-align:center;font-size:clamp(1.18rem,1.6vw,1.5rem);font-weight:800;line-height:1.2}
.job-gender-explain{color:#51475c;font-size:.88rem;line-height:1.45;text-align:center;min-height:68px;margin:12px 2px}
.job-gender-explain strong{color:var(--jg-main)}
.job-gender-examples{display:flex;flex-direction:column;gap:8px}
.job-gender-row{background:#fff;border:1px solid #ebe4f1;border-radius:13px;padding:10px;min-width:0}
.job-gender-base{display:flex;align-items:center;gap:8px}
.job-gender-emoji{font-size:1.6rem;flex:none;line-height:1.25}
.job-gender-male{font-weight:800;color:#2f273e;font-size:clamp(.98rem,1.3vw,1.13rem);min-width:0;overflow-wrap:anywhere}
.job-gender-end-m{color:#2c72ba;background:#e2efff;border-radius:4px;padding:1px 3px}
.job-gender-end-f{color:#b72e87;background:#ffe5f2;border-radius:4px;padding:1px 3px}
.job-gender-reveal{display:block;width:100%;margin-top:9px;padding:9px 7px;background:var(--jg-soft);border:1px solid #e5d9ed;border-radius:9px;color:var(--jg-main);font-size:.84rem;font-weight:800;cursor:pointer}
.job-gender-reveal:hover,.job-gender-reveal:focus-visible{background:#f0e7fa;outline-offset:2px}
.job-gender-result{border-top:1px solid #ece4f1;padding-top:9px;margin-top:10px;display:none;font-size:.9rem}
.job-gender-row.revealed .job-gender-result{display:block}
.job-gender-result strong{color:#372442;line-height:1.45}
.job-gender-result .translate-line{font-size:.82rem;margin-top:6px}
.job-gender-insight{margin-top:12px;padding:12px;border:1px solid #efe0bc;background:#fff9ec;border-radius:12px;font-size:.87rem;color:#5c4e35;line-height:1.5}
.job-gender-practice{margin-top:18px;padding:18px;background:#fcfaff;border:1px solid #e7dcf5;border-radius:18px}
.job-gender-practice h3{font-family:'Outfit',system-ui,sans-serif;font-size:1.3rem;margin:0 0 10px}
.job-gender-quiz + .job-gender-quiz{border-top:1px solid #e9e0f0;margin-top:20px;padding-top:16px}
.job-gender-note{margin-top:12px;color:#6b6176;font-size:.86rem;line-height:1.45}
@media(max-width:950px){.job-gender-grid{grid-template-columns:1fr}.job-gender-explain{min-height:0}.job-gender-examples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:610px){.job-gender-examples{grid-template-columns:1fr}.job-gender-head{padding:14px}.job-gender-card{padding:12px}}

const img=(key,cls='photo',alt='Imagen de apoyo de la lección')=>`<img src="${IMAGES[key]||IMAGES.hero}" class="${cls}" alt="${escapeAttr(alt)}" loading="lazy">`;
const escapeHtml=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escapeAttr=escapeHtml;
const T=(es,en,cls='')=>`<button type="button" class="translate-line ${cls}" aria-label="Ver traducción de: ${escapeAttr(es)}" onclick="App.translation(this)"><span><span class="es">${escapeHtml(es)}</span><span class="translate-help">EN ▾</span></span><span class="english">${escapeHtml(en)}</span></button>`;
const listen=(text)=>``;
const C=(text)=>`<span class="ser">${text}</span>`;
const E=(text)=>`<span class="estar">${text}</span>`;
const card=(key,title,en='',extra='')=>`<div class="picture-card">${img(key,'',title)}<p>${title}</p>${en?T(title,en,'tiny'):''}${extra}</div>`;
const options=(name,vals,correctIndex)=>`<div class="choices">${vals.map((v,i)=>`<button class="choice" onclick="App.pickLesson('${name}',${i},${correctIndex},this)" data-item="${i}"><span class="option-letter">${'ABC'[i]||i+1}</span>${escapeHtml(v)}</button>`).join('')}</div><div id="feedback-${name}" class="feedback" style="display:none"></div>`;

function beep(){if(!S.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=new AC();[0,0.11,0.24].forEach((t,i)=>{let o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime([660,830,990][i],c.currentTime+t);g.gain.setValueAtTime(.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.07,c.currentTime+t+.012);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.13);o.connect(g);g.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.15)});setTimeout(()=>c.close(),700)}catch(e){}}
function confetti(){let box=document.getElementById('confettiLayer');box.innerHTML='';for(let i=0;i<65;i++){let p=document.createElement('span');p.className='confetti';p.style.left=(Math.random()*100)+'%';p.style.background=['#a77add','#e8a95d','#7cc6a2','#eb9cbb','#91aee4'][i%5];p.style.animationDelay=(Math.random()*.35)+'s';p.style.setProperty('--shift',(-160+Math.random()*320)+'px');p.style.transform=`rotate(${Math.random()*360}deg)`;box.appendChild(p)}setTimeout(()=>box.innerHTML='',2100)}

function extraAdjSection(){let open=!!S.micro.moreAdj;let items=[['tranquilo / tranquila','calm'],['relajado / relajada','relaxed'],['emocionado / emocionada','excited'],['preocupado / preocupada','worried'],['aburrido / aburrida','bored'],['enfermo / enferma','sick'],['estresado / estresada','stressed'],['confundido / confundida','confused'],['bien','well'],['mal','bad']];return `<div class="inner" style="margin-top:16px"><button class="btn white small" onclick="App.toggleAdj()">${open?'− Ocultar adjetivos':'＋ Más adjetivos'}</button>${open?`<div style="margin-top:14px"><p class="caption" style="margin-bottom:10px">Más opciones para responder a <strong>¿Cómo estás?</strong>. Haz clic en EN para ver la traducción.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">${items.map(([es,en])=>`<div class="inner" style="padding:10px 12px">${T(es,en)}</div>`).join('')}</div></div>`:''}</div>`}

function jobGenderRow(item,kind){
 const open=!!S.jobGenderShown?.[item.id];
 const unchanged=kind==='lilac';
 const maleMarkup=unchanged?escapeHtml(item.male):`${escapeHtml(item.stem)}${item.m?`<span class="job-gender-end-m">${escapeHtml(item.m)}</span>`:''}`;
 const femaleMarkup=unchanged?escapeHtml(item.female):`${escapeHtml(item.stem)}<span class="job-gender-end-f">${escapeHtml(item.f)}</span>`;
 const left=unchanged?`el ${item.male}`:`${item.male}`;
 const right=unchanged?`la ${item.female}`:`${item.female}`;
 return `<div class="job-gender-row ${open?'revealed':''}"><div class="job-gender-base"><span class="job-gender-emoji" aria-hidden="true">${item.icon}</span><span class="job-gender-male">${unchanged?'el ':''}${maleMarkup}</span></div><button type="button" class="job-gender-reveal" aria-expanded="${open?'true':'false'}" onclick="App.toggleJobGender('${item.id}',this)">${open?'− Ocultar respuesta':'+ Descubrir femenino'}</button><div class="job-gender-result"><strong>${unchanged?'el ':'Él es '}${maleMarkup} <span class="nation-arrow">/</span> ${unchanged?'la ':'Ella es '}${femaleMarkup}</strong><div>${unchanged?T(`El ${item.male}. La ${item.female}.`,`The male ${item.en}. The female ${item.en}.`):T(`Él es ${item.male}. Ella es ${item.female}.`,`He is a ${item.en}. She is a ${item.en}.`)}</div></div></div>`;
}
function jobGenderRulesHTML(){return `<div class="job-gender-head"><h3>💼 Cambio de género en la profesión</h3><p>Observa la forma masculina, piensa cómo sería la femenina y toca para descubrirla.</p></div><div class="job-gender-grid">${JOB_GENDER_GROUPS.map(g=>`<section class="job-gender-card ${g.kind}"><div class="job-gender-title">${g.title}</div><div class="job-gender-explain">${g.intro}</div><div class="job-gender-examples">${g.items.map(x=>jobGenderRow(x,g.kind)).join('')}</div>${g.kind==='mint'?'<div class="job-gender-insight">💡 <strong>profesor → profesora</strong> y <strong>juez → jueza</strong>. No todas las palabras terminadas en consonante siguen esta regla.</div>':g.kind==='lilac'?'<div class="job-gender-insight">💡 La palabra <strong>periodista</strong> no cambia: <strong>el periodista / la periodista</strong>. Con SER decimos: <strong>Ella es periodista</strong>, normalmente sin artículo.</div>':''}</section>`).join('')}</div><div class="job-gender-practice"><h3>🎯 Practica: descubre la regla</h3><div class="job-gender-quiz"><p>${T('Ella trabaja en un tribunal. ¿Cómo se dice su profesión?','She works in a courtroom. What is the feminine form of her profession?')}</p>${renderOptions('jg-jueza',['Ella es juez.','Ella es jueza.','Ella es juezo.'],1,'Ella es jueza.','She is a judge.','Juez añade -a en femenino: jueza.')}</div><div class="job-gender-quiz"><p>${T('¿Cuál es la forma correcta para una mujer que trabaja como dentista?','What is the correct term for a woman who works as a dentist?')}</p>${renderOptions('jg-dentista',['Ella es dentista.','Ella es dentistesa.','Ella es dentisto.'],0,'Ella es dentista.','She is a dentist.','Dentista no cambia; solo el artículo cambia: el/la dentista.')}</div><div class="job-gender-quiz"><p>${T('¿Qué puedes decir sobre tu profesión?','What can you say about your profession?')}</p><p class="muted">Ahora responde oralmente: <strong>¿A qué te dedicas?</strong></p></div></div><div class="job-gender-note">Estos son patrones frecuentes, no reglas para todas las profesiones. Para hablar de una profesión, normalmente decimos «Soy abogado» o «Ella es periodista» sin un/una.</div>`}

function jobsFlipHTML(){let j=CARD_JOBS[S.flip],imgTag=img(j.image,'flip-card-image',j.job);return `<div class="split wide-left"><div><div class="mini-progress"><span class="chip">Tarjeta ${S.flip+1} de ${CARD_JOBS.length}</span><span class="tiny muted">Haz clic para voltear ↺</span></div><div class="flip-outer ${S.flipped?'flipped':''}" role="button" tabindex="0" aria-label="Voltear tarjeta de profesión" onclick="App.flip()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.flip()}"><div class="flip-inner"><div class="flip-face"><div class="flip-icon">${j.ico}</div><span class="up">¿QUÉ PROFESIÓN ES?</span><h3>${j.desc}</h3><span class="flipprompt">Toca para descubrir la profesión</span></div><div class="flip-face back">${imgTag}<h3>${j.job}</h3><span class="subtitle-english">${j.eng}</span><span class="chip green">${j.rule}</span><span class="flipprompt">Toca para volver</span></div></div></div><div class="button-row" style="margin-top:14px"><button class="btn white small" onclick="App.flipStep(-1)" ${S.flip===0?'disabled':''}>← Anterior</button><button class="btn secondary small" onclick="App.flipStep(1)" ${S.flip===CARD_JOBS.length-1?'disabled':''}>Siguiente →</button></div></div><div class="inner"><span class="up">COMPRENSIÓN + PRODUCCIÓN</span><h3>Lee, imagina y responde</h3><p class="muted">Intenta adivinar antes de voltear la tarjeta.</p>${T(j.desc,j.deng,'bigspeech')}<div style="margin-top:20px" class="notice">💡 Algunas profesiones terminan en <b>-ista</b> y no cambian: el/la artista, el/la dentista, el/la periodista.</div></div></div>`}
function dialogueBubbles(arr,hidden=false){return `<div class="dialogue ${arr.length>5?'compact':''}">${arr.map((b,i)=>`<div class="bubble ${b[0]==='Estudiante'?'student':''}"><div class="who">${b[0]}</div>${hidden&&b[0]==='Estudiante'?`<button class="reveal" onclick="App.reveal(this,'${escapeAttr(b[1])}','${escapeAttr(b[2])}')">Toca para mostrar mi respuesta ▾</button>`:`<p>${T(b[1],b[2])}</p>`}</div>`).join('')}</div>`}

function languageRuleHTML(){return `<div class="lang-intro-note">${T('Cuando una nacionalidad tiene masculino y femenino, el idioma mantiene la forma masculina en estos ejemplos: inglés / inglesa → habla inglés.','When a nationality has masculine and feminine forms, the language keeps the masculine form in these examples: inglés / inglesa → habla inglés.')}</div><div class="lang-rule-grid">${[['🇩🇪','alemán / alemana','Él es alemán.','Ella es alemana.','Habla alemán.','He is German.','She is German.','Speaks German.'],['🇫🇷','francés / francesa','Él es francés.','Ella es francesa.','Habla francés.','He is French.','She is French.','Speaks French.'],['🇬🇧','inglés / inglesa','Él es inglés.','Ella es inglesa.','Habla inglés.','He is English.','She is English.','Speaks English.']].map(([flag,title,m,f,lang,em,ef,el])=>`<div class="lang-rule-card"><div class="flag">${flag}</div><h3>${escapeHtml(title)}</h3><div class="lang-rule-sample">${T(m,em)}</div><div class="lang-rule-sample">${T(f,ef)}</div><div class="lang-rule-sample"><strong>🗣️ ${escapeHtml(lang)}</strong><p class="caption" style="margin-top:5px">${escapeHtml(el)}</p></div></div>`).join('')}</div><div class="inner" style="margin-top:16px"><h3>Comprueba lo aprendido</h3><p>Ella es alemana. ¿Qué idioma habla?</p>${renderOptions('idioma-aleman',['alemana','alemán','alemano'],1,'Ella habla alemán.','She speaks German.','El nombre del idioma se mantiene en masculino singular: alemán.')}</div><div class="notice" style="margin-top:15px">💡 <b>Habla</b> = <i>speaks</i>. No todas las nacionalidades indican automáticamente un idioma: ${T('Sarah es estadounidense. Habla inglés.','Sarah is American. She speaks English.')}</div>`}

function slideBody(s,i){switch(s.type){

function exCount(block){return EXS.filter((q,i)=>q.block===block&&S.solved[i]).length}
function renderExMenu(){let total=Object.keys(S.solved).filter(k=>S.solved[k]).length;document.getElementById('app').innerHTML=`<section class="card exmenu"><div class="exmenu-head"><span class="chip">🧩 PRÁCTICA AUTÓNOMA</span><h2 style="margin-top:14px">¡Vamos a practicar!</h2><p class="muted">20 ejercicios de diferentes tipos, con pistas, corrección inmediata y traducciones al inglés después de acertar.</p><div class="progressbar" style="max-width:440px;margin:15px auto 8px"><div style="width:${total/20*100}%"></div></div><strong class="tiny">${total} de 20 completados</strong></div><div class="exmenu-grid">${EX_BLOCKS.map((b,i)=>`<button class="block-card" onclick="App.exStart(${b.start})"><span class="block-emoji">${b.icon}</span><span style="flex:1"><strong>${i+1}. ${b.title}</strong><span class="sub">${b.sub}</span></span><span class="count">${exCount(i)} / ${b.end-b.start}</span></button>`).join('')}</div><div class="notice" style="margin-top:15px">🖼️ <strong>Ejercicios con imágenes: nacionalidad e idioma</strong><div style="margin-top:8px">9 personajes para describir, con un cuadro vacío y respuestas ocultas en español e inglés.</div><button class="btn white small" style="margin-top:12px" onclick="App.gotoLesson(SLIDES.findIndex(s=>s.type==='language-practice-1'))">Practicar con 9 imágenes</button></div><div class="button-row" style="margin-top:24px;justify-content:center"><button class="btn primary" onclick="App.exStart(${total===0?0:EXS.findIndex((q,i)=>!S.solved[i])===-1?0:EXS.findIndex((q,i)=>!S.solved[i])})">▶ ${total?'Continuar ejercicios':'Empezar los ejercicios'}</button><button class="btn white" onclick="App.results()">📈 Ver progreso</button><button class="btn secondary" onclick="App.lesson()">← Volver a la lección</button></div><div class="notice" style="margin-top:23px">💜 Puedes hacer un bloque por día. No hace falta completar los 20 ejercicios en una sola sesión. Tus resultados se guardan en este navegador cuando el almacenamiento está disponible.</div></section>`}
function renderExInput(ex,i){let a=S.exAnswers[i]; if(ex.type==='mcq')return `<div class="choices">${ex.options.map((op,j)=>`<button class="choice ${a===j?'chosen':''} ${S.solved[i]&&j===ex.a?'correct':''}" onclick="App.exPick(${j})"><span class="option-letter">${'ABC'[j]}</span>${escapeHtml(op)}</button>`).join('')}</div>`;
if(ex.type==='order'){let ord=Array.isArray(a)?a:[];return `<div><div class="tiny muted">Selecciona las palabras en el orden correcto. Puedes tocar una palabra seleccionada para quitarla.</div><div class="selected-words">${ord.length?ord.map((j,pos)=>`<button class="token selected" onclick="App.exUnword(${pos})">${escapeHtml(ex.tokens[j])} ✕</button>`).join(''):'<span class="muted">Tu oración aparecerá aquí…</span>'}</div><div class="word-tabs">${ex.tokens.map((t,j)=>`<button class="token" onclick="App.exWord(${j})" ${ord.includes(j)?'disabled':''}>${escapeHtml(t)}</button>`).join('')}</div><div class="button-row" style="margin-top:15px"><button class="btn white small" onclick="App.exClear()">↺ Empezar de nuevo</button></div></div>`}
if(ex.type==='match'){let state=(a&&typeof a==='object'&&!Array.isArray(a))?a:{matched:[],left:null};let order=[2,0,1];return `<div class="pair-columns"><div class="pair-col"><span class="up">COLUMNA A</span>${ex.pairs.map((p,j)=>`<button class="pair-option ${state.left===j?'active':''} ${state.matched.includes(j)?'matched':''}" onclick="App.pair('left',${j})">${escapeHtml(p[0])}${state.matched.includes(j)?' ✓':''}</button>`).join('')}</div><div class="pair-col"><span class="up">COLUMNA B</span>${order.map(j=>`<button class="pair-option ${state.matched.includes(j)?'matched':''}" onclick="App.pair('right',${j})">${escapeHtml(ex.pairs[j][1])}${state.matched.includes(j)?' ✓':''}</button>`).join('')}</div></div><p class="tiny muted" style="margin-top:11px">${state.matched.length}/${ex.pairs.length} parejas correctas</p>`}
if(ex.type==='multi'){let selected=Array.isArray(a)?a:[];return `<div class="answers-grid">${ex.options.map((op,j)=>`<button class="multi-btn ${selected.includes(j)?'active':''}" onclick="App.exMulti(${j})">${selected.includes(j)?'☑':'☐'} ${escapeHtml(op)}</button>`).join('')}</div><p class="tiny muted" style="margin-top:10px">Puedes seleccionar varias opciones.</p>`}
if(ex.type==='multi-blank'){let vals=(a&&typeof a==='object'&&!Array.isArray(a))?a:{};let out='';for(let j=0;j<ex.opts.length;j++){out+=escapeHtml(ex.text[j]).replace(/\n/g,'<br>');out+=`<select class="phrase-select" aria-label="Espacio ${j+1}" onchange="App.exBlank(${j},this.value)"><option value="">Elige…</option>${ex.opts[j].map(v=>`<option value="${escapeAttr(v)}" ${vals[j]===v?'selected':''}>${escapeHtml(v)}</option>`).join('')}</select>`;}out+=escapeHtml(ex.text[ex.opts.length]).replace(/\n/g,'<br>');return `<div class="inner" style="font-size:1.15rem;line-height:3">${out}</div>`}
return '<p>Práctica de español</p>'}
function renderExercise(){let i=S.exIndex,ex=EXS[i],block=EX_BLOCKS[ex.block],correct=S.solved[i],attempts=S.attempts[i]||0;let imgPart=ex.image?`<div style="width:min(100%,390px);margin:5px 0 16px">${img(ex.image,'photo small',ex.title)}</div>`:'';let isMatch=ex.type==='match';let checkBtn=isMatch?'':`<button class="btn primary" onclick="App.exCheck()" ${correct?'disabled':''}>${correct?'✓ Respuesta comprobada':'Comprobar respuesta'}</button>`;let feedback='';if(correct){feedback=`<div class="exam-feedback"><div class="label">✓ ¡Muy bien! Respuesta correcta.</div><div class="solution">${escapeHtml(ex.solution)}</div><div class="eng">${escapeHtml(ex.en)}</div></div>`}else if(attempts){feedback=`<div class="exam-feedback bad"><div class="label">💡 Inténtalo de nuevo</div><div style="margin-top:6px">${escapeHtml(ex.hint)}</div></div>`};
document.getElementById('app').innerHTML=`<section class="card progress-top"><div class="progress-flex"><span class="up">EJERCICIOS · ${block.title}</span><span class="tiny muted">${i+1} / 20 &nbsp;·&nbsp; ${Object.values(S.solved).filter(Boolean).length} completados</span></div><div class="progressbar"><div style="width:${Object.values(S.solved).filter(Boolean).length/20*100}%"></div></div><div class="stage-tabs">${EX_BLOCKS.map((b,j)=>`<button class="stage-tab ${ex.block===j?'current':exCount(j)===b.end-b.start?'done':''}" onclick="App.exStart(${b.start})">${j+1}. ${b.title}</button>`).join('')}</div></section><section class="card ex-page"><div class="ex-top"><div><span class="up">RETO ${i+1} · ${ex.type==='order'?'ORDENAR':ex.type==='match'?'RELACIONAR':ex.type==='multi'?'SELECCIONAR VARIAS':ex.type==='multi-blank'?'COMPLETAR DIÁLOGO':'ELEGIR'}</span><h2 style="margin:6px 0 3px">${ex.title}</h2></div><button class="btn white small" onclick="App.exMenu()">✕ Menú</button></div><div class="ex-activity"><p class="ex-instruction">${ex.prompt}</p>${imgPart}${renderExInput(ex,i)}${feedback}</div><div class="ex-footer"><button class="btn white small" onclick="App.exPrev()" ${i===0?'disabled':''}>← Anterior</button><div class="button-row">${checkBtn}<button class="btn ${correct?'green':'white'}" onclick="App.exNext()">${i===19?'Ver resultados →':'Siguiente →'}</button></div></div></section>`}
function renderResults(){let total=Object.keys(S.solved).filter(k=>S.solved[k]).length,first=Object.keys(S.firstTry).filter(k=>S.firstTry[k]&&S.solved[k]).length;let percent=total?Math.round(first/total*100):0;document.getElementById('app').innerHTML=`<section class="card outcome"><div class="result-illustration">${total===20?'🏆':'🌱'}</div><span class="chip">MI PROGRESO · SPANISH WITH JACKIE</span><h2 style="margin:14px 0">${total===20?'¡Terminaste los 20 ejercicios!':'¡Sigue practicando!'}</h2><p class="muted">Cada intento te ayuda a reconocer y utilizar mejor las estructuras.</p><div class="metric-grid"><div class="metric"><b>${total}/20</b><span>Ejercicios completados</span></div><div class="metric"><b>${first}</b><span>Aciertos al primer intento</span></div><div class="metric"><b>${percent}%</b><span>Precisión inicial (resueltos)</span></div></div><h3>Resultados por bloque</h3><div class="review-list">${EX_BLOCKS.map((b,j)=>`<div class="review-item"><span>${b.icon} ${b.title}</span><span><b>${exCount(j)}/${b.end-b.start}</b> <button class="btn small white" style="margin-left:8px" onclick="App.exStart(${b.start})">Repasar</button></span></div>`).join('')}</div><div class="button-row" style="justify-content:center;margin-top:24px"><button class="btn primary" onclick="App.exMenu()">🧩 Volver a los ejercicios</button><button class="btn secondary" onclick="App.lesson()">📚 Ir a la lección</button><button class="btn white" onclick="App.resetExercises()">↺ Reiniciar práctica</button></div><p class="caption" style="margin-top:24px">La puntuación solo evalúa ejercicios autocorregibles. Las respuestas orales se revisan con tu profesora.</p></section>`}
const App={
home(){S.view='home';render()},start(){S.slide=0;S.view='lesson';render()},lesson(){S.view='lesson';render()},exMenu(){S.view='exmenu';render()},exStart(i){S.exIndex=Math.max(0,Math.min(EXS.length-1,i));S.view='exercise';render()},results(){S.view='result';render()},
prevLesson(){if(S.slide>0){S.slide--;render()}},nextLesson(){if(S.slide===SLIDES.length-1){S.view='home';confetti();beep()}else S.slide++;render()},gotoLesson(i){S.slide=i;S.view='lesson';render()},
translation(el){el.classList.toggle('shown');el.setAttribute('aria-expanded',el.classList.contains('shown')?'true':'false')},
toggleJobGender(id,button){if(!S.jobGenderShown)S.jobGenderShown={};S.jobGenderShown[id]=!S.jobGenderShown[id];save();const row=button.closest('.job-gender-row');row.classList.toggle('revealed',S.jobGenderShown[id]);button.textContent=S.jobGenderShown[id]?'− Ocultar respuesta':'+ Descubrir femenino';button.setAttribute('aria-expanded',String(!!S.jobGenderShown[id]));},
toggleAdj(){S.micro.moreAdj=!S.micro.moreAdj;render()},toggleNation(key,button){if(!S.nationShown)S.nationShown={};S.nationShown[key]=!S.nationShown[key];save();const el=button.closest('.nation-row');el.classList.toggle('revealed',S.nationShown[key]);button.textContent=S.nationShown[key]?'− Ocultar femenino':'＋ Descubrir femenino';button.setAttribute('aria-expanded',S.nationShown[key]?'true':'false')},langInput(key,text){if(!S.langTexts)S.langTexts={};S.langTexts[key]=text;save()},toggleLangAnswer(key){if(!S.langReveal)S.langReveal={};S.langReveal[key]=!S.langReveal[key];save();render()},languageIntroInput(key,value){if(!S.langIntroAnswers)S.langIntroAnswers={};S.langIntroAnswers[key]=value;save()},toggleLanguageGreet(key){if(!S.langGreetingReveal)S.langGreetingReveal={};S.langGreetingReveal[key]=!S.langGreetingReveal[key];save();render()},originInput(text){S.originAnswer=text;save()},jobInput(field,text){if(field==='profession')S.jobProfession=text;else S.jobWorkplace=text;save()},foodInput(key,text){S.foodAnswers[key]=text;save()},toggleFoodAnswer(key){S.foodReveal[key]=!S.foodReveal[key];save();render()},
objectives(){S.modal=true;const goals=[['Expresar cómo te sientes hoy.','Express how you feel today.'],['Decir de dónde eres y cuál es tu nacionalidad.','Say where you are from and what your nationality is.'],['Hablar de tu profesión.','Talk about your profession.'],['Distinguir formas masculinas y femeninas.','Distinguish masculine and feminine forms.'],['Relacionar nacionalidades e idiomas.','Connect nationalities and languages.'],['Participar en una conversación sencilla.','Take part in a simple conversation.']];document.getElementById('modalLayer').innerHTML=`<div class="modal-mask" onclick="if(event.target===this)App.closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="Objetivos de aprendizaje"><div class="modal-head"><div><span class="up">OBJETIVOS DE LA LECCIÓN</span><h2 style="margin:5px 0">¿Qué vamos a aprender?</h2></div><button class="close" onclick="App.closeModal()" aria-label="Cerrar">×</button></div><p class="muted">Haz clic sobre cada objetivo para ver la traducción al inglés.</p>${goals.map((g,i)=>`<div class="objective"><span class="number">${i+1}</span>${T(g[0],g[1])}</div>`).join('')}<div style="margin-top:18px;text-align:right"><button class="btn primary" onclick="App.closeModal()">Entendido ✓</button></div></div></div>`},closeModal(){S.modal=false;document.getElementById('modalLayer').innerHTML=''},
sound(){S.sound=!S.sound;syncNav();save();toast(S.sound?'Sonido activado':'Sonido silenciado')},speak(text){try{if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-PE';u.rate=.83;u.pitch=1;speechSynthesis.speak(u)}else toast('La voz no está disponible en este navegador')}catch(e){toast('No se pudo reproducir el audio')}} ,
oral(i){completeLessonMark(i);toast(S.oral[i]?'¡Práctica oral registrada!':'Marcación deshecha')},goal(i,checked){S.oral['goal'+i]=checked;save();render()},
microChoose(name,j){S.micro['chosen_'+name]=j;S.micro['state_'+name]='';render()},microCheck(name,correct){if(S.micro['chosen_'+name]===correct){S.micro['state_'+name]='good';if(!S.lessonCorrect[name])beep();S.lessonCorrect[name]=true;toast('¡Muy bien!')}else{S.micro['state_'+name]='wrong'}save();render()},microSet(k,v){S.micro[k]=v;render()},
flip(){S.flipped=!S.flipped;render()},flipStep(step){S.flip=Math.max(0,Math.min(CARD_JOBS.length-1,S.flip+step));S.flipped=false;S.flipTrans=false;render()},reveal(el,es,en){let p=el.parentElement;el.remove();let t=document.createElement('p');t.innerHTML=`${T(es,en)}`;p.appendChild(t)},
challengeHint(i,el){let texts=[['Estoy bastante bien.','I am quite well.'],['Soy de Estados Unidos.','I am from the United States.'],['Ella es peruana.','She is Peruvian.'],['Soy abogado.','I am a lawyer.']];document.getElementById('challengehint'+i).innerHTML=T(texts[i][0],texts[i][1]);el.disabled=true},
exPick(j){if(S.solved[S.exIndex])return;S.exAnswers[S.exIndex]=j;save();render()},exWord(j){const i=S.exIndex;if(S.solved[i])return;let arr=Array.isArray(S.exAnswers[i])?S.exAnswers[i].slice():[];if(!arr.includes(j))arr.push(j);S.exAnswers[i]=arr;render()},exUnword(j){let i=S.exIndex;if(S.solved[i])return;let a=(S.exAnswers[i]||[]).slice();a.splice(j,1);S.exAnswers[i]=a;render()},exClear(){if(S.solved[S.exIndex])return;S.exAnswers[S.exIndex]=[];S.attempts[S.exIndex]=0;render()},
exMulti(j){let i=S.exIndex;if(S.solved[i])return;let arr=Array.isArray(S.exAnswers[i])?S.exAnswers[i].slice():[];S.exAnswers[i]=arr.includes(j)?arr.filter(x=>x!==j):[...arr,j];render()},exBlank(j,v){let i=S.exIndex;if(S.solved[i])return;let o=(S.exAnswers[i]&&typeof S.exAnswers[i]==='object'&&!Array.isArray(S.exAnswers[i]))?{...S.exAnswers[i]}:{};o[j]=v;S.exAnswers[i]=o;save()},
pair(side,j){let i=S.exIndex,ex=EXS[i];if(S.solved[i])return;let st=S.exAnswers[i]||{matched:[],left:null};if(side==='left'){if(st.matched.includes(j))return;st.left=j;S.exAnswers[i]=st;render();return}if(st.left===null||st.matched.includes(j)){toast('Primero selecciona una palabra de la izquierda');return}if(st.left===j){st.matched.push(j);st.left=null;S.exAnswers[i]=st;S.attempts[i]=S.attempts[i]||0;if(st.matched.length===ex.pairs.length){S.solved[i]=true;S.firstTry[i]=S.attempts[i]===0;beep();checkBlockCompletion(i)}render()}else{st.left=null;S.exAnswers[i]=st;S.attempts[i]=(S.attempts[i]||0)+1;S.firstTry[i]=false;render();toast('Esa pareja no corresponde. Inténtalo de nuevo.')}},
exCheck(){let i=S.exIndex,ex=EXS[i],a=S.exAnswers[i];if(S.solved[i])return;if(a===undefined||(Array.isArray(a)&&a.length===0)){toast('Primero elige o completa una respuesta.');return}let ok=false;
if(ex.type==='mcq')ok=a===ex.a;
if(ex.type==='order')ok=Array.isArray(a)&&a.length===ex.answer.length&&a.map(j=>ex.tokens[j]).join('|')===ex.answer.join('|');
if(ex.type==='multi')ok=Array.isArray(a)&&a.length===ex.answer.length&&a.slice().sort((x,y)=>x-y).join('|')===ex.answer.slice().sort((x,y)=>x-y).join('|');
if(ex.type==='multi-blank')ok=a&&ex.answer.every((x,j)=>a[j]===x);
if(ok){S.solved[i]=true;S.firstTry[i]=(S.attempts[i]||0)===0;beep();checkBlockCompletion(i);toast('¡Correcto! Traducción desbloqueada.')}else{S.attempts[i]=(S.attempts[i]||0)+1;S.firstTry[i]=false;toast('Pista disponible: vuelve a intentarlo.')}render()},
exPrev(){if(S.exIndex>0){S.exIndex--;render()}},exNext(){if(S.exIndex===EXS.length-1){S.view='result';if(Object.values(S.solved).filter(Boolean).length===20){beep();confetti()}render()}else{S.exIndex++;render()}},
resetExercises(){if(!confirm('¿Reiniciar todos los ejercicios y sus resultados?'))return;S.exAnswers={};S.solved={};S.firstTry={};S.attempts={};S.exIndex=0;S.view='exmenu';render();toast('Ejercicios reiniciados')}
};
function checkBlockCompletion(i){let block=EXS[i].block,b=EX_BLOCKS[block];if(EXS.slice(b.start,b.end).every((x,k)=>S.solved[b.start+k])){setTimeout(()=>{beep();confetti();toast('¡Bloque completado! 🎉')},150)}}
window.App=App;
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)App.closeModal();if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')return;if(S.view==='lesson'&&!S.modal){if(e.key==='ArrowRight')App.nextLesson();if(e.key==='ArrowLeft')App.prevLesson()}});
render();

try { const fontLink=document.createElement('link'); fontLink.rel='stylesheet'; fontLink.href='https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap'; document.head.appendChild(fontLink); } catch(e){}
</script>
