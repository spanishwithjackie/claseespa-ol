op:18px;border:1px solid var(--line)}.chatline{background:white;border-radius:12px 12px 12px 4px;padding:13px 15px;font-size:15px;max-width:88%;box-shadow:0 3px 10px #27143a0b}.chatTag{font-size:11px;font-weight:850;color:#7652aa;margin-bottom:4px}.speakingTiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:20px 0}.speakingTile{border:2px solid #eee6f5;background:#fff;border-radius:15px;overflow:hidden;color:var(--ink);text-align:center;padding:0 0 13px;font-size:15px;font-weight:800}.speakingTile.selected{border-color:#8660bf;background:#f7f2fd}.speakingTile figure{height:155px;margin:0;background:linear-gradient(145deg,#e8daf7,#d4ede4);display:grid;place-items:center;font-size:57px}.speakingTile img{width:100%;height:100%;object-fit:cover}.speakingTile .slabel{padding:11px 10px 0}.speakingBox{background:#f3f0fb;border-radius:14px;padding:17px;margin-top:12px}.model{display:none;padding:13px;background:#e5f4f0;border:1px solid #9bd1bd;border-radius:10px;font-size:13px;margin-top:12px}.model.show{display:block}.exerciseFoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:17px clamp(20px,4vw,42px) 25px;border-top:1px solid var(--line)}.sindex{font-size:12px;font-weight:700;color:var(--muted)}.controls{display:flex;gap:9px}.checkArea{margin-top:18px;display:flex;gap:9px;flex-wrap:wrap}.subtle{font-size:12px;color:var(--muted);margin-top:8px}.summary{padding:30px clamp(21px,4vw,45px)}.summary h2{font-size:32px;margin:6px 0}.statGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{background:#f6f0fa;border-radius:12px;text-align:center;padding:17px}.stat strong{display:block;font-size:26px;color:#63439b}.stat span{font-size:11px;color:var(--muted)}.mistakes{padding:12px 16px;background:#fffbf0;border:1px solid #eedba7;border-radius:12px;margin-bottom:8px;font-size:12px}.smallbtn{background:#fff;border:1px solid #d8c8e9;border-radius:8px;color:#65468c;padding:7px 10px <script>
const MODULES=[{"id": "elegir", "name": "Elige la forma", "en": "Multiple choice · 5", "icon": "✓", "color": "#7b5acd"}, {"id": "completar", "name": "Completa diálogos", "en": "Fill the gaps · 5", "icon": "✎", "color": "#188d89"}, {"id": "ordenar", "name": "Construye frases", "en": "Sentence order · 5", "icon": "↔", "color": "#d98b59"}, {"id": "corregir", "name": "Detecta el error", "en": "Error correction · 5", "icon": "◎", "color": "#c26d99"}, {"id": "responder", "name": "Responde al chat", "en": "Real-life replies · 5", "icon": "☕", "color": "#6b87c8"}];
const TASKS=[{"id": "q01", "module": "elegir", "type": "choice", "title": "¿Practicas deporte?", "prompt": "¿Tú ____ algún deporte los fines de semana?", "instructions": "Choose the correct present-tense form of a regular -AR verb.", "options": ["practico", "practicas", "practicar"], "answer": "practicas", "translation": "Do you do any sports on weekends?", "explain": "With TÚ, regular -AR verbs end in -as: tú practicas.", "hint": "TÚ + PRACTICAR → -as", "visual": "🏃"}, {"id": "q02", "module": "elegir", "type": "choice", "title": "Mis libros favoritos", "prompt": "Yo ____ novelas románticas antes de dormir.", "instructions": "Choose the correct form of LEER for YO.", "options": ["lees", "leo", "leer"], "answer": "leo", "translation": "I read romance novels before going to sleep.", "explain": "LEER is a regular -ER verb. YO + LEER → leo.", "hint": "Think: yo como, yo bebo, yo leo.", "visual": "📚"}, {"id": "q03", "module": "elegir", "type": "choice", "title": "Mis viajes", "prompt": "¿Tú ____ fotos de tus vacaciones con tus amigas?", "instructions": "Choose the correct regular -IR verb form.", "options": ["comparto", "compartir", "compartes"], "answer": "compartes", "translation": "Do you share vacation photos with your friends?", "explain": "COMPARTIR is a regular -IR verb: yo comparto, tú compartes.", "hint": "TÚ + COMPARTIR → -es", "visual": "📷"}, {"id": "q04", "module": "elegir", "type": "choice", "title": "Un plan para mañana", "prompt": "Yo ____ conocer Barranco mañana.", "instructions": "Choose the correct form of QUERER.", "options": ["quieres", "quiero", "queremos"], "answer": "quiero", "translation": "I want to explore Barranco tomorrow.", "explain": "QUERER changes e → ie in YO: quiero. The next verb stays in the infinitive: conocer.", "hint": "YO + QUERER → quiero.", "visual": "🧳"}, {"id": "q05", "module": "elegir", "type": "choice", "title": "Mis preferencias", "prompt": "Yo ____ visitar la playa porque me gusta el mar.", "instructions": "Choose the correct form of PREFERIR for YO.", "options": ["prefiere", "prefieres", "prefiero"], "answer": "prefiero", "translation": "I prefer visiting the beach because I like the sea.", "explain": "PREFERIR changes e → ie: yo prefiero. Use an infinitive after prefiero: visitar.", "hint": "YO + PREFERIR.", "visual": "🏝️"}, {"id": "q06", "module": "completar", "type": "fill", "title": "¿Qué quieres hacer?", "prompt": "Ana: ¿Qué ____ hacer este sábado?  |  Viajera: ____ visitar el museo.", "instructions": "Tap the correct word cards to complete both lines of the dialogue.", "pieces": ["Ana: ¿Qué ", " hacer este sábado?  |  Viajera: ", " visitar el museo."], "answers": ["quieres", "Quiero"], "bank": ["Quiero", "quieres", "quiero", "quiere"], "translation": "Ana: What do you want to do this Saturday? Traveler: I want to visit the museum.", "explain": "For a question to TÚ use quieres; for a response with YO use quiero. The next verb stays in the infinitive.", "hint": "ANA asks TÚ; the traveler replies YO.", "visual": "🏛️"}, {"id": "q07", "module": "completar", "type": "fill", "title": "¿Puedes venir?", "prompt": "Ana: ¿____ venir el domingo?  |  Viajera: Sí, ____ ir por la mañana.", "instructions": "Complete the short conversation with the correct PODER forms.", "pieces": ["Ana: ¿", " venir el domingo?  |  Viajera: Sí, ", " ir por la mañana."], "answers": ["puedes", "puedo"], "bank": ["puedo", "puedes", "poder", "pueden"], "translation": "Ana: Can you come on Sunday? Traveler: Yes, I can go in the morning.", "explain": "PODER → tú puedes; yo puedo. After either form, use the infinitive: venir or ir.", "hint": "Question: tú puedes. Reply: yo puedo.", "visual": "📆"}, {"id": "q08", "module": "completar", "type": "fill", "title": "¿Playa o montaña?", "prompt": "Ana: ¿Qué ____ hacer?  |  Viajera: ____ caminar por las montañas.", "instructions": "Choose the correct PREFERIR forms in this exchange.", "pieces": ["Ana: ¿Qué ", " hacer?  |  Viajera: ", " caminar por las montañas."], "answers": ["prefieres", "Prefiero"], "bank": ["Prefiero", "prefiero", "prefieres", "preferimos"], "translation": "Ana: What do you prefer doing? Traveler: I prefer hiking in the mountains.", "explain": "PREFERIR → tú prefieres, yo prefiero. Then use the infinitive: hacer / caminar.", "hint": "ANA asks about TÚ; answer with YO.", "visual": "⛰️"}, {"id": "q09", "module": "completar", "type": "fill", "title": "Plan de fin de semana", "prompt": "Ana: ¿Qué ____ hacer mañana?  |  Viajera: ____ descansar y escuchar música.", "instructions": "Complete the dialogue using PENSAR to express a plan.", "pieces": ["Ana: ¿Qué ", " hacer mañana?  |  Viajera: ", " descansar y escuchar música."], "answers": ["piensas", "Pienso"], "bank": ["Pienso", "piensan", "piensas", "pensando"], "translation": "Ana: What are you planning to do tomorrow? Traveler: I plan to rest and listen to music.", "explain": "PENSAR → tú piensas / yo pienso. To express a plan, use pensar + infinitive (descansar, escuchar).", "hint": "TÚ piensas; YO pienso.", "visual": "🌿"}, {"id": "q10", "module": "completar", "type": "fill", "title": "Una opinión personal", "prompt": "Ana: ¿Te ____ viajar sola?  |  Viajera: Sí, pero me ____ curiosidad viajar en grupo también.", "instructions": "Complete both expressions: one for liking, one for curiosity.", "pieces": ["Ana: ¿Te ", " viajar sola?  |  Viajera: Sí, pero me ", " curiosidad viajar en grupo también."], "answers": ["gusta", "da"], "bank": ["da", "gusta", "gusto", "das"], "translation": "Ana: Do you like traveling alone? Traveler: Yes, but I am also curious about traveling in a group.", "explain": "Use te gusta + infinitive for a preference, and me da curiosidad + infinitive for curiosity.", "hint": "TE GUSTA; ME DA CURIOSIDAD.", "visual": "💜"}, {"id": "q11", "module": "ordenar", "type": "order", "title": "Planes del sábado", "prompt": "Construye una oración para hablar de tus planes.", "instructions": "Tap the word groups in the correct order to make a complete sentence.", "parts": ["con mis amigas.", "Pienso descansar", "y salir"], "answerParts": ["Pienso descansar", "y salir", "con mis amigas."], "translation": "I plan to rest and go out with my friends.", "explain": "Use pienso + infinitive for plans. Both descansar and salir remain infinitives.", "hint": "Start with “Pienso descansar”.", "visual": "✨"}, {"id": "q12", "module": "ordenar", "type": "order", "title": "Preferencias al viajar", "prompt": "Ordena las partes para explicar qué prefieres y por qué.", "instructions": "Build a sentence with prefiero + infinitive + porque.", "parts": ["porque es divertido.", "en grupo", "Prefiero viajar"], "answerParts": ["Prefiero viajar", "en grupo", "porque es divertido."], "translation": "I prefer traveling in a group because it is fun.", "explain": "After prefiero, use an infinitive. Use porque to explain your reason.", "hint": "Start with the verb “Prefiero”.", "visual": "🧭"}, {"id": "q13", "module": "ordenar", "type": "order", "title": "Quiero conocer gente", "prompt": "Ordena las palabras para expresar un deseo.", "instructions": "Put the chunks into a natural Spanish sentence.", "parts": ["y conocer gente nueva.", "Quiero divertirme"], "answerParts": ["Quiero divertirme", "y conocer gente nueva."], "translation": "I want to have fun and meet new people.", "explain": "QUERER + infinitive: quiero divertirme y conocer. Both verbs stay in the infinitive.", "hint": "Begin with “Quiero”.", "visual": "🎉"}, {"id": "q14", "module": "ordenar", "type": "order", "title": "Una invitación amable", "prompt": "Ordena esta invitación para ir a Barranco.", "instructions": "Build a natural invitation using “¿Qué tal si…?”.", "parts": ["el sábado?", "vamos a Barranco", "¿Qué tal si"], "answerParts": ["¿Qué tal si", "vamos a Barranco", "el sábado?"], "translation": "How about going to Barranco on Saturday?", "explain": "Use the fixed expression ¿Qué tal si…? followed by a conjugated verb: vamos.", "hint": "Begin with “¿Qué tal si…?”.", "visual": "☕"}, {"id": "q15", "module": "ordenar", "type": "order", "title": "Mi opinión sobre un lugar", "prompt": "Ordena las partes para expresar una opinión.", "instructions": "Build a complete opinion, including a reason.", "parts": ["porque me gusta", "la naturaleza.", "Prefiero este lugar"], "answerParts": ["Prefiero este lugar", "porque me gusta", "la naturaleza."], "translation": "I prefer this place because I like nature.", "explain": "Prefiero introduces your preference, and porque gives the reason. Use me gusta + noun here.", "hint": "Start with “Prefiero este lugar”.", "visual": "🏞️"}, {"id": "q16", "module": "corregir", "type": "fix", "title": "GUSTAR + infinitivo", "prompt": "«Me gusto pasar tiempo con mis amigas».", "instructions": "Choose the grammatically correct version.", "options": ["Me gusto pasar tiempo con mis amigas.", "Me gusta pasar tiempo con mis amigas.", "Me gustan pasar tiempo con mis amigas."], "answer": "Me gusta pasar tiempo con mis amigas.", "translation": "I like spending time with my friends.", "explain": "Use me gusta + infinitive to talk about enjoying an activity. “Me gusto pasar” is not correct.", "hint": "ME GUSTA + PASAR.", "visual": "🔎"}, {"id": "q17", "module": "corregir", "type": "fix", "title": "ESTAR y emociones", "prompt": "«Yo estar emocionada por el viaje».", "instructions": "Select the natural sentence with ESTAR.", "options": ["Estoy emocionada por el viaje.", "Yo soy emocionada por el viaje.", "Yo está emocionada por el viaje."], "answer": "Estoy emocionada por el viaje.", "translation": "I am excited about the trip.", "explain": "Use estoy, the first-person form of ESTAR, to describe your current emotion.", "hint": "YO → ESTOY.", "visual": "💟"}, {"id": "q18", "module": "corregir", "type": "fix", "title": "PENSAR + infinitivo", "prompt": "«Pienso descansando el domingo».", "instructions": "Choose the correct expression for a future plan.", "options": ["Pienso descanso el domingo.", "Pienso descansar el domingo.", "Pienso descansada el domingo."], "answer": "Pienso descansar el domingo.", "translation": "I plan to rest on Sunday.", "explain": "Use pienso + infinitive for a plan. Descansar is the infinitive; descansando is the gerund.", "hint": "PENSAR + infinitive.", "visual": "🗓️"}, {"id": "q19", "module": "corregir", "type": "fix", "title": "PREFERIR + infinitivo", "prompt": "«Me prefiero comer en casa».", "instructions": "Select the correct sentence to express a preference.", "options": ["Me prefieres comer en casa.", "Prefiero comer en casa.", "Prefiero como en casa."], "answer": "Prefiero comer en casa.", "translation": "I prefer eating at home.", "explain": "PREFERIR does not take “me” here. Use prefiero + infinitive (comer).", "hint": "PREFIERO + COMER.", "visual": "🍽️"}, {"id": "q20", "module": "corregir", "type": "fix", "title": "Los días de la semana", "prompt": "«En el sábado quiero visitar el museo».", "instructions": "Choose the natural expression for a plan on Saturday.", "options": ["Al sábado quiero visitar el museo.", "El sábado quiero visitar el museo.", "En los sábado quiero visitar el museo."], "answer": "El sábado quiero visitar el museo.", "translation": "On Saturday I want to visit the museum.", "explain": "For a specific Saturday, use el sábado without en. For a repeated habit, use los sábados.", "hint": "One specific day → EL SÁBADO.", "visual": "📅"}, {"id": "q21", "module": "responder", "type": "reply", "title": "Acepta una invitación", "prompt": "Ana: «¿Qué tal si vamos a Barranco mañana?»", "instructions": "Choose a natural way to ACCEPT the invitation.", "options": ["¡Me parece bien!", "Ya tengo planes.", "Hoy no puedo."], "answer": "¡Me parece bien!", "translation": "Sounds good to me!", "explain": "“Me parece bien” is a common, friendly way to accept a suggestion.", "hint": "Choose an enthusiastic YES.", "visual": "💬"}, {"id": "q22", "module": "responder", "type": "reply", "title": "Propón otro día", "prompt": "Ana: «¿Puedes venir al museo el sábado?»", "instructions": "Politely DECLINE and suggest another day.", "options": ["¡Sí, nos vemos ayer!", "No puedo el sábado, pero ¿qué tal si vamos el domingo?", "Me gusta el lunes porque museo."], "answer": "No puedo el sábado, pero ¿qué tal si vamos el domingo?", "translation": "I can’t on Saturday, but how about going on Sunday?", "explain": "A polite refusal often gives a reason or an alternative. “¿Qué tal si…?” suggests a new plan.", "hint": "Say no to Saturday and suggest Sunday.", "visual": "📆"}, {"id": "q23", "module": "responder", "type": "reply", "title": "Explica una preferencia", "prompt": "Ana: «¿Prefieres la playa o la montaña? ¿Por qué?»", "instructions": "Choose an answer that expresses a preference AND gives a reason.", "options": ["La playa.", "Prefiero la montaña porque me gusta la naturaleza.", "Yo prefieres la montaña."], "answer": "Prefiero la montaña porque me gusta la naturaleza.", "translation": "I prefer the mountains because I like nature.", "explain": "Use prefiero + noun, and porque to give your reason.", "hint": "Complete response: PREFIERO… PORQUE…", "visual": "🏔️"}, {"id": "q24", "module": "responder", "type": "reply", "title": "¡Vamos juntas!", "prompt": "Ana: «¿Te gustaría venir al museo con nosotras?»", "instructions": "Choose a warm, natural acceptance.", "options": ["¡Sí, me encantaría!", "No, pero es el museo.", "Yo está gustar."], "answer": "¡Sí, me encantaría!", "translation": "Yes, I’d love to!", "explain": "“Me encantaría” is a friendly, enthusiastic response to an invitation.", "hint": "Choose an excited YES.", "visual": "🏛️"}, {"id": "q25", "module": "responder", "type": "reply", "title": "Opina sobre un hotel", "prompt": "Ana: «¿Qué te parece este hotel cerca de la playa?»", "instructions": "Choose the most natural way to give an opinion.", "options": ["Me parece cómodo y está cerca del mar.", "Yo parezco hotel cómoda.", "Me prefiero el hotel porque sí."], "answer": "Me parece cómodo y está cerca del mar.", "translation": "It seems comfortable to me, and it is close to the sea.", "explain": "“Me parece + adjective” expresses your opinion. Use está to describe the hotel’s location.", "hint": "ME PARECE + adjective; ESTÁ + location.", "visual": "🏨"}];

const KEY='spanishWithJackie_plans_25_v1';
const ST={current:-1,done:{},mistakes:{},attempts:0,answers:{}};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved){ST.done=saved.done||{};ST.mistakes=saved.mistakes||{};ST.attempts=saved.attempts||0;}}catch(e){}
let temp={},feedback=null;
const root=document.getElementById('panel');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const moduleFor=id=>MODULES.find(m=>m.id===id);
const total=TASKS.length;
const solvedCount=()=>Object.keys(ST.done).filter(k=>ST.done[k]).length;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify({done:ST.done,mistakes:ST.mistakes,attempts:ST.attempts}))}catch(e){}};
function markDone(task){ST.done[task.id]=true;persist();renderNav();updateBar();}
function markMistake(task){ST.mistakes[task.id]=(ST.mistakes[task.id]||0)+1;ST.attempts++;persist();}
function updateBar(){const val=Math.round(solvedCount()/total*100);document.getElementById('progressFill').style.width=val+'%';document.getElementById('progressPct').textContent=val+'%';}
function renderNav(){let html=MODULES.map((m,i)=>{let sub=TASKS.filter(t=>t.module===m.id);let solved=sub.filter(t=>ST.done[t.id]).length;let active=ST.current>=0&&ST.current<total&&TASKS[ST.current].module===m.id;return `<button class="navBtn ${active?'active':''}" data-jump="${TASKS.indexOf(sub[0])}"><span class="navIcon">${m.icon}</span><span><b>${i+1}. ${m.name}</b><small>${m.en}</small></span><span class="navMeta">${solved}/${sub.length}</span></button>`}).join('');document.getElementById('sidebarNav').innerHTML=html;document.getElementById('mobileNav').innerHTML=MODULES.map((m,i)=>{let sub=TASKS.filter(t=>t.module===m.id);let active=ST.current>=0&&ST.current<total&&TASKS[ST.current].module===m.id;return `<button class="${active?'active':''}" data-jump="${TASKS.indexOf(sub[0])}">${m.icon} ${i+1}. ${m.name}</button>`}).join('');}
function go(n){ST.current=Math.max(-1,Math.min(total,n));temp={};feedback=null;render();window.scrollTo({top:0,behavior:'smooth'});}
function feedbackBlock(){if(!feedback)return '';const f=feedback;return `<div class="feedback show ${f.good?'good':'bad'}" role="status"><strong>${f.good?'✓ Excellent! / ¡Muy bien!':'↻ Try again / Inténtalo otra vez'}</strong><div>${esc(f.message)}</div>${f.good&&f.translation?`<div class="translation">${esc(f.translation)}</div>`:''}</div>`;}
function baseHead(t){const m=moduleFor(t.module);const types={choice:'Elige la respuesta · Multiple choice',fill:'Completa los espacios · Fill the gaps',order:'Ordena las palabras · Sentence builder',fix:'Encuentra la corrección · Error detective',reply:'Responde al mensaje · Chat response',match:'Une las expresiones · Matching',speak:'Conversación oral · Speaking'};return `<div class="lessonHead"><div class="eyebrow">${esc(m.name)} · ${esc(m.en)}</div><h1 class="title">${esc(t.title)}</h1><p class="subtitle">${esc(t.instructions)}</p><div class="visual">${t.visual||'✨'}</div></div><div class="exerciseArea"><span class="activityType">${esc(types[t.type])}</span><p class="mainPrompt">${esc(t.prompt)}</p>`;}
function choicesHtml(t){const chosen=temp.choice||(ST.done[t.id]?t.answer:undefined);return `<div class="choices">${t.options.map((o,i)=>{let st=chosen===o?(chosen===t.answer?'isRight':'isWrong'):'';return `<button class="option ${st}" data-choice="${i}" ${ST.done[t.id]?'disabled':''}>${esc(o)}</button>`}).join('')}</div>`;}
function renderFill(t){let sel=temp.selections||(ST.done[t.id]?t.answers.map(x=>t.bank.indexOf(x)):Array(t.answers.length).fill(null));let used=sel.filter(x=>x!==null);let sentence='';for(let i=0;i<t.pieces.length;i++){sentence+=`<span>${esc(t.pieces[i])}</span>`;if(i<t.answers.length){sentence+=`<button class="slot ${sel[i]!==null?'filled':''}" data-slot="${i}" ${ST.done[t.id]?'disabled':''}>${sel[i]!==null?esc(t.bank[sel[i]]):'______'}</button>`;}}return `<div class="sentence">${sentence}</div><div class="bank">${t.bank.map((w,i)=>`<button class="word ${used.includes(i)?'used':''}" data-bank="${i}" ${ST.done[t.id]?'disabled':''}>${esc(w)}</button>`).join('')}</div><div class="checkArea"><button class="btn primary" data-check="fill" ${ST.done[t.id]?'disabled':''}>Comprobar · Check ✓</button><button class="btn quiet" data-clear="fill" ${ST.done[t.id]?'disabled':''}>Borrar · Clear</button></div>`;}
function renderOrder(t){const selected=temp.order||(ST.done[t.id]?t.answerParts.map(x=>t.parts.indexOf(x)):[]);return `<div class="orderAnswer">${selected.length?selected.map((x,i)=>`<button class="word" data-order-remove="${i}" ${ST.done[t.id]?'disabled':''}>${esc(t.parts[x])} ×</button>`).join(''):'<span class="subtle">Toca las partes para construir la oración. / Tap the pieces below.</span>'}</div><div class="wordPool">${t.parts.map((w,i)=>`<button class="word ${selected.includes(i)?'used':''}" data-order-add="${i}" ${ST.done[t.id]?'disabled':''}>${esc(w)}</button>`).join('')}</div><div class="checkArea"><button class="btn primary" data-check="order" ${ST.done[t.id]?'disabled':''}>Comprobar · Check ✓</button><button class="btn quiet" data-clear="order" ${ST.done[t.id]?'disabled':''}>Borrar · Clear</button></div>`;}
function renderMatch(t){const matched=temp.matched||(ST.done[t.id]?t.pairs.map((_,i)=>i):[]);const rightOrder=t.pairs.map((_,i)=>i).sort((a,b)=>((a*7+3)%t.pairs.length)-((b*7+3)%t.pairs.length));const right=t.pairs.map((p,i)=>({text:p[1],i})).sort((a,b)=>rightOrder.indexOf(a.i)-rightOrder.indexOf(b.i));return `<div class="matchGrid"><div class="matchCol">${t.pairs.map((p,i)=>`<button class="matchItem ${matched.includes(i)?'matched':''} ${temp.left===i?'selected':''}" data-match-left="${i}" ${matched.includes(i)?'disabled':''}>${esc(p[0])}</button>`).join('')}</div><div class="matchCol">${right.map(p=>`<button class="matchItem ${matched.includes(p.i)?'matched':''}" data-match-right="${p.i}" ${matched.includes(p.i)?'disabled':''}>${esc(p.text)}</button>`).join('')}</div></div><p class="subtle">${matched.length} / ${t.pairs.length} matched · parejas correctas</p>`;}
function renderSpeaking(t){return `<div class="speakingTiles">${t.choices.map((x,i)=>`<button class="speakingTile ${temp.sp===i?'selected':''}" data-speak-choice="${i}"><figure>${x.image&&IMAGES[x.image]?`<img src="${IMAGES[x.image]}" alt="${esc(x.label)}">`:esc(x.emoji)}</figure><div class="slabel">${esc(x.label)}</div></button>`).join('')}</div>${temp.sp!==undefined?`<div class="speakingBox"><strong>🗣️ Say it aloud / Dilo en voz alta:</strong><p style="font-size:18px;font-weight:750;margin:9px 0 3px">${esc(t.choices[temp.sp].stem)}</p><p class="subtle">${esc(t.choices[temp.sp].english)}</p><hr style="border:0;border-top:1px solid #ddd1ec;margin:15px 0"><p><strong>Follow-up / Otra pregunta:</strong><br>${esc(t.prompt2)}<br><span class="subtle">${esc(t.prompt2en)}</span></p></div><div class="checkArea"><button class="btn outline" data-model="1">${temp.model?'Ocultar modelo':'Ver ejemplo · See example'}</button><button class="btn primary" data-speak-done="1" ${ST.done[t.id]?'disabled':''}>Ya respondí en voz alta ✓</button></div><div class="model ${temp.model?'show':''}"><b>Example / Ejemplo:</b><br>${esc(t.model)}<br><i>${esc(t.model_en)}</i></div>`:'<div class="subtle">Choose one option to practice speaking. / Elige una opción para conversar.</div>'}<p class="subtle">There is no automatic speech recognition. Mark this activity after speaking aloud.</p>`;}
function renderTask(t){if(ST.done[t.id]&&!feedback&&t.type!=='speak')feedback={good:true,message:t.explain||'Completed successfully.',translation:t.translation||''};let content=baseHead(t);if(t.type==='choice'||t.type==='fix'||t.type==='reply'){content+=t.type==='reply'?`<div class="conversation"><div class="chatTag">💬 Message / Mensaje</div><div class="chatline">${esc(t.prompt)}</div></div>`:'';content+=choicesHtml(t);}else if(t.type==='fill')content+=renderFill(t);else if(t.type==='order')content+=renderOrder(t);else if(t.type==='match')content+=renderMatch(t);else if(t.type==='speak')content+=renderSpeaking(t);
content+=feedbackBlock();content+=`<div style="margin-top:12px"><button class="hintbtn" data-hint="1">💡 ${temp.hint?'Hide hint / Ocultar pista':'Need a hint? / ¿Necesitas una pista?'}</button><div class="hintContent ${temp.hint?'show':''}">${esc(t.hint||t.explain||'Read the sentence carefully.')}</div></div></div>`;
const idx=ST.current;content+=`<div class="exerciseFoot"><div class="sindex">Ejercicio ${idx+1} de ${total} ${ST.done[t.id]?' · ✓ completado':''}</div><div class="controls"><button class="btn outline" data-prev="1">← Anterior</button><button class="btn primary" data-next="1">${idx===total-1?'Ver resultados':'Siguiente →'}</button></div></div>`;root.innerHTML=content;}
function renderHome(){root.innerHTML=`<div class="hero"><div><div class="eyebrow">ESPAÑOL PARA VIAJAR · A1–A2</div><h1>¡Hacemos <em>planes!</em> ✨</h1><p>Practica el presente, habla de tus preferencias y aprende a invitar, aceptar y rechazar planes en español.</p><div style="font-size:12px;color:#e6d8fb">Spanish with Jackie · Interactive practice</div></div><div class="heroArt"><img src="${IMAGES.friends}" alt="Dos amigas conversando"></div></div><div class="heroIntro"><div class="heroPoints"><div class="heroPoint"><b>🧩 5 tipos · 25 ejercicios</b><span>5 exercises per activity type</span></div><div class="heroPoint"><b>✅ Feedback inmediato</b><span>Explanations in English</span></div><div class="heroPoint"><b>💬 Diálogos</b><span>Real-life conversations</span></div></div><p class="introLine">Instructions: Tap an answer, check your work, read the feedback and keep going. You can revisit any section. Your progress is saved on this device when your browser permits it.</p><button class="btn primary" data-start="1">${solvedCount()?'Continuar practicando →':'¡Empezar! →'}</button><button class="btn outline" style="margin-left:8px" data-results="1">Ver mi progreso</button><div class="subtle" style="margin-top:16px">✨ 25 exercises · 5 different types · All auto-corrected</div></div>`;}
function renderSummary(){const wrong=Object.keys(ST.mistakes).map(id=>TASKS.findIndex(t=>t.id===id)).filter(i=>i>=0);const solved=solvedCount();root.innerHTML=`<div class="summary"><div class="eyebrow">YOUR PROGRESS · TU PROGRESO</div><h2>¡Buen trabajo! 🎉</h2><p class="subtitle">You can review your answers and repeat any activity as often as you like.</p><div class="statGrid"><div class="stat"><strong>${solved}</strong><span>Completados</span></div><div class="stat"><strong>${total}</strong><span>Actividades</span></div><div class="stat"><strong>${wrong.length}</strong><span>Para repasar</span></div></div><h3 style="margin:23px 0 10px">Mis módulos · My modules</h3>${MODULES.map(m=>{const tasks=TASKS.filter(t=>t.module===m.id);const solved=tasks.filter(t=>ST.done[t.id]).length;return `<button class="option" style="width:100%;margin:5px 0" data-jump="${TASKS.indexOf(tasks[0])}">${m.icon} ${esc(m.name)} — ${solved}/${tasks.length} ✓</button>`}).join('')}<h3 style="margin:24px 0 8px">Repasa tus errores · Review mistakes</h3>${wrong.length?wrong.map(idx=>{const t=TASKS[idx];return `<div class="mistakes"><strong>${esc(t.title)}</strong><div>${esc(t.prompt)}</div><div class="subtle">${esc(t.explain||'Review the expression and try again.')}</div><button class="smallbtn" data-jump="${idx}">Volver a practicar →</button></div>`}).join(''):'<p class="subtle">No incorrect attempts recorded yet. / Todavía no hay errores registrados.</p>'}<div class="checkArea"><button class="btn primary" data-home="1">⌂ Volver al inicio</button><button class="btn outline" data-reset="1">Reiniciar todo ↺</button></div><p class="subtle">All activities have automatic feedback in English.</p></div>`;}
function render(){renderNav();updateBar();if(ST.current<0)renderHome();else if(ST.current>=total)renderSummary();else renderTask(TASKS[ST.current]);}
function sendChoice(t,value){if(ST.done[t.id])return;const good=value===t.answer;temp.choice=value;if(good){markDone(t);feedback={good:true,message:t.explain,translation:t.translation};}else{markMistake(t);feedback={good:false,message:t.hint||'Read the sentence again, then try another answer.'};}renderTask(t);}
function checkFill(t){const selections=temp.selections||[];const full=selections.length===t.answers.length&&selections.every(x=>x!==null&&x!==undefined);if(!full){feedback={good:false,message:'Complete every gap first. / Completa todos los espacios.'};renderTask(t);return;}const actual=selections.map(i=>t.bank[i]);const good=actual.every((a,i)=>a===t.answers[i]);if(good){markDone(t);feedback={good:true,message:t.explain,translation:t.translation};}else{markMistake(t);feedback={good:false,message:'One or more answers need another look. Check the subject and the correct verb expression. Tap a filled blank to change it.'};}renderTask(t);}
function checkOrder(t){const chosen=(temp.order||[]).map(i=>t.parts[i]);if(chosen.length!==t.answerParts.length){feedback={good:false,message:'Use all the pieces before checking.'};renderTask(t);return;}const good=chosen.every((x,i)=>x===t.answerParts[i]);if(good){markDone(t);feedback={good:true,message:t.explain,translation:t.translation};}else{markMistake(t);feedback={good:false,message:'Not quite. Check the order of the phrase, then try again. Tap a piece to remove it.'};}renderTask(t);}
document.querySelector('.shell').addEventListener('click',e=>{
 const jump=e.target.closest('[data-jump]');if(jump){go(Number(jump.dataset.jump));return;}
 if(e.target.closest('[data-home]')||e.target.closest('#homeBtn')){go(-1);return;}
 if(e.target.closest('[data-reset]')||e.target.closest('#resetBtn')){if(confirm('¿Reiniciar todo tu progreso? / Reset all progress?')){ST.done={};ST.mistakes={};ST.attempts=0;persist();go(-1);}return;}
 if(e.target.closest('[data-start]')){const next=TASKS.findIndex(t=>!ST.done[t.id]);go(next<0?0:next);return;}
 if(e.target.closest('[data-results]')){go(total);return;}
 if(e.target.closest('[data-prev]')){go(ST.current-1);return;}
 if(e.target.closest('[data-next]')){go(ST.current+1);return;}
 if(ST.current<0||ST.current>=total)return;
 const t=TASKS[ST.current];
 const choice=e.target.closest('[data-choice]');if(choice){sendChoice(t,t.options[Number(choice.dataset.choice)]);return;}
 const slot=e.target.closest('[data-slot]');if(slot){const i=Number(slot.dataset.slot);const s=temp.selections||Array(t.answers.length).fill(null);s[i]=null;temp.selections=s;feedback=null;renderTask(t);return;}
 const bank=e.target.closest('[data-bank]');if(bank){if(ST.done[t.id])return;let s=temp.selections||Array(t.answers.length).fill(null);const i=Number(bank.dataset.bank);if(s.includes(i))return;let spot=s.findIndex(x=>x===null);if(spot>=0)s[spot]=i;temp.selections=s;feedback=null;renderTask(t);return;}
 const ord=e.target.closest('[data-order-add]');if(ord){if(ST.done[t.id])return;const i=Number(ord.dataset.orderAdd);const curr=temp.order||[];if(!curr.includes(i))curr.push(i);temp.order=curr;feedback=null;renderTask(t);return;}
 const rem=e.target.closest('[data-order-remove]');if(rem){if(ST.done[t.id])return;const i=Number(rem.dataset.orderRemove);let curr=temp.order||[];curr.splice(i,1);temp.order=curr;feedback=null;renderTask(t);return;}
 const chk=e.target.closest('[data-check]');if(chk){chk.dataset.check==='fill'?checkFill(t):checkOrder(t);return;}
 const clear=e.target.closest('[data-clear]');if(clear){if(clear.dataset.clear==='fill')temp.selections=Array(t.answers.length).fill(null);else temp.order=[];feedback=null;renderTask(t);return;}
 const mleft=e.target.closest('[data-match-left]');if(mleft){temp.left=Number(mleft.dataset.matchLeft);renderTask(t);return;}
 const mright=e.target.closest('[data-match-right]');if(mright){const right=Number(mright.dataset.matchRight);if(temp.left===undefined){feedback={good:false,message:'First choose a Spanish phrase in the left column.'};renderTask(t);return;}if(temp.left===right){temp.matched=temp.matched||[];if(!temp.matched.includes(right))temp.matched.push(right);temp.left=undefined;if(temp.matched.length===t.pairs.length){markDone(t);feedback={good:true,message:t.explain,translation:'All pairs matched correctly. / Todas las parejas son correctas.'};}else feedback={good:true,message:'Great match! Choose another Spanish phrase and its English meaning.'};}else{markMistake(t);temp.left=undefined;feedback={good:false,message:'Not quite. Match the meaning of the Spanish expression, then try again.'};}renderTask(t);return;}
 const sChoice=e.target.closest('[data-speak-choice]');if(sChoice){temp.sp=Number(sChoice.dataset.speakChoice);feedback=null;renderTask(t);return;}
 if(e.target.closest('[data-model]')){temp.model=!temp.model;renderTask(t);return;}
 if(e.target.closest('[data-speak-done]')){markDone(t);feedback={good:true,message:'Speaking practice completed! Remember: this is not automatically graded. Keep using a full sentence and give a reason with porque.',translation:'Great effort! Repeat your answer once more without reading the model.'};renderTask(t);return;}
 if(e.target.closest('[data-hint]')){temp.hint=!temp.hint;renderTask(t);return;}
});
render();
</script></body></html>
