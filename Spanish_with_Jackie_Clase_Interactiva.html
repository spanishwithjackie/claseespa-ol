function highlightVerbs(s){let all=verbSets.flatMap(v=>v.terms.map(t=>({term:t,cls:v.class}))).sort((a,b)=>b.term.length-a.term.length);let out=esc(s);let tokens=[];for(let i=0;i<all.length;i++){let item=all[i];let safe=esc(item.term);let rx=new RegExp('(^|[^\\p{L}])('+safe.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?=$|[^\\p{L}])','giu');out=out.replace(rx,(full,pre,word)=>{let n=tokens.length;tokens.push(`<mark class="${item.cls}">${word}</mark>`);return pre+'\uE000'+n+'\uE001';});}return out.replace(/\uE000(\d+)\uE001/g,(m,n)=>tokens[Number(n)]);}

function portada(){return `<div class="hero"><div class="hero-copy"><span class="pill gold">✦ CLASE INDIVIDUAL · 50 MIN</span><h1>Un viaje de negocios lleno de imprevistos<span style="color:#bb8aca">.</span></h1>${T(P('Experiencias, desafíos y soluciones en el mundo profesional.','Experiences, challenges and solutions in the professional world.'),'cover_sub')}<p class="muted">Viaja, conversa y aprende a contar lo que ocurrió.</p><button class="btn" data-action="nav" data-page="rompehielos">¡Empezamos! →</button></div><div class="hero-img">${img('aeropuerto_viajero','','Un gerente de ventas viaja con una maleta en el aeropuerto')}</div></div><div class="grid3" style="margin-top:18px"><div class="panel objective"><span class="objective-icon">✈</span><div><strong>Contar experiencias profesionales</strong>${T(P('Habla sobre viajes y reuniones reales.','Talk about real trips and meetings.'),'objective_0',{compact:true})}</div></div><div class="panel objective"><span class="objective-icon">◷</span><div><strong>Describir situaciones del pasado</strong>${T(P('Explica el contexto y los imprevistos.','Explain the background and unexpected events.'),'objective_1',{compact:true})}</div></div><div class="panel objective"><span class="objective-icon">✧</span><div><strong>Explicar soluciones</strong>${T(P('Cuenta cómo conseguiste resolver un problema.','Tell how you managed to solve a problem.'),'objective_2',{compact:true})}</div></div></div><div class="well" style="margin-top:17px">${T(P('Haz clic en cualquier oración para descubrir su traducción al inglés; usa el altavoz para escuchar español latinoamericano cuando esté disponible.','Click any sentence to reveal its English translation; use the speaker to hear Latin American Spanish when available.'),'tip_start')}<div class="row"><span class="pill">文 Traducción individual</span><span class="pill">◖)) Audio</span><span class="pill">✓ Actividades interactivas</span></div></div>`;}
function warmup(){const i=state.warmIndex,q=WARM_Q[i];return `${head('1','¿Cómo son tus viajes de trabajo?','Rompehielos: activa tus experiencias y empieza a hablar.','5 min')}<div class="grid3">${WARM_PHOTOS.map((p,j)=>`<div class="flip-wrap"><button class="flip-card ${state.flipped.includes(j)?'is-flipped':''}" data-action="flip" data-index="${j}" aria-label="Voltear tarjeta ${j+1}"><span class="flip-face">${img(p.image,'photo',p.title)}<span>✦ ${esc(p.title)} ↻</span></span><span class="flip-face flip-back">${esc(p.back.es)}<small style="display:block;margin-top:12px">↻ Volver</small></span></button>${state.flipped.includes(j)?`<div class="well" style="margin-top:7px">${T(p.back,'warmcard'+j,{compact:true})}</div>`:''}</div>`).join('')}</div><div class="grid2" style="margin-top:18px"><div class="panel"><div class="row between"><span class="pill">Pregunta ${i+1} / ${WARM_Q.length}</span><span class="muted small">Conversación guiada</span></div><div class="prompt-big" style="margin:20px 0">${T(q.q,'warmq'+i)}</div>${state.warmExtra[i]?`<div class="well yellow">${T(q.extra,'warmextra'+i)}</div>`:''}<div class="row" style="margin-top:16px"><button class="btn btn-outline btn-sm" data-action="warm-prev" ${i===0?'disabled':''}>← Anterior</button><button class="btn btn-gold btn-sm" data-action="warm-extra">${state.warmExtra[i]?'Ocultar':'Pregunta complementaria'}</button><button class="btn btn-sm" data-action="warm-next">Otra pregunta →</button></div></div><div class="panel soft"><div class="section-kicker">Tus notas</div>${T(P('Cuenta una experiencia concreta: ¿dónde estabas, qué ocurrió y cómo terminó?','Tell a specific story: where were you, what happened, and how did it end?'),'warm_notes_instruction',{compact:true})}${notes('warm','Anota palabras, conectores o una experiencia que quieras contar…')}<div class="well yellow small" style="margin-top:12px">💡 Usa «cuando», «mientras», «de repente» y «finalmente».</div></div></div>`;}
function storyPage(){let st=STORIES.find(x=>x.id===state.story)||STORIES[0];return `${head('★','Tres historias profesionales','Lectura opcional, de 5 a 10 minutos. Puedes omitirla sin afectar el itinerario.','Opcional')}<div class="row between" style="margin-bottom:16px"><div class="story-tabs" role="tablist">${STORIES.map(x=>`<button class="tab ${state.story===x.id?'active':''}" role="tab" aria-selected="${state.story===x.id}" data-action="story" data-id="${x.id}">Historia ${x.id}</button>`).join('')}</div><button class="btn btn-outline btn-sm" data-action="nav" data-page="imagenes">Omitir actividad →</button></div><div class="grid2"><div class="panel stack"><div>${img(st.image,'photo','Fotografía de '+st.title)}</div><h3>${esc(st.title)}</h3><div class="row"><button class="btn-ghost" data-action="story-vocab">${state.storyVocab?'Ocultar':'Ver'} vocabulario</button><button class="btn-ghost" data-action="story-verbs">${state.storyVerbs?'Ocultar':'Resaltar'} los pasados</button><button class="btn-ghost" data-action="story-personal">¿Te pasó algo similar?</button></div>${audioControls(st.sentences.map(x=>x.es).join(' '),'story'+st.id)}${state.storyVerbs?`<div class="well"><div class="row"><span class="pill" style="background:#dff1ff">Indefinido</span><span class="pill" style="background:#ffe3ed">Imperfecto</span><span class="pill gold">Pluscuamperfecto</span></div>${st.verbs.map((v,i)=>`<p class="small" style="margin:7px 0"><strong>${v[0]}:</strong> ${esc(v[1])}</p>`).join('')}</div>`:''}</div><div class="panel"><div class="section-kicker">Lee y descubre lo que pasó</div>${st.sentences.map((s,i)=>T(s,'story'+st.id+'_'+i,{verbs:state.storyVerbs})).join('')}${state.storyVocab?`<div class="linebreak"></div><h3>Vocabulario clave</h3><div class="stack" style="gap:7px">${st.vocab.map((v,i)=>`<div class="vocab-item">${T(v,'vocab'+st.id+i,{compact:true})}</div>`).join('')}</div>`:''}${state.storyPersonal?`<div class="well yellow" style="margin-top:17px"><h3>Ahora tú</h3>${T(st.question,'storyquestion'+st.id)}${notes('story'+st.id,'Tu experiencia, en pocas palabras…',3)}</div>`:''}</div></div>`;}
function describe(){let d=DESCRIPTIONS[state.descIndex],q=d.questions[state.descQuestion];return `${head('2','¿Qué está pasando?','Observa, describe, imagina causas y cuenta qué ocurrió después.','10 min')}<div class="grid2"><div class="panel"><div class="image-stage">${img(d.image,'','Situación profesional: '+d.title)}<span class="floating">Imagen ${String.fromCharCode(65+state.descIndex)} · ${esc(d.title)}</span></div><div class="row between" style="margin-top:16px"><button class="btn btn-outline btn-sm" data-action="desc-prev">← Anterior imagen</button><span class="pill">${state.descIndex+1} / 3</span><button class="btn btn-outline btn-sm" data-action="desc-next">Siguiente imagen →</button></div>${T(d.caption,'desccap'+state.descIndex,{compact:true})}</div><div class="panel"><span class="pill gold">Pregunta ${state.descQuestion+1} / 5</span><div class="prompt-big" style="margin-top:20px">${T(q,'desc'+state.descIndex+'_'+state.descQuestion)}</div><div class="row" style="margin-top:18px"><button class="btn btn-outline btn-sm" data-action="desc-qprev" ${state.descQuestion===0?'disabled':''}>← Pregunta</button><button class="btn btn-sm" data-action="desc-qnext" ${state.descQuestion===4?'disabled':''}>Siguiente pregunta →</button><button class="btn btn-gold btn-sm" data-action="desc-hint">Pista ✦</button></div>${state.descHints[state.descIndex]?`<div class="well yellow" style="margin:14px 0">${T(d.hint,'deschint'+state.descIndex)}</div>`:''}<div class="section-kicker" style="margin-top:18px">Describe la escena</div>${notes('desc'+state.descIndex,'Escribe tu descripción o algunas ideas…',4)}</div></div><div class="well" style="margin-top:18px"><div class="row between"><strong>Desafío adicional</strong><span class="pill">Mientras · Cuando · De repente · Por suerte · Finalmente</span></div>${T(P('Elige dos imágenes e inventa una historia que las conecte utilizando cinco conectores narrativos.','Choose two pictures and invent a story linking them with five narrative connectors.'),'desc_challenge')}${notes('descChallenge','Tu historia con dos imágenes…',3)}</div>`;}
function grammar(){return `${head('3','Una historia con imprevistos','Descubre los tres pasados a partir de una historia de negocios.','8 min')}<div class="grid2"><div class="panel"><h3>Lee y escucha</h3>${GRAMMAR_STORY.map((x,i)=>T(x,'grammar_story'+i,{verbs:true})).join('')}${audioControls(GRAMMAR_STORY.map(x=>x.es).join(' '),'grammarall')}<div class="row" style="margin-top:15px"><span class="pill" style="background:#dff1ff">Indefinido</span><span class="pill" style="background:#ffe4ed">Imperfecto</span><span class="pill gold">Pluscuamperfecto</span></div></div><div class="panel soft"><div class="section-kicker">Descubrimiento inductivo</div><h3>¿Qué observas?</h3>${DISCOVERY.map((x,i)=>`<div class="well" style="margin:12px 0">${T(x.q,'discoverq'+i)}<button class="btn-ghost btn-sm" data-action="discover" data-index="${i}">${state.grammarRevealed[i]?'Ocultar respuesta':'Revelar respuesta'} ✧</button>${state.grammarRevealed[i]?`<div class="feedback">${T(x.a,'discovera'+i,{compact:true})}</div>`:''}</div>`).join('')}</div></div><h3 style="margin:22px 0 13px">Los tiempos del pasado</h3><div class="grid3">${GRAMMAR_CARDS.map((x,i)=>`<div class="grammar-box"><span class="circle">${i+1}</span><h3>${x.title}</h3><span class="pill">${x.tag}</span>${x.desc.map((d,j)=>T(d,'grammarcard'+i+'_'+j,{compact:true})).join('')}${T(x.ex,'grammarex'+i,{verbs:true,compact:true})}</div>`).join('')}</div><div class="panel" style="margin-top:18px"><h3>Línea de tiempo interactiva</h3><div class="timeline">${TIMELINE.map((x,i)=>`<button data-action="timeline" data-index="${i}" class="timeline-node ${state.timeline===i?'active':''}"><span class="count">${i+1}</span><strong>${x.title}</strong></button>`).join('')}</div><div class="well">${T(TIMELINE[state.timeline].q,'timeline'+state.timeline,{verbs:true})}${T(TIMELINE[state.timeline].desc,'timelinedesc'+state.timeline,{compact:true})}</div></div>`;}
function quiz(){let i=state.quizIndex,x=QUIZ[i],choice=state.quizSelected[i],result=state.quizResult[i],answered=Object.keys(state.quizResult).length,score=Object.values(state.quizResult).filter(x=>x==='right').length;
return `${head('4','Elige el pasado correcto','Decide qué tiempo verbal encaja mejor en cada contexto.','8 min')}<div class="grid2"><div class="panel"><div class="row between"><span class="pill">Actividad ${i+1} / 5</span><span class="count">${score} aciertos · ${answered} revisadas</span></div><div class="scorebar" style="margin-top:13px"><div style="width:${answered/5*100}%"></div></div><div style="margin:28px 0 24px" class="prompt-big">${T(x.q,'quizq'+i)}</div><div class="options" role="group" aria-label="Opciones de respuesta">${x.opts.map((o,j)=>`<button type="button" data-action="quiz-select" data-index="${j}" class="option ${choice===j?'selected':''} ${result==='right'&&j===x.answer?'right':''} ${result==='wrong'&&choice===j?'wrong':''}" ${result==='right'?'disabled':''}><span class="option-dot">${choice===j?'●':String.fromCharCode(65+j)}</span>${esc(o)}</button>`).join('')}</div><div class="row" style="margin-top:19px"><button class="btn" data-action="quiz-check" ${choice===undefined||result==='right'?'disabled':''}>✓ Comprobar</button><button class="btn btn-outline" data-action="quiz-prev" ${i===0?'disabled':''}>← Anterior</button><button class="btn btn-outline" data-action="quiz-next" ${i===4?'disabled':''}>Siguiente →</button></div>${result?`<div class="feedback ${result==='wrong'?'bad':''}"><strong>${result==='right'?'¡Muy bien!':'Inténtalo de nuevo.'}</strong>${T(x.ex,'quizex'+i,{compact:true})}${result==='wrong'?`<span class="small">Pista: piensa en el orden de los acontecimientos.</span>`:''}</div>`:''}</div><div class="panel soft"><div class="section-kicker">La clave para decidir</div><h3>¿Contexto, acción o anterioridad?</h3>${T(P('El imperfecto describe lo que estaba pasando.','The imperfect describes what was happening.'),'quizhint1')}${T(P('El indefinido cuenta un hecho que ocurrió.','The preterite tells about an event that happened.'),'quizhint2')}${T(P('El pluscuamperfecto explica lo que ya había ocurrido.','The past perfect explains what had already happened.'),'quizhint3')}<div class="well yellow" style="margin-top:20px"><strong>Consejo</strong>${T(P('Primero lee la oración completa; después decide qué acción sirve de contexto y qué acción hace avanzar la historia.','First read the whole sentence; then decide which action provides the background and which one moves the story forward.'),'quiz_tip')}</div>${answered===5?`<div class="well" style="margin-top:15px"><h3>¡Actividad completada!</h3><strong style="font-size:26px">${score} / 5</strong><p>Respuestas correctas en la última comprobación.</p><button class="btn btn-outline btn-sm" data-action="quiz-reset">↻ Intentar otra vez</button></div>`:''}</div></div>`;}
function scenario(){let sc=SCENARIOS.find(x=>x.id===state.scenario)||SCENARIOS[0];let cur=state.scenarioSurprises[sc.id]??-1;return `${head('5','Simulación con un cliente','Tú eres el gerente comercial; la profesora interpreta al cliente.','12 min')}<div class="row between" style="margin-bottom:16px"><div class="scenario-tabs">${SCENARIOS.map(s=>`<button class="tab ${s.id===sc.id?'active':''}" data-action="scenario" data-id="${s.id}">${s.id}. ${esc(s.title)}</button>`).join('')}</div><button class="btn btn-outline btn-sm" data-action="scenario-random">Cambiar situación ↻</button></div><div class="grid2"><div class="panel stack">${img(sc.image,'photo scenario-photo',sc.title)}<span class="pill gold">Escenario ${sc.id}</span><h3>${esc(sc.title)}</h3>${T(sc.situation,'scenarioSituation'+sc.id)}<div class="well"><strong>Tu misión</strong>${T(sc.mission,'scenarioMission'+sc.id)}</div><div class="row"><button class="btn btn-gold btn-sm" data-action="scenario-surprise">⚡ Nuevo imprevisto</button><button class="btn btn-outline btn-sm" data-action="scenario-expressions">${state.scenarioExpressions?'Ocultar':'Expresiones útiles'} ✦</button><button class="btn btn-light btn-sm" data-action="speak" data-key="scenarioSituation${sc.id}" data-text="${attr(sc.situation.es)}">◖)) Escuchar</button></div>${cur>=0?`<div class="surprise"><strong>⚡ Nuevo imprevisto</strong>${T(sc.surprises[cur],'surprise'+sc.id+cur)}</div>`:''}</div><div class="panel soft"><div class="section-kicker">Turno de conversación</div><h3>Responde como un profesional</h3>${T(P('La profesora comienza como cliente. Escucha su preocupación, haz preguntas y explica tu propuesta sin leer un diálogo preparado.','The teacher begins as the client. Listen to their concern, ask questions, and explain your proposal without reading a prepared script.'),'roleplayintro')}<div class="well yellow small"><strong>Objetivo</strong> · Contexto → Problema → Anterioridad → Solución → Resultado</div>${state.scenarioExpressions?`<h3 style="margin-top:17px">Expresiones para ayudarte</h3>${EXPRESSIONS.map((e,i)=>T(e,'expression'+i,{compact:true})).join('')}`:`<div class="well" style="margin-top:17px">${T(P('Las expresiones útiles están ocultas para que primero intentes comunicarte con tus propias palabras.','The helpful expressions are hidden so that you can first try to communicate in your own words.'),'expressions_hidden')}</div>`}<div class="section-kicker" style="margin-top:20px">Notas de la simulación</div>${notes('scenario'+sc.id,'¿Qué dijo el cliente? ¿Qué solución propusiste?',5)}</div></div>`;}
function homework(){return `${head('6','Practica lo aprendido','Actividades complementarias o tarea, fuera de los 50 minutos principales.','Opcional')}<div class="panel"><div class="row between"><h3>Actividad A. Encuentra y corrige el error</h3><span class="pill">5 oraciones</span></div>${T(P('Escribe una corrección posible. Después consulta la pista o la respuesta modelo; puede haber más de una solución correcta.','Write a possible correction. Then check the hint or sample answer; more than one answer may be correct.'),'error_intro')}<div class="stack">${ERRORS.map((e,i)=>`<div class="error-item"><div class="row"><span class="task-number">${i+1}</span><div class="flex1">${T(e.wrong,'errorwrong'+i)}</div></div><label for="errorfield${i}" class="small muted">Tu corrección</label><textarea class="notearea" id="errorfield${i}" data-note="error${i}" rows="2" placeholder="Escribe la oración corregida…">${esc(state.notes['error'+i]||'')}</textarea><div class="row" style="margin-top:11px"><button class="btn btn-gold btn-sm" data-action="error-hint" data-index="${i}">${state.errorHints[i]?'Ocultar pista':'Ver pista'}</button><button class="btn btn-outline btn-sm" data-action="error-model" data-index="${i}">${state.errorModels[i]?'Ocultar corrección':'Ver corrección modelo'}</button></div>${state.errorHints[i]?`<div class="well yellow" style="margin-top:11px">${T(e.hint,'errorhint'+i,{compact:true})}</div>`:''}${state.errorModels[i]?`<div class="feedback">${T(e.model,'errormodel'+i,{compact:true})}${T(e.ex,'errorex'+i,{compact:true})}<small>La profesora puede aceptar otras formulaciones correctas.</small></div>`:''}</div>`).join('')}</div></div><div class="panel" style="margin-top:18px"><div class="row between"><h3>Actividad B. Completa la historia</h3><span class="pill">4 ejercicios</span></div>${T(P('Selecciona una forma verbal en cada oración. La corrección es inmediata.','Select a verb form in each sentence. Feedback is immediate.'),'complete_intro')}${COMPLETE.map((c,i)=>`<div class="error-item" style="margin:12px 0"><div class="row"><span class="task-number">${i+1}</span><div class="flex1">${T(c.q,'completeq'+i)}</div></div><div class="row"><label for="complete${i}" class="small muted">Selecciona:</label><select id="complete${i}" class="drop-select" data-complete="${i}"><option value="">Elige una opción…</option>${c.opts.map((o,j)=>`<option value="${j}" ${state.completeSelected[i]===j?'selected':''}>${esc(o)}</option>`).join('')}</select></div>${state.completeResult[i]?`<div class="feedback ${state.completeResult[i]==='wrong'?'bad':''}"><strong>${state.completeResult[i]==='right'?'¡Excelente!':'Vuelve a intentarlo.'}</strong>${T(c.ex,'completeex'+i,{compact:true})}</div>`:''}</div>`).join('')}</div><div class="panel soft" style="margin-top:18px"><h3>Actividad C. Ahora cuenta tu experiencia</h3>${T(P('Graba un audio de uno o dos minutos contando una experiencia real o inventada de un viaje profesional o personal en el que ocurrió algo inesperado.','Record one or two minutes of audio about a real or imagined professional or personal trip when something unexpected happened.'),'speakingintro')}<div class="grid2"><div><div class="well"><strong>Incluye estas seis ideas</strong>${[
P('Dónde estaba.','Where I was.'),P('Qué estaba haciendo.','What I was doing.'),P('Qué había ocurrido antes.','What had happened before.'),P('Qué problema surgió.','What problem arose.'),P('Cómo lo solucionó.','How I solved it.'),P('Cómo terminó la situación.','How the situation ended.')].map((p,i)=>T(p,'speakingpoint'+i,{compact:true})).join('')}</div><div class="row" style="margin-top:12px"><span class="pill">Mientras</span><span class="pill">Cuando</span><span class="pill">De repente</span><span class="pill">Por suerte</span><span class="pill">Al final</span></div><p class="small muted">Utiliza al menos cuatro conectores.</p></div><div><div class="section-kicker">Prepara tus ideas</div>${notes('speaking','Prepara tu relato antes de grabar…',7)}<div class="record-control"><div class="record-status"><strong>Grabadora de audio</strong><span id="record-state" class="small muted">${recording?'Grabando…':recordedAudio?'Grabación lista':'Listo para grabar'}</span></div><div class="row" style="margin-top:12px"><button class="btn btn-sm ${recording?'btn-outline':''}" data-action="record-${recording?'stop':'start'}">${recording?'■ Detener grabación':'● Grabar audio'}</button><button class="btn btn-outline btn-sm" data-action="record-download" ${recordedAudio?'':'disabled'}>↓ Guardar audio</button></div>${recordedUrl?`<audio controls style="width:100%;margin-top:13px" src="${attr(recordedUrl)}"></audio>`:''}<p class="small muted" style="margin-top:8px">El audio se procesa en tu dispositivo. El navegador pedirá acceso al micrófono.</p></div></div></div></div>`;}
function closing(){let score=Object.values(state.quizResult).filter(x=>x==='right').length,answered=Object.keys(state.quizResult).length,checked=Object.values(state.checks).filter(Boolean).length;return `${head('7','¡Misión cumplida!','Reflexiona sobre lo aprendido y recibe feedback de tu profesora.','5 min')}<div class="hero" style="min-height:270px;grid-template-columns:1fr 37%"><div class="hero-copy"><span class="pill gold">✦ CIERRE DE LA CLASE</span><h2>Una buena historia también tiene un buen final.</h2>${T(P('Hoy contaste experiencias, describiste circunstancias y buscaste soluciones para tus clientes.','Today you told stories, described circumstances, and found solutions for your clients.'),'closing_intro')}<div class="row"><span class="pill green">✓ Comunicación profesional</span><span class="pill">B1–B1+</span></div></div><div class="hero-img" style="min-height:245px">${img('equipo_mina','','Profesionales celebran una solución en la mina')}</div></div><div class="grid3" style="margin:18px 0"><div class="summary-stat"><strong>${score}/5</strong><span class="small muted">Aciertos de gramática</span></div><div class="summary-stat"><strong>${answered}/5</strong><span class="small muted">Preguntas comprobadas</span></div><div class="summary-stat"><strong>${checked}/4</strong><span class="small muted">Objetivos revisados</span></div></div><div class="grid2"><div class="panel"><h3>Reflexiona en voz alta</h3>${CLOSING_Q.map((p,i)=>T(p,'closingq'+i)).join('')}<div class="linebreak"></div><h3>Autoevaluación</h3>${[
'Puedo contar un acontecimiento terminado.','Puedo describir una situación en el pasado.','Puedo explicar qué había ocurrido antes.','Puedo proponer soluciones a un cliente.'
].map((s,i)=>`<label class="checkline"><input type="checkbox" data-check="${i}" ${state.checks[i]?'checked':''}><span>${esc(s)}</span></label>`).join('')}</div><div class="panel soft"><h3>Feedback de la profesora</h3>${T(P('Anota los puntos fuertes, las expresiones que conviene practicar y un objetivo para la próxima clase.','Write down strengths, expressions to practice, and one goal for the next lesson.'),'feedbackintro')}${notes('feedback','Ejemplo: Tu narración fue clara. Practica «había recibido» para explicar hechos anteriores…',7)}<div class="row" style="margin-top:13px"><button class="btn" data-action="copy-feedback">▣ Copiar feedback</button><button class="btn btn-outline btn-sm" data-action="reset">↻ Reiniciar la clase</button></div><div class="well yellow small" style="margin-top:15px">✦ En la siguiente clase puedes practicar objeciones, llamadas con clientes chilenos y negociaciones.</div></div></div>`;}
const RENDERERS={inicio:portada,rompehielos:warmup,historias:storyPage,imagenes:describe,gramatica:grammar,practica:quiz,simulacion:scenario,tarea:homework,cierre:closing};
function render(scroll=false){if(!SCREENS.some(s=>s.id===state.page))state.page='inicio';document.getElementById('app').innerHTML=`<div class="app">${sidebar()}<main class="main" id="main-content">${pageHeader()}${RENDERERS[state.page]()}${footer()}</main></div><div id="toast-slot"></div><div id="confetti-slot"></div>`;if(scroll)window.scrollTo({top:0,behavior:'instant'});}
function navigate(id){if(!SCREENS.some(x=>x.id===id))return;stopSpeech();state.page=id;if(!state.visited.includes(id))state.visited.push(id);state.menu=false;saveUpdate();window.scrollTo({top:0,behavior:'instant'});}
function voice(){if(!window.speechSynthesis)return null;let vs=speechSynthesis.getVoices();return vs.find(v=>/^es-(CL|PE|MX|CO|AR)/i.test(v.lang))||vs.find(v=>/^es-(US|419)/i.test(v.lang))||vs.find(v=>v.lang?.startsWith('es'))||null;}
function speech(text,key){if(state.mute){toast('Activa el sonido para escuchar.');return;}if(!window.speechSynthesis){toast('Este navegador no admite lectura en voz alta.');return;}stopSpeech();try{let u=new SpeechSynthesisUtterance(text);u.lang='es-MX';let v=voice();if(v){u.voice=v;u.lang=v.lang;}u.rate=state.speed;u.pitch=1;u.volume=.96;currentSpeech=text;speechUtterance=u;u.onstart=()=>{let line=key&&document.querySelector(`[data-line="${CSS.escape(key)}"] .speak-btn`);if(line)line.classList.add('speaking');};u.onend=u.onerror=()=>document.querySelectorAll('.speak-btn.speaking').forEach(x=>x.classList.remove('speaking'));window.speechSynthesis.speak(u);}catch(e){toast('No se pudo reproducir el audio.');}}
function stopSpeech(){if(window.speechSynthesis)window.speechSynthesis.cancel();document.querySelectorAll('.speak-btn.speaking').forEach(x=>x.classList.remove('speaking'));}
let ctx=null;
function sound(kind){if(state.mute)return;try{let A=window.AudioContext||window.webkitAudioContext;if(!A)return;ctx=ctx||new A();if(ctx.state==='suspended')ctx.resume();let f=kind==='success'?[600,780,930]:kind==='finish'?[520,650,810,1050]:kind==='error'?[380,320]:[490];let now=ctx.currentTime;f.forEach((hz,i)=>{let osc=ctx.createOscillator(),gain=ctx.createGain(),start=now+i*.09;osc.type='sine';osc.frequency.setValueAtTime(hz,start);gain.gain.setValueAtTime(0,start);gain.gain.linearRampToValueAtTime(kind==='button'?.018:.06,start+.012);gain.gain.exponentialRampToValueAtTime(.001,start+.16);osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+.18);});}catch(e){}}
function confetti(){if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;let host=document.createElement('div');host.className='confetti';host.setAttribute('aria-hidden','true');let colors=['#b8a1e3','#e7b8d8','#fff1c9','#a6dcc6','#b9d5fa'];for(let i=0;i<32;i++){let part=document.createElement('span');part.className='confetti-piece';part.style.left=(10+Math.random()*80)+'%';part.style.backgroundColor=colors[i%colors.length];part.style.animationDelay=(Math.random()*.2)+'s';part.style.setProperty('--dx',(Math.random()*280-140)+'px');host.appendChild(part);}document.body.appendChild(host);setTimeout(()=>host.remove(),1850);}
let toastTimer=0;
function toast(msg){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.role='status';e.textContent=msg;document.body.appendChild(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),2800);}
function success(){sound('success');confetti();}
async function startRecording(){if(recording)return;if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('La grabación no está disponible en este navegador.');return;}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});recStream=stream;let preferred=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'';recorder=new MediaRecorder(stream,preferred?{mimeType:preferred}:undefined);let chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onstop=()=>{recordedAudio=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(recordedUrl)URL.revokeObjectURL(recordedUrl);recordedUrl=URL.createObjectURL(recordedAudio);recStream?.getTracks().forEach(t=>t.stop());recStream=null;recording=false;render();toast('Grabación lista para reproducir o guardar.');};recorder.start();recording=true;render();}catch(e){toast(e.name==='NotAllowedError'?'Permite el acceso al micrófono para grabar.':'No se pudo iniciar la grabación.');}}
function stopRecording(){if(recorder&&recorder.state!=='inactive')recorder.stop();}
function downloadRecording(){if(!recordedAudio||!recordedUrl)return;let a=document.createElement('a');a.href=recordedUrl;a.download='mi-experiencia-en-espanol.'+(recordedAudio.type.includes('mp4')?'m4a':'webm');document.body.appendChild(a);a.click();a.remove();}
function copyText(text){if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(text);let ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=document.execCommand('copy');ta.remove();return ok?Promise.resolve():Promise.reject();}
function feedbackText(){let x=SCENARIOS.find(s=>s.id===state.scenario);return ['Spanish with Jackie | Feedback de clase','Lección: Un viaje de negocios lleno de imprevistos','Estudiante: Han','Resultado de gramática: '+Object.values(state.quizResult).filter(v=>v==='right').length+'/5','Simulación: '+x.title,'Objetivos revisados: '+Object.values(state.checks).filter(Boolean).length+'/4','','Feedback:',state.notes.feedback||'(Pendiente de completar por la profesora)','','Práctica sugerida: narrar una experiencia usando indefinido, imperfecto y pluscuamperfecto.'].join('\n');}
document.addEventListener('click',async ev=>{
const b=ev.target.closest('[data-action]');if(!b)return;
let a=b.dataset.action,i=Number(b.dataset.index),id=b.dataset.id;
if(!['translate','speak','stop-speech','repeat','mute','speed','nav','menu'].includes(a))sound('button');
switch(a){
case 'nav':navigate(b.dataset.page);break;
case 'menu':state.menu=!state.menu;render();break;
case 'translate':state.translations[b.dataset.key]=!state.translations[b.dataset.key];saveUpdate();break;
case 'speak':speech(b.dataset.text,b.dataset.key);break;
case 'repeat':if(currentSpeech)speech(currentSpeech,'');else toast('Elige primero una oración para escuchar.');break;
case 'stop-speech':stopSpeech();break;
case 'mute':state.mute=!state.mute;if(state.mute)stopSpeech();saveUpdate();toast(state.mute?'Sonidos silenciados.':'Sonidos activados.');break;
case 'speed':state.speed=state.speed===1?.8:1;saveUpdate();toast(`Velocidad de audio: ${state.speed}×`);break;
case 'flip':state.flipped.includes(i)?state.flipped=state.flipped.filter(x=>x!==i):state.flipped.push(i);saveUpdate();break;
case 'warm-prev':state.warmIndex=Math.max(0,state.warmIndex-1);saveUpdate();break;
case 'warm-next':state.warmIndex=(state.warmIndex+1)%WARM_Q.length;saveUpdate();break;
case 'warm-extra':state.warmExtra[state.warmIndex]=!state.warmExtra[state.warmIndex];saveUpdate();break;
case 'story':state.story=id;state.storyVocab=false;state.storyPersonal=false;state.storyVerbs=false;saveUpdate();break;
case 'story-vocab':state.storyVocab=!state.storyVocab;saveUpdate();break;
case 'story-verbs':state.storyVerbs=!state.storyVerbs;saveUpdate();break;
case 'story-personal':state.storyPersonal=!state.storyPersonal;saveUpdate();break;
case 'desc-prev':state.descIndex=(state.descIndex+2)%3;state.descQuestion=0;saveUpdate();break;
case 'desc-next':state.descIndex=(state.descIndex+1)%3;state.descQuestion=0;saveUpdate();break;
case 'desc-qprev':state.descQuestion=Math.max(0,state.descQuestion-1);saveUpdate();break;
case 'desc-qnext':state.descQuestion=Math.min(4,state.descQuestion+1);saveUpdate();break;
case 'desc-hint':state.descHints[state.descIndex]=!state.descHints[state.descIndex];saveUpdate();break;
case 'discover':state.grammarRevealed[i]=!state.grammarRevealed[i];saveUpdate();break;
case 'timeline':state.timeline=i;saveUpdate();break;
case 'quiz-select':if(state.quizResult[state.quizIndex]==='right')break;state.quizSelected[state.quizIndex]=i;delete state.quizResult[state.quizIndex];saveUpdate();break;
case 'quiz-check':{let q=state.quizIndex;if(state.quizSelected[q]===undefined)break;let good=state.quizSelected[q]===QUIZ[q].answer,prior=state.quizResult[q];state.quizResult[q]=good?'right':'wrong';if(good&&prior!=='right')success();else if(!good)sound('error');if(Object.keys(state.quizResult).length===5){let allCorrect=Object.values(state.quizResult).every(x=>x==='right');if(allCorrect)sound('finish');}saveUpdate();break;}
case 'quiz-prev':state.quizIndex=Math.max(0,state.quizIndex-1);saveUpdate();break;
case 'quiz-next':state.quizIndex=Math.min(4,state.quizIndex+1);saveUpdate();break;
case 'quiz-reset':state.quizIndex=0;state.quizSelected={};state.quizResult={};saveUpdate();break;
case 'scenario':state.scenario=id;state.scenarioExpressions=false;saveUpdate();break;
case 'scenario-random':state.scenario=SCENARIOS[(SCENARIOS.findIndex(x=>x.id===state.scenario)+1)%3].id;state.scenarioExpressions=false;saveUpdate();break;
case 'scenario-surprise':{let n=state.scenarioSurprises[state.scenario]??-1;state.scenarioSurprises[state.scenario]=(n+1)%3;saveUpdate();break;}
case 'scenario-expressions':state.scenarioExpressions=!state.scenarioExpressions;saveUpdate();break;
case 'error-hint':state.errorHints[i]=!state.errorHints[i];saveUpdate();break;
case 'error-model':state.errorModels[i]=!state.errorModels[i];saveUpdate();break;
case 'record-start':startRecording();break;
case 'record-stop':stopRecording();break;
case 'record-download':downloadRecording();break;
case 'copy-feedback':try{await copyText(feedbackText());sound('success');toast('Feedback copiado al portapapeles.');}catch(e){toast('No se pudo copiar automáticamente. Selecciona y copia las notas.');}break;
case 'reset':if(confirm('¿Quieres borrar el progreso y las notas de esta clase?')){stopSpeech();state=structuredClone(INITIAL);persist();render(true);toast('Clase reiniciada.');}break;
default:break;
}
});
document.addEventListener('input',ev=>{let note=ev.target.dataset?.note;if(note!==undefined){state.notes[note]=ev.target.value;persist();}});
document.addEventListener('change',ev=>{let el=ev.target;if(el.dataset?.complete!==undefined){let i=Number(el.dataset.complete),prev=state.completeResult[i];if(el.value===''){delete state.completeResult[i];delete state.completeSelected[i];}else{state.completeSelected[i]=Number(el.value);let good=state.completeSelected[i]===COMPLETE[i].answer;state.completeResult[i]=good?'right':'wrong';if(good&&prev!=='right')success();else if(!good)sound('error');}saveUpdate();}if(el.dataset?.check!==undefined){state.checks[el.dataset.check]=el.checked;saveUpdate();}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&state.menu){state.menu=false;render();}if(ev.altKey&&(ev.key==='ArrowRight'||ev.key==='ArrowLeft')){ev.preventDefault();let idx=SCREENS.findIndex(x=>x.id===state.page);navigate(SCREENS[Math.max(0,Math.min(8,idx+(ev.key==='ArrowRight'?1:-1)))].id);}});
// Sentence segmentation preserves genuinely independent English and Spanish translations.
const TOriginal=T;
T=function(obj,key,opts={}){
 if(!obj||opts.noSplit)return TOriginal(obj,key,opts);
 const split=s=>s.split(/(?<=[.!?])\s+(?=[¿¡A-ZÁÉÍÓÚ])/u).filter(Boolean);
 let es=split(obj.es),en=split(obj.en);
 if(es.length>1&&es.length===en.length)return es.map((s,i)=>TOriginal(P(s,en[i]),key+'_'+i,{...opts,noSplit:true})).join('');
 return TOriginal(obj,key,opts);
};
render();
</script></body></html>
